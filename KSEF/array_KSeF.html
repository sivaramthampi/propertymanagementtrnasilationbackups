<!DOCTYPE html>
<html>
<head>
    <title>KSeF Integration</title>
    <style>
        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            color: #323130;
            margin: 0;
            padding: 0px 12px 15px 12px;
            background-color: #fff;
            overflow-x: hidden;
        }

        .section-header {
            font-size: 11px;
            font-weight: 700;
            color: #0078d4;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid #0078d4;
            display: block;
            width: 100%;
        }

        .ksef-container {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        /* QR card */
        .qr-section {
            flex: 0 0 auto;
            text-align: center;
        }

        .qr-card {
            border-radius: 10px;
            padding: 10px 10px 0px 10px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-card.ksef-card {
            background: #f0f6ff;
            border: 1.5px solid #b3d0f0;
        }

        .qr-card.offline-card {
            background: #fffbf0;
            border: 1.5px solid #f0d878;
        }

        .qr-type-pill {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 2px 9px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .ksef-card .qr-type-pill {
            background: #0078d4;
            color: #fff;
        }

        .offline-card .qr-type-pill {
            background: #c8960c;
            color: #fff;
        }

        .qr-wrapper {
            background: #ffffff;
            border-radius: 6px;
            padding: 8px;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .ksef-card .qr-wrapper {
            border: 1px solid #b3d0f0;
        }

        .offline-card .qr-wrapper {
            border: 1px solid #f0d878;
        }

        .qr-wrapper img {
            display: block;
            width: 155px;
            height: 155px;
        }

        .qr-placeholder {
            width: 155px;
            height: 155px;
            background: #f3f2f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a19f9d;
            font-size: 12px;
        }

        .qr-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px 4px;
            width: 100%;
        }

        .qr-link a {
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .ksef-card .qr-link a { color: #0078d4; }
        .offline-card .qr-link a { color: #a67c00; }

        .qr-link a:hover { text-decoration: underline; }

        /* Sweep shimmer */
        @keyframes sweep {
            0%   { transform: translateX(-120%); }
            60%  { transform: translateX(400%); }
            100% { transform: translateX(400%); }
        }

        .qr-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 28%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            animation: sweep 3.2s ease-in-out infinite;
            pointer-events: none;
        }

        .qr-section:nth-child(3) .qr-wrapper::after { animation-delay: 1.1s; }
        .qr-section:nth-child(5) .qr-wrapper::after { animation-delay: 2.2s; }

        /* Card pulse glow */
        @keyframes ksef-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,120,212,0.0), 0 2px 10px rgba(0,120,212,0.06); }
            50%      { box-shadow: 0 0 0 4px rgba(0,120,212,0.10), 0 4px 18px rgba(0,120,212,0.12); }
        }

        @keyframes offline-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(200,150,12,0.0), 0 2px 10px rgba(200,150,12,0.06); }
            50%      { box-shadow: 0 0 0 4px rgba(200,150,12,0.12), 0 4px 18px rgba(200,150,12,0.12); }
        }

        .ksef-card  { animation: ksef-pulse    3.4s ease-in-out infinite; }
        .offline-card { animation: offline-pulse 3.4s ease-in-out infinite; }
        .qr-section:nth-child(3) .qr-card { animation-delay: 1.1s; }
        .qr-section:nth-child(5) .qr-card { animation-delay: 2.2s; }

        /* Divider */
        .qr-divider {
            width: 1px;
            background: #edebe9;
            align-self: stretch;
            margin: 0 4px;
        }

        /* Details panel */
        .details-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 2px;
            min-width: 160px;
        }

        .field-group { display: flex; flex-direction: column; gap: 2px; }

        .label {
            font-size: 10px;
            font-weight: 700;
            color: #8a8886;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .value {
            font-size: 13px;
            color: #201f1e;
            font-weight: 400;
            word-break: break-all;
            line-height: 1.4;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px 3px 7px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }

        .status-badge::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .badge-approved {
            background: #dff6dd;
            color: #0b6a0b;
            border: 1px solid #a7e6a0;
        }
        .badge-approved::before { background: #107c10; }

        .badge-offline {
            background: #fff4ce;
            color: #7a4f00;
            border: 1px solid #f0d060;
        }
        .badge-offline::before { background: #c8960c; }

        .badge-default {
            background: #f3f2f1;
            color: #323130;
            border: 1px solid #d2d0ce;
        }
        .badge-default::before { background: #8a8886; }

        .details-divider {
            height: 1px;
            background: #edebe9;
            margin: 2px 0;
        }

        .offline-note {
            font-size: 11px;
            color: #7a4f00;
            background: #fff4ce;
            border: 1px solid #f0d060;
            border-left: 3px solid #c8960c;
            border-radius: 0 4px 4px 0;
            padding: 5px 9px;
            line-height: 1.5;
        }

        .offline-note.failed-note {
            color: #a4262c;
            background: #fde7e9;
            border: 1px solid #f3acb4;
            border-left: 3px solid #a4262c;
        }

        @media (max-width: 460px) {
            .ksef-container { flex-direction: column; gap: 12px; }
            .qr-divider { width: 100%; height: 1px; margin: 4px 0; }
        }
    </style>
</head>
<body>
    <div id="content">
        <div style="padding: 10px;">Loading KSeF Process...</div>
    </div>

<script>
    function hideParentSection() {
        try {
            const iframe = window.frameElement;
            if (!iframe) return;
            const section = iframe.closest("section");
            if (section) section.style.display = "none";
        } catch (e) {
            console.warn("Unable to hide parent section", e);
        }
    }

    function toQrSrc(base64) {
        if (!base64) return null;
        return base64.startsWith('data:image') ? base64 : `data:image/png;base64,${base64}`;
    }

    function qrBlock(qrSrc, label, url) {
        const img = qrSrc
            ? `<img src="${qrSrc}" alt="${label}" />`
            : `<div class="qr-placeholder">No QR</div>`;

        const linkHtml = url
            ? `<div class="qr-link"><a href="${url}" target="_blank">Open link &#10132;</a></div>`
            : '';

        return `
            <div class="qr-section">
                <div class="qr-wrapper">${img}</div>
                <div class="ambient-bar"></div>
                <div class="qr-label">${label}</div>
                ${linkHtml}
            </div>`;
    }

    function getBadgeClass(statusValue) {
        if (statusValue === '126330002') return 'badge-approved';
        if (statusValue === '126330004') return 'badge-offline';
        return 'badge-default';
    }

    document.addEventListener("DOMContentLoaded", function () {
        const context = window.parent.Xrm;
        const invoiceId = context.Page.data.entity.getId()?.replace('{', '').replace('}', '');

        if (!invoiceId) {
            hideParentSection();
            return;
        }

        const select = [
            "array_ksefapproveddate",
            "array_ksefno",
            "array_ksefqrbase64",
            "array_ksefstatus",
            "array_ksefurl",
            "array_ksefmode",
            "array_offlinemodeqrkode1",
            "array_offlinekodiurl",
            "array_offlinemodeqrkode2",
            "array_offlinekodiiurl"
        ].join(",");

        context.WebApi.retrieveRecord("invoice", invoiceId, `?$select=${select}`).then(
            function success(result) {
                const ksefNo = result.array_ksefno;

                const statusValue = result["array_ksefstatus"] != null
                    ? String(result["array_ksefstatus"])
                    : null;

                const modeValue = result["array_ksefmode"] != null
                    ? String(result["array_ksefmode"])
                    : null;

                const hasOfflineQr1 = !!result.array_offlinemodeqrkode1;
                const hasOfflineQr2 = !!result.array_offlinemodeqrkode2;
                const isOfflineStatus = statusValue === '126330004';

                // NEW: status 126330001 or 126330003 combined with mode 126330001
                const isStatus001WithMode001 = statusValue === '126330001' && modeValue === '126330001';
                const isStatus003WithMode001 = statusValue === '126330003' && modeValue === '126330001';

                // For offline status: keep widget if any offline QR exists
                // For all other statuses: keep widget only if ksefNo exists
                if (isOfflineStatus) {
                    if (!hasOfflineQr1 && !hasOfflineQr2) {
                        hideParentSection();
                        return;
                    }
                } else if (isStatus001WithMode001 || isStatus003WithMode001) {
                    if (!hasOfflineQr1 && !hasOfflineQr2) {
                        hideParentSection();
                        return;
                    }
                } else {
                    if (!ksefNo) {
                        hideParentSection();
                        return;
                    }
                }
                const statusLabel = result["array_ksefstatus@OData.Community.Display.V1.FormattedValue"] || "N/A";
                const date = result["array_ksefapproveddate@OData.Community.Display.V1.FormattedValue"] || "---";

                // Main QR (online/approved)
                const mainQrSrc = toQrSrc(result.array_ksefqrbase64);
                const mainUrl = result.array_ksefurl;

                // Offline QR 1
                const offlineQr1Src = toQrSrc(result.array_offlinemodeqrkode1);
                const offlineUrl1 = result.array_offlinekodiurl;

                // Offline QR 2
                const offlineQr2Src = toQrSrc(result.array_offlinemodeqrkode2);
                const offlineUrl2 = result.array_offlinekodiiurl;

                let qrBlocksHtml = '';
                
                let offlineNoteHtml = '';

                // STATUS: 126330004— Offline mode only: show QR1 + QR2
                if (statusValue === '126330004') {
                    qrBlocksHtml =
                        qrBlock(offlineQr1Src, 'Kod offline – Faktura', offlineUrl1) +
                        (offlineQr2Src
                            ? `<div class="qr-divider"></div>` + qrBlock(offlineQr2Src, 'Kod offline – Certyfikat', offlineUrl2)
                            : '') ;

                    offlineNoteHtml = `<div class="offline-note">&#9888; Invoice is in Offline Mode — not yet submitted to KSeF</div>`;

                // STATUS: 126330002 — Approved online: show main QR + QR2 (if exists)
                } else if (statusValue === '126330002') {
                    qrBlocksHtml =
                        qrBlock(mainQrSrc, 'KSeF QR Code', mainUrl) +
                        (offlineQr2Src
                            ? `<div class="qr-divider"></div>` + qrBlock(offlineQr2Src, 'Kod offline – Certyfikat', offlineUrl2)
                            : '');

                // NEW STATUS: 126330001 with mode 126330001 — show QR1 + QR2 if they exist
                } else if (isStatus001WithMode001) {
                    qrBlocksHtml =
                        (offlineQr1Src ? qrBlock(offlineQr1Src, 'Kod offline – Faktura', offlineUrl1) : '') +
                        (offlineQr1Src && offlineQr2Src ? `<div class="qr-divider"></div>` : '') +
                        (offlineQr2Src ? qrBlock(offlineQr2Src, 'Kod offline – Certyfikat', offlineUrl2) : '');

                    offlineNoteHtml = `<div class="offline-note">&#9888; Sent to KSeF — not yet approved</div>`;

                // NEW STATUS: 126330003 with mode 126330001 — show QR1 + QR2 if they exist
                } else if (isStatus003WithMode001) {
                    qrBlocksHtml =
                        (offlineQr1Src ? qrBlock(offlineQr1Src, 'Kod offline – Faktura', offlineUrl1) : '') +
                        (offlineQr1Src && offlineQr2Src ? `<div class="qr-divider"></div>` : '') +
                        (offlineQr2Src ? qrBlock(offlineQr2Src, 'Kod offline – Certyfikat', offlineUrl2) : '');

                    offlineNoteHtml = `<div class="offline-note failed-note">&#9888; Sent to KSeF — but failed</div>`;

                // Fallback: any other status — show main QR only, ignore offline QRs
                } else {
                    qrBlocksHtml = mainQrSrc
                        ? qrBlock(mainQrSrc, 'KSeF QR Code', mainUrl)
                        : '';
                }

                const badgeClass = getBadgeClass(statusValue);

                document.getElementById("content").innerHTML = `
                    <div class="section-header">KSeF Status &amp; Verification</div>

                    <div class="ksef-container">
                        ${qrBlocksHtml}

                        <div class="details-section">
                            ${ksefNo ? `
                            <div class="field-group">
                                <div class="label">KSeF Number</div>
                                <div class="value" style="font-weight:600;">${ksefNo}</div>
                            </div>` : ''}

                            <div class="field-group">
                                <div class="label">KSeF Status</div>
                                <div class="value">
                                    <span class="status-badge ${badgeClass}">${statusLabel}</span>
                                </div>
                            </div>

                            ${offlineNoteHtml}

                            ${date && date !== '---' ? `
                            <div class="field-group">
                                <div class="label">Approved Date</div>
                                <div class="value">${date}</div>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            },
            function (error) {
                console.error(error.message);
                hideParentSection();
            }
        );
    });
</script>
</body>
</html>
