<!DOCTYPE html>
<html><head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Automated Invoice Forecast</title>
    <style>
      :root {
        --ar-g1: #f5f5f7;
        --ar-g2: #f2f2f2;
        --ar-g3: #e8e8ed;
        --ar-g4: #d2d2d7;
        --ar-g5: #aeaeb2;
        --ar-g6: #8e8e93;
        --ar-g7: #636366;
        --ar-g8: #3a3a3c;
        --ar-g9: #1d1d1f;
        --ar-white: #fff;
        --ar-bg: #f5f5f7;
        --ar-blue: #0071e3;
        --ar-blue-d: #0077ed;
        --ar-blue-l: rgba(0, 113, 227, 0.08);
        --ar-blue-g: rgba(0, 113, 227, 0.14);
        --ar-blue-mid: rgba(0, 113, 227, 0.3);
        --ar-green: #34c759;
        --ar-red: #ff3b30;
        --ar-amber: #ff9f0a;
        --ar-font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Segoe UI Variable",
          system-ui, Roboto, Helvetica, Arial, sans-serif;
        --ar-r: 12px;
        --ar-r-sm: 8px;
        --ar-r-lg: 18px;
        --ar-sh-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
        --ar-sh-sm:
          0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --ar-sh-md:
          0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
      }
      * { box-sizing: border-box; }
      body {
        font-family: var(--ar-font);
        font-size: 13px;
        color: var(--ar-g9);
        background: var(--ar-bg);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--ar-g4); border-radius: 99px; }
      ::-webkit-scrollbar-track { background: transparent; }

      /* Header */
      .ui-header {
        background: linear-gradient(135deg, #0b3a82 0%, #1C6BD4 100%);
        border-bottom: none;
        padding: 16px 24px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 14px rgba(11,58,130,0.20);
      }
      .ui-header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ui-header h1 svg { color: rgba(255,255,255,0.92); }

      .ui-body { padding: 20px 22px 40px; }

      /* Toolbar card */
      .card {
        background: var(--ar-white);
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r);
        box-shadow: var(--ar-sh-sm);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .toolbar {
        padding: 12px 14px;
        display: flex;
        flex-wrap: nowrap;
        gap: 10px;
        align-items: flex-end;
        overflow-x: auto;
      }
      .toolbar::-webkit-scrollbar { height: 4px; }
      .field { display: flex; flex-direction: column; flex-shrink: 0; }
      .field label {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--ar-g6);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      .field input, .field select {
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r-sm);
        padding: 6px 10px;
        font-size: 12.5px;
        font-family: inherit;
        color: var(--ar-g9);
        background: var(--ar-white);
        min-width: 0;
        height: 34px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .field.f-month input { width: 130px; }
      .field.f-sm select { width: 130px; }
      .field.f-md select { width: 160px; }
      .field.f-lg select { width: 200px; }
      .field input:focus, .field select:focus {
        border-color: var(--ar-blue);
        box-shadow: 0 0 0 3px var(--ar-blue-g);
      }

      /* Buttons — pill style */
      .btn {
        border: none;
        border-radius: 980px;
        padding: 7px 16px;
        font-size: 12.5px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        letter-spacing: -0.005em;
        transition: background 0.15s, opacity 0.15s;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .btn-primary { background: var(--ar-blue); color: #fff; }
      .btn-primary:hover { background: var(--ar-blue-d); }
      .btn-secondary {
        background: var(--ar-g2);
        color: var(--ar-g8);
        border: 1px solid var(--ar-g3);
      }
      .btn-secondary:hover { background: var(--ar-g3); }
      .btn-soft {
        background: var(--ar-blue-l);
        color: var(--ar-blue);
      }
      .btn-soft:hover { background: var(--ar-blue-g); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }

      /* FX banner */
      .banner {
        background: var(--ar-blue-l);
        border: 1px solid transparent;
        border-radius: var(--ar-r);
        padding: 12px 16px;
        font-size: 13px;
        color: var(--ar-g8);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .banner strong { color: var(--ar-blue); font-weight: 600; }
      .banner.warn {
        background: rgba(255,159,10,0.10);
        color: #7a4c00;
      }
      .banner.warn strong { color: #b25000; }

      /* Stat bar — card grid */
      #summary.card { background: transparent; border: none; box-shadow: none; overflow: visible; }
      .stats {
        padding: 4px 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .stat {
        background: var(--ar-white);
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: var(--ar-sh-xs);
        transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
      }
      .stat:hover {
        box-shadow: var(--ar-sh-sm);
        transform: translateY(-1px);
        border-color: var(--ar-blue-mid);
      }
      .stat .label {
        font-size: 11px;
        color: var(--ar-g6);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }
      .stat .value {
        font-family: var(--ar-font);
        font-variant-numeric: tabular-nums;
        font-size: 21px;
        font-weight: 700;
        color: var(--ar-g9);
        letter-spacing: -0.02em;
      }
      .stat.stat-accent { border-top: 3px solid var(--ar-blue); }
      .stat.stat-accent .value { color: var(--ar-blue-d); }

      /* Date block — top-level collapsible card */
      .date-block {
        background: var(--ar-white);
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r);
        box-shadow: var(--ar-sh-xs);
        overflow: hidden;
        margin-bottom: 12px;
      }
      .date-block.collapsed .date-content { display: none; }
      .date-content { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .date-content > table { min-width: 1000px; }
      .date-header {
        padding: 14px 18px;
        background: var(--ar-white);
        border-left: 3px solid var(--ar-blue);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ar-g9);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: background 0.15s;
        user-select: none;
      }
      .date-header:hover { background: var(--ar-blue-l); }
      .date-block:not(.collapsed) .date-header { border-bottom: 1px solid var(--ar-g3); }
      .date-header .d-date { display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; }
      .date-header .d-label {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ar-g6);
      }
      .date-header .d-value { font-size: 14px; font-weight: 700; color: var(--ar-g9); }
      .date-header .d-chevron {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--ar-blue-g);
        color: var(--ar-blue);
        font-size: 11px;
        transition: transform 0.18s ease;
        transform: rotate(90deg);
      }
      .date-block.collapsed .d-chevron { transform: rotate(0deg); }
      .date-header .d-meta { color: var(--ar-g6); font-weight: 500; font-size: 12px; }
      .date-header .d-meta strong { color: var(--ar-g8); font-weight: 600; }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--ar-white);
      }
      thead th {
        background: var(--ar-blue-g);
        color: var(--ar-blue-d);
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 10px 12px;
        text-align: left;
        border-bottom: 2px solid var(--ar-blue-mid);
        white-space: nowrap;
      }
      tbody td {
        padding: 11px 12px;
        font-size: 12.5px;
        color: var(--ar-g9);
        border-bottom: 1px solid var(--ar-g3);
        vertical-align: middle;
      }
      tbody tr:last-child td { border-bottom: none; }
      tr.group-row {
        background: var(--ar-white);
        cursor: pointer;
        transition: background 0.15s;
      }
      tr.group-row:hover { background: var(--ar-g1); }
      tr.child-row { display: none; }
      tr.child-row.visible { display: table-row; }
      tr.child-row > td { padding: 0; background: var(--ar-blue-l); }
      .detail-wrap {
        padding: 2px 18px 18px 46px;
        border-left: 3px solid #5a6b85;
      }
      .detail-title {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #5a6b85;
        padding: 12px 0 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .detail-title svg { width: 13px; height: 13px; }
      .detail-wrap .subtable {
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r-sm);
        overflow: hidden;
        box-shadow: var(--ar-sh-xs);
      }

      .toggle-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--ar-g2);
        color: var(--ar-g7);
        font-family: inherit;
        font-size: 9px;
        transition: background 0.15s, color 0.15s, transform 0.18s ease;
      }
      tr.group-row:hover .toggle-icon { background: var(--ar-blue-g); color: var(--ar-blue); }
      tr.group-row.open .toggle-icon { background: var(--ar-blue); color: #fff; transform: rotate(90deg); }
      tr.group-row.open { background: var(--ar-blue-l); }
      tr.group-row.open > td { border-bottom-color: transparent; font-weight: 500; }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 10px;
        font-weight: 600;
        margin-left: 4px;
        vertical-align: middle;
      }
      .badge-info  { background: var(--ar-blue-l); color: var(--ar-blue); }
      .badge-warn  { background: rgba(255,159,10,0.12); color: #b25000; }
      .badge-term  { background: var(--ar-g2); color: var(--ar-g7); }
      .badge-success { background: rgba(52,199,89,0.14); color: #1a7a34; }

      /* Custom searchable dropdown */
      .combobox {
        position: relative;
        z-index: 100;
      }
      .combobox.open {
        z-index: 6000;
      }
      .combobox-input {
        cursor: text;
        padding-right: 26px !important;
      }
      .combobox-caret {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--ar-g6);
        font-size: 10px;
        transition: transform 0.15s ease;
      }
      .combobox.open .combobox-caret {
        transform: translateY(-50%) rotate(180deg);
      }
      .combobox-clear {
        position: absolute;
        right: 22px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--ar-g6);
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
        user-select: none;
        display: none;
      }
      .combobox-clear:hover {
        background: var(--ar-g2);
        color: var(--ar-g8);
      }
      .combobox.has-value .combobox-clear { display: block; }
      .combobox-list {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        max-height: 260px;
        overflow-y: auto;
        background: var(--ar-white);
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r-sm);
        box-shadow: var(--ar-sh-md);
        z-index: 5000;
        display: none;
        min-width: 220px;
      }
      .combobox.open .combobox-list { display: block; }
      .combobox-option {
        padding: 8px 12px;
        font-size: 13px;
        color: var(--ar-g9);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .combobox-option:hover,
      .combobox-option.highlight {
        background: var(--ar-blue-l);
        color: var(--ar-blue-d);
      }
      .combobox-empty {
        padding: 12px;
        color: var(--ar-g6);
        font-size: 12px;
        text-align: center;
        font-style: italic;
      }

      .amt {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-family: var(--ar-font);
        font-size: 12.5px;
      }
      .amt-pln { color: var(--ar-blue); font-weight: 600; }
      .amt-native { color: var(--ar-g6); font-size: 11.5px; }

      .link-icon {
        color: var(--ar-blue);
        text-decoration: none;
        margin-left: 5px;
        font-size: 12px;
        opacity: 0.7;
        transition: opacity 0.15s;
      }
      .link-icon:hover { opacity: 1; }

      /* Product sub-table */
      .subtable {
        width: 100%;
        border-collapse: collapse;
        background: var(--ar-g1);
      }
      .subtable thead th {
        background: #eef1f6;
        color: #5a6b85;
        border-bottom: 1px solid #d6dde8;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 8px 12px;
      }
      .subtable tbody td {
        background: var(--ar-g1);
        border-bottom: 1px solid var(--ar-g3);
        font-size: 12px;
        padding: 9px 12px;
      }
      .subtable tfoot tr td {
        background: var(--ar-white);
        border-top: 1px solid var(--ar-g3);
        font-weight: 600;
        padding: 10px 12px;
      }
      .product-name { font-weight: 600; color: var(--ar-g9); }
      .product-sub { color: var(--ar-g6); font-size: 11px; margin-top: 2px; }
      .period-cell { font-size: 11px; }
      .period-freq { color: var(--ar-g6); }

      th.sortable { cursor: pointer; user-select: none; }
      th.sortable:hover { background: var(--ar-blue-mid); color: #fff; }
      th.sortable .arrow { opacity: 0.5; margin-left: 4px; font-size: 9px; }
      th.sortable.active .arrow { opacity: 1; }

      .loader {
        text-align: center;
        padding: 60px 20px;
        color: var(--ar-g6);
        font-size: 13px;
      }
      .spinner {
        display: inline-block;
        width: 22px;
        height: 22px;
        border: 2.5px solid var(--ar-g3);
        border-top-color: var(--ar-blue);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--ar-g6);
        background: var(--ar-white);
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r);
      }
      .err {
        background: rgba(255,59,48,0.08);
        color: var(--ar-red);
        border: 1px solid rgba(255,59,48,0.20);
        padding: 12px 16px;
        border-radius: var(--ar-r);
        margin-bottom: 16px;
        font-size: 13px;
      }

      /* Responsive */
      @media (max-width: 720px) {
        .ui-header { padding: 14px 16px; }
        .ui-header h1 { font-size: 16px; }
        .ui-body { padding: 14px 12px 32px; }
        .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat { padding: 12px 14px; }
        .stat .value { font-size: 18px; }
        .date-header { padding: 12px 14px; }
        .date-header .d-value { font-size: 13px; }
        .date-header .d-meta { font-size: 11px; }
        .toolbar { padding: 10px 12px; }
      }
      @media (max-width: 440px) {
        .stats { grid-template-columns: 1fr 1fr; }
        .stat .value { font-size: 16px; }
      }

      /* ══════════════════════════════════════════════════════════════
         LEASE AMENDMENT UI DESIGN LAYER — appended last, wins by cascade.
         Mirrors the frosted-glass header, refined shadows, and modal
         polish from the Lease Amendment web resource.
         ══════════════════════════════════════════════════════════════ */

      body {
        -webkit-font-smoothing: antialiased;
      }

      /* Frosted-glass header (replaces navy gradient) */
      .ui-header {
        background: rgba(255, 255, 255, 0.85) !important;
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
        box-shadow: none !important;
      }
      .ui-header h1 {
        color: var(--ar-g9) !important;
        font-weight: 600 !important;
        letter-spacing: -0.015em !important;
      }
      .ui-header h1 svg {
        color: var(--ar-g9) !important;
        stroke: var(--ar-g9) !important;
      }

      /* Cards & date blocks — refined shadow */
      .card,
      .date-block {
        box-shadow: var(--ar-sh-sm) !important;
      }

      /* Stat cards — softer hover */
      .stat {
        transition: box-shadow 0.18s ease, transform 0.18s ease,
          border-color 0.18s ease !important;
      }
      .stat:hover {
        border-color: var(--ar-blue-mid) !important;
      }

      /* Table headers — cleaner tint */
      thead th {
        background: var(--ar-blue-g) !important;
        color: var(--ar-blue-d) !important;
        border-bottom: 2px solid var(--ar-blue-mid) !important;
      }

      /* Frosted-glass footer bars (if any added later) */
      .wizard-footer-nav {
        background: rgba(255, 255, 255, 0.9) !important;
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-top: 1px solid var(--ar-g3) !important;
        box-shadow: none !important;
      }

      /* Toast notification system (drop-in for future notify() calls) */
      .ar-toast-wrap {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 2147483600;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-family: var(--ar-font);
      }
      .ar-toast {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: #fff;
        border: 1px solid var(--ar-g3);
        border-radius: var(--ar-r);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10),
          0 2px 8px rgba(0, 0, 0, 0.05);
        padding: 14px 16px;
        min-width: 300px;
        max-width: 380px;
        position: relative;
        overflow: hidden;
        animation: arToastIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .ar-toast::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
      }
      .ar-toast.success::before { background: var(--ar-green); }
      .ar-toast.error::before   { background: var(--ar-red); }
      .ar-toast.info::before    { background: var(--ar-blue); }
      .ar-toast.warning::before { background: var(--ar-amber); }
      .ar-toast .ar-ic {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.78em;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .ar-toast.success .ar-ic { background: var(--ar-green); }
      .ar-toast.error   .ar-ic { background: var(--ar-red); }
      .ar-toast.info    .ar-ic { background: var(--ar-blue); }
      .ar-toast.warning .ar-ic { background: var(--ar-amber); }
      .ar-toast .ar-tc { flex: 1; min-width: 0; }
      .ar-toast .ar-tt {
        font-size: 0.88em;
        font-weight: 600;
        color: var(--ar-g9);
      }
      .ar-toast .ar-tm {
        font-size: 0.82em;
        color: var(--ar-g6);
        margin-top: 2px;
        line-height: 1.4;
        word-break: break-word;
      }
      .ar-toast .ar-tx {
        background: none;
        border: none;
        color: var(--ar-g5);
        cursor: pointer;
        font-size: 1.1em;
        line-height: 1;
        padding: 0 2px;
      }
      @keyframes arToastIn {
        from { opacity: 0; transform: translateX(20px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* ══════════════════════════════════════════════════════════════

    <script>
      // ================================================================
      // Array Lease Management — Upcoming Invoices
      // Source: array_recurringcharge, projected forward to lease/RC end
      // ================================================================

      var Xrm = window.parent.Xrm;
      var _allRCs = [];
      var _projections = [];
      var _filtered = [];
      var _leaseNameMap = {};
      var _leaseCodeMap = {}; // leaseId -> array_leaserecordid (business code, e.g. "PB-PL-003-ST-LA54")
      var _leaseStatusMap = {}; // leaseId -> { statecode, statuscode }
      // Label→id maps for searchable filter inputs
      var _propLabelToId = {};
      var _tenantLabelToId = {};
      var _leaseLabelToId = {};
      var _leaseTermMap = {};
      var _leaseEndMap = {};
      var _chargeTypeMap = {};
      var _discountsByLease = {};
      var _vatMap = {};
      var _clauseMap = {}; // clauseId -> { type: string } (Step Rent / CPI / Turnover)
      var _invoiceMap = {}; // "leaseId|invoiceTypeId|YYYY-MM-DD" -> invoice header record
      var _invoiceLineMap = {}; // invoiceId -> [invoicedetail records]
      var _invoiceOriginalMap = {}; // correctiveId -> originalInvoiceId
      var _tenantNIPMap = {}; // tenantId -> NIP string
      var _unitAreaMap = {}; // unitId -> area sq m
      var _bankAccountMap = {}; // "propertyId|currencyId" -> bank account number
      var _leasePropertyMap = {}; // leaseId -> propertyId (from lease agreement)
      var _fxRate = null;
      var _plnCurrencyId = null;

      // ---------- Utilities ----------
      function fmtDate(d) {
        if (!d) return "";
        var dt = d instanceof Date ? d : new Date(d);
        if (isNaN(dt)) return "";
        return (
          String(dt.getDate()).padStart(2, "0") +
          "/" +
          String(dt.getMonth() + 1).padStart(2, "0") +
          "/" +
          dt.getFullYear()
        );
      }
      function fmtAmt(n) {
        if (n == null || isNaN(n)) return "";
        return Number(n).toLocaleString("pl-PL", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      // Area is a measurement (m²), not currency — use en-US format with a DOT decimal.
      // Trims trailing zeros so 209.00 shows as 209, 209.5 shows as 209.5.
      function fmtArea(n) {
        if (n == null || isNaN(n)) return "";
        return Number(n).toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2,
          useGrouping: false,
        });
      }
      function ccySym(code) {
        var raw = code || "";
        var up = raw.toUpperCase();
        // PLN — English "PLN"/"Polish Zloty" AND Polish "Polski złoty" (with Ł diacritic)
        if (
          /ł/i.test(raw) ||
          up.indexOf("PLN") >= 0 ||
          up.indexOf("ZLOT") >= 0 ||
          up.indexOf("POLISH") >= 0 ||
          up.indexOf("POLSKI") >= 0
        )
          return "zł";
        if (up.indexOf("EUR") >= 0) return "€";
        if (up.indexOf("USD") >= 0 || up.indexOf("DOLLAR") >= 0) return "$";
        if (up.indexOf("GBP") >= 0 || up.indexOf("POUND") >= 0) return "£";
        return up.substring(0, 3);
      }
      // Normalize any currency label (formatted value like "Polish zloty", "Euro", ISO like "EUR")
      // to its ISO code for use as a stable lookup key across entities.
      function ccyCode(code) {
        var raw = code || "";
        var up = raw.toUpperCase();
        if (
          /ł/i.test(raw) ||
          up.indexOf("PLN") >= 0 ||
          up.indexOf("ZLOT") >= 0 ||
          up.indexOf("POLISH") >= 0 ||
          up.indexOf("POLSKI") >= 0
        )
          return "PLN";
        if (up.indexOf("EUR") >= 0) return "EUR";
        if (up.indexOf("USD") >= 0 || up.indexOf("DOLLAR") >= 0) return "USD";
        if (up.indexOf("GBP") >= 0 || up.indexOf("POUND") >= 0) return "GBP";
        // Fallback: first 3 uppercase letters
        return up.replace(/[^A-Z]/g, "").substring(0, 3);
      }
      function fmtPLN(n) {
        var s = fmtAmt(n);
        return s ? s + " zł" : "";
      }
      function fmtCcy(n, code) {
        var s = fmtAmt(n);
        return s ? s + " " + ccySym(code) : "";
      }
      // True when a row's native currency label starts with "EUR"
      function isEurRow(r) {
        return (
          r &&
          r.nativeCurrency &&
          String(r.nativeCurrency).toUpperCase().indexOf("EUR") >= 0
        );
      }
      function yMonth(d) {
        return (
          d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
        );
      }
      function ymd(d) {
        return (
          d.getUTCFullYear() +
          "-" +
          String(d.getUTCMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getUTCDate()).padStart(2, "0")
        );
      }
      function monthLabel(ym) {
        var p = ym.split("-");
        return new Date(p[0], p[1] - 1, 1).toLocaleDateString("en-GB", {
          month: "long",
          year: "numeric",
        });
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function addMonthsSafely(dateStr, months) {
        var d = new Date(dateStr);
        var day = d.getUTCDate();
        var target = new Date(
          Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + months, 1),
        );
        var lastDay = new Date(
          Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0),
        ).getUTCDate();
        target.setUTCDate(Math.min(day, lastDay));
        return target;
      }
      function addDays(dateStr, days) {
        var d = new Date(dateStr);
        d.setUTCDate(d.getUTCDate() + days);
        return d;
      }
      function endOfMonth(dateInput) {
        var d = dateInput instanceof Date ? dateInput : new Date(dateInput);
        return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0));
      }
      function startOfMonth(dateInput) {
        var d = dateInput instanceof Date ? dateInput : new Date(dateInput);
        return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
      }
      function openRecord(entity, id) {
        try {
          window.parent.Xrm.Navigation.openForm({
            entityName: entity,
            entityId: id,
          });
        } catch (e) {
          console.warn(e);
        }
      }
      window.openRecord = openRecord;

      function computeDueDate(invoiceDate, ruleCode, dueInDays) {
        if (!invoiceDate) return null;
        var d = new Date(invoiceDate);
        dueInDays = dueInDays || 0;
        switch (ruleCode) {
          case 126330000:
            return addDays(invoiceDate, dueInDays);
          // On receipt of sales document: treat receipt (= invoice/generation date) as the anchor
          // and add the configured number of days (per tester; overrides the doc's "immediate").
          case 126330001:
            return addDays(invoiceDate, dueInDays);
          case 126330002:
            var candidate = new Date(
              Date.UTC(
                d.getUTCFullYear(),
                d.getUTCMonth(),
                Math.min(dueInDays, endOfMonth(d).getUTCDate()),
              ),
            );
            if (candidate < d)
              candidate = new Date(
                Date.UTC(
                  d.getUTCFullYear(),
                  d.getUTCMonth() + 1,
                  Math.min(
                    dueInDays,
                    endOfMonth(addMonthsSafely(invoiceDate, 1)).getUTCDate(),
                  ),
                ),
              );
            return candidate;
          case 126330004:
            var nextMonth = new Date(
              Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1),
            );
            return new Date(
              Date.UTC(
                nextMonth.getUTCFullYear(),
                nextMonth.getUTCMonth(),
                Math.min(dueInDays, endOfMonth(nextMonth).getUTCDate()),
              ),
            );
          case 126330005:
            var m2 = new Date(
              Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 2, 1),
            );
            return new Date(
              Date.UTC(
                m2.getUTCFullYear(),
                m2.getUTCMonth(),
                Math.min(dueInDays, endOfMonth(m2).getUTCDate()),
              ),
            );
          case 126330006:
            return endOfMonth(d);
          default:
            return addDays(invoiceDate, dueInDays);
        }
      }
      function advanceCycle(invoiceDate, freq) {
        switch (freq) {
          case 126330000:
            return addMonthsSafely(invoiceDate, 1);
          case 126330001:
            return addMonthsSafely(invoiceDate, 12);
          case 126330003:
            return addDays(invoiceDate, 1);
          case 126330004:
            return addDays(invoiceDate, 7);
          case 126330005:
            return addMonthsSafely(invoiceDate, 3);
          default:
            return null;
        }
      }
      function advanceFreqEnd(freqEnd, freq) {
        return advanceCycle(freqEnd, freq);
      }

      // ---------- Init ----------
      function populateMonths() {
        var sel = document.getElementById("fltMonth");
        var prev = sel.value;
        var n = parseInt(document.getElementById("fltHorizon").value, 10) || 12;
        var base = new Date();
        sel.innerHTML = "";
        var matched = false;
        for (var i = 0; i < n; i++) {
          var d = new Date(
            Date.UTC(base.getFullYear(), base.getMonth() + i, 1),
          );
          var ym =
            d.getUTCFullYear() +
            "-" +
            String(d.getUTCMonth() + 1).padStart(2, "0");
          var o = document.createElement("option");
          o.value = ym;
          o.textContent = d.toLocaleDateString("en-GB", {
            month: "long",
            year: "numeric",
            timeZone: "UTC",
          });
          if (ym === prev) {
            o.selected = true;
            matched = true;
          }
          sel.appendChild(o);
        }
        // If prior selection fell outside the new range, default to the first month
        if (!matched && sel.options.length) sel.options[0].selected = true;
      }

      // Custom combobox controller: open on click/focus, filter as user types,
      // select on option click, arrow-key navigation, and cascade dependents / re-render.
      function wireCombobox(inputId, listId, boxId, cascade) {
        var input = document.getElementById(inputId);
        var list = document.getElementById(listId);
        var box = document.getElementById(boxId);
        var _renderDebounce;
        function openBox() {
          renderComboboxOptions(inputId, listId, input.value);
          box.classList.add("open");
        }
        function closeBox() { box.classList.remove("open"); }
        function updateClearVisibility() {
          if (input.value) box.classList.add("has-value");
          else box.classList.remove("has-value");
        }
        function commit(cascadeNow) {
          updateClearVisibility();
          if (cascade) populateDependentFilters();
          clearTimeout(_renderDebounce);
          _renderDebounce = setTimeout(applyFiltersAndRender, 200);
        }
        input.addEventListener("focus", openBox);
        input.addEventListener("click", function (e) {
          e.stopPropagation();
          openBox();
        });
        input.addEventListener("input", function () {
          openBox();
          commit();
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            var opts = list.querySelectorAll(".combobox-option");
            if (!opts.length) return;
            var curr = list.querySelector(".combobox-option.highlight");
            var idx = curr ? Array.prototype.indexOf.call(opts, curr) : -1;
            if (curr) curr.classList.remove("highlight");
            idx = e.key === "ArrowDown" ? (idx + 1) % opts.length : (idx - 1 + opts.length) % opts.length;
            opts[idx].classList.add("highlight");
            opts[idx].scrollIntoView({ block: "nearest" });
          } else if (e.key === "Enter") {
            var hl = list.querySelector(".combobox-option.highlight");
            if (hl) {
              e.preventDefault();
              input.value = hl.getAttribute("data-value");
              closeBox();
              commit();
            }
          } else if (e.key === "Escape") {
            closeBox();
          }
        });
        list.addEventListener("mousedown", function (e) {
          // mousedown (not click) so it fires before input blur
          var opt = e.target.closest(".combobox-option");
          if (!opt) return;
          e.preventDefault();
          input.value = opt.getAttribute("data-value");
          closeBox();
          commit();
        });
      }

      function init() {
        var now = new Date();
        populateMonths();
        document.getElementById("fltHorizon").onchange = function () {
          populateMonths();
          applyFiltersAndRender();
        };
        document.getElementById("btnRefresh").onclick = function () {
          // Reset filters to All so results reflect a clean state
          ["fltTerm", "fltProperty", "fltTenant", "fltLease"].forEach(
            function (id) {

        };

      function fetchLatestFX() {
        // Correct schema (doc section 3.10): array_exchangerate, array_validfrom, array_validto, array_currency
        // Currently-active rate = array_validto is null
        var q =
          "?$select=array_exchangerate,array_validfrom,array_validto,_array_currency_value" +
          "&$filter=array_validto eq null" +
          "&$top=10&$orderby=array_validfrom desc";
        return Xrm.WebApi.retrieveMultipleRecords("array_exchangeratelog", q)
          .then(function (r) {
            if (!r.entities || r.entities.length === 0) return null;
            // Prefer EUR
            for (var i = 0; i < r.entities.length; i++) {
              var e = r.entities[i];
              var ccy = (
                e[
                  "_array_currency_value@OData.Community.Display.V1.FormattedValue"
                ] || ""
              ).toUpperCase();
              if (ccy.indexOf("EUR") >= 0)
                return {
                  rate: e.array_exchangerate,
                  date: e.array_validfrom,
                  currency: "EUR",
                };
            }
            var e = r.entities[0];
            return {
              rate: e.array_exchangerate,
              date: e.array_validfrom,
              currency:
                e[
                  "_array_currency_value@OData.Community.Display.V1.FormattedValue"
                ] || "?",

          })
          .catch(function () {
            return null;
          });
      }

      function fetchLeaseInfo(ids) {
        if (!ids || ids.length === 0)
          return Promise.resolve({
            names: {},
            terms: {},
            ends: {},
            props: {},
          });
        // FetchXML with <condition operator="in"> — one call per ~200 ids.
        var chunks = [];
        for (var i = 0; i < ids.length; i += 200)
          chunks.push(ids.slice(i, i + 200));
        var promises = chunks.map(function (chunk) {
          var valuesXml = chunk
            .map(function (id) { return "<value>" + id + "</value>"; })
            .join("");
          var fetchXml =
            '<fetch version="1.0" mapping="logical" no-lock="true">' +
              '<entity name="array_leaseagreement">' +
                '<attribute name="array_leaseagreementid" />' +
                '<attribute name="array_leasename" />' +
                '<attribute name="array_leaserecordid" />' +
                '<attribute name="array_leasetermtype" />' +
                '<attribute name="array_leaseenddate" />' +
                '<attribute name="array_property" />' +
                '<attribute name="statecode" />' +
                '<attribute name="statuscode" />' +
                '<filter type="and">' +
                  '<condition attribute="array_leaseagreementid" operator="in">' + valuesXml + '</condition>' +
                '</filter>' +
              '</entity>' +
            '</fetch>';
          return Xrm.WebApi.retrieveMultipleRecords(
            "array_leaseagreement",

            .catch(function (err) {
              console.warn("Lease info fetch failed:", err && err.message ? err.message : err);
              return [];

        });
        return Promise.all(promises).then(function (all) {
          var names = {},
            codes = {},
            terms = {},
            ends = {},
            props = {},
            statuses = {};
          all.forEach(function (arr) {
            arr.forEach(function (e) {
              // Exclude inactive (statecode≠0) and non-Active statuscodes (Draft, Terminated, etc.)
              // Lease Active per docs = statuscode 126330001. statecode 0 = active state.
              statuses[e.array_leaseagreementid] = {
                statecode: e.statecode,
                statuscode: e.statuscode,
                statuscodeLabel:
                  e[
                    "statuscode@OData.Community.Display.V1.FormattedValue"
                  ] || "",
              };
              if (e.array_leasename)
                names[e.array_leaseagreementid] = e.array_leasename;
              // Business ID (e.g. "PB-PL-003-ST-LA54") — the human-readable lease code
              if (e.array_leaserecordid)
                codes[e.array_leaseagreementid] = e.array_leaserecordid;
              var termLabel =
                e[
                  "array_leasetermtype@OData.Community.Display.V1.FormattedValue"
                ];
              if (termLabel) terms[e.array_leaseagreementid] = termLabel;
              if (e.array_leaseenddate)
                ends[e.array_leaseagreementid] = e.array_leaseenddate;
              if (e._array_property_value)
                props[e.array_leaseagreementid] = e._array_property_value;

          });
          return { names: names, codes: codes, terms: terms, ends: ends, props: props, statuses: statuses };
        });

      function fetchVats(ids) {

        var chunks = [];
        for (var i = 0; i < ids.length; i += 200)
          chunks.push(ids.slice(i, i + 200));

            '<fetch version="1.0" mapping="logical" no-lock="true">' +

              return [];

        });
        return Promise.all(promises).then(function (all) {
          var out = {};
          all.forEach(function (arr) {
            arr.forEach(function (e) {
              // Try, in order: array_rate, array_vat, array_percentage, array_name (parsed)
              var rate = null;
              var candidates = [
                "array_rate",
                "array_vat",
                "array_percentage",
                "array_taxrate",
              ];
              for (var i = 0; i < candidates.length; i++) {
                var v = e[candidates[i]];
                if (v != null && !isNaN(Number(v))) {
                  rate = Number(v);
                  break;
                }

              if (rate == null && e.array_name) {
                var m = String(e.array_name).match(/(-?\d+(?:[.,]\d+)?)/);
                if (m) rate = Number(m[1].replace(",", "."));
              }
              out[e.array_vatid] = rate != null && !isNaN(rate) ? rate : 0;
            });
          });
          return out;
        });

      // Fetch existing invoices in the projection window, indexed by lease + invoice type + date.
      // When a projected invoice matches an existing one, we swap in real data (header + line items).
      function fetchExistingInvoices(startDate, endDate) {
        var startISO = new Date(startDate).toISOString().slice(0, 10);
        var endISO = new Date(endDate).toISOString().slice(0, 10);
        var fetchXml =
          '<fetch version="1.0" mapping="logical" no-lock="true">' +
          '<entity name="invoice">' +
          '<attribute name="invoiceid" />' +
          '<attribute name="name" />' +
          '<attribute name="invoicenumber" />' +
          '<attribute name="msdyn_invoicedate" />' +
          '<attribute name="datedelivered" />' +
          '<attribute name="duedate" />' +
          '<attribute name="totalamount" />' +
          '<attribute name="totaltax" />' +
          '<attribute name="transactioncurrencyid" />' +
          '<attribute name="customerid" />' +
          '<attribute name="array_leaseagreement" />' +
          '<attribute name="array_property" />' +
          '<attribute name="array_invoicetype" />' +
          '<attribute name="array_invoiceprefix" />' +
          '<attribute name="array_ksefstatus" />' +
          '<attribute name="array_invoicemode" />' +
          '<attribute name="array_originalinvoice" />' +
          '<filter type="and">' +
          '<condition attribute="msdyn_invoicedate" operator="on-or-after" value="' +
          startISO +
          '" />' +
          '<condition attribute="msdyn_invoicedate" operator="on-or-before" value="' +
          endISO +
          '" />' +
          '<condition attribute="array_leaseagreement" operator="not-null" />' +
          "</filter>" +
          "</entity>" +
          "</fetch>";
        return Xrm.WebApi.retrieveMultipleRecords(
          "invoice",
          "?fetchXml=" + encodeURIComponent(fetchXml),
        )
          .then(function (res) {
            var invoices = res.entities || [];
            if (invoices.length === 0) return { headers: {}, lines: {} };
            var headers = {};
            invoices.forEach(function (inv) {
              if (!inv.msdyn_invoicedate || !inv._array_leaseagreement_value)
                return;
              var dateStr = inv.msdyn_invoicedate.slice(0, 10);
              var key =
                inv._array_leaseagreement_value +
                "|" +
                (inv._array_invoicetype_value || "") +
                "|" +
                dateStr;
              headers[key] = inv;
            });
            // Batch fetch invoice details.
            // For corrective invoices, also fetch the ORIGINAL invoice's lines as a
            // fallback — corrective invoicedetail records reference the original via
            // _array_originalinvoiceproduct_value, and the invoicing engine sometimes
            // stores only header totals on the corrective while lines stay on the original.
            var currentIds = invoices.map(function (i) { return i.invoiceid; });
            var originalIds = invoices
              .map(function (i) { return i._array_originalinvoice_value; })
              .filter(function (v) { return v && currentIds.indexOf(v) < 0; });
            var idsToFetch = currentIds.concat(originalIds);
            return fetchInvoiceLines(idsToFetch).then(function (lines) {
              return { headers: headers, lines: lines, originalMap: buildOriginalMap(invoices) };
            });
          })
          .catch(function (err) {
            console.warn("Existing invoice fetch failed:", err);
            return { headers: {}, lines: {} };
          });
      }

      // Map correctiveInvoiceId -> originalInvoiceId, so we can look up lines under the original.
      function buildOriginalMap(invoices) {
        var m = {};
        (invoices || []).forEach(function (inv) {
          if (inv.array_invoicemode === 2 && inv._array_originalinvoice_value) {
            m[inv.invoiceid] = inv._array_originalinvoice_value;
          }
        });
        return m;
      }

      function fetchInvoiceLines(invoiceIds) {
        if (!invoiceIds || invoiceIds.length === 0) return Promise.resolve({});
        // FetchXML with <condition operator="in"> supports up to 500 values per condition,
        // and FetchXML URLs accept much larger payloads than OData $filter chains.
        // Chunk at 200 for safety — well within Dataverse's practical FetchXML URL tolerance,
        // and still 10× more efficient than the old 20-per-batch OData approach.
        var chunks = [];
        for (var i = 0; i < invoiceIds.length; i += 200)
          chunks.push(invoiceIds.slice(i, i + 200));
        var promises = chunks.map(function (chunk) {
          var valuesXml = chunk
            .map(function (id) {
              return "<value>" + id + "</value>";
            })
            .join("");
          var fetchXml =
            '<fetch version="1.0" mapping="logical" no-lock="true">' +
              '<entity name="invoicedetail">' +
                '<attribute name="invoicedetailid" />' +
                '<attribute name="productdescription" />' +
                '<attribute name="quantity" />' +
                '<attribute name="priceperunit" />' +
                '<attribute name="tax" />' +
                '<attribute name="extendedamount" />' +

      // Resolve the applicable discount for a charge as of a given date, mirroring the engine's
      // specificity hierarchy: Specific Charge > Specific Charge Type > All Charges (most specific wins).
      // Returns { net: <discount amount in charge currency>, type, label } or null.
      function resolveDiscount(rc, asOfDate, netAmount) {
        var list = _discountsByLease[rc._array_leaseagreement_value];
        if (!list || !list.length) return null;
        var t = asOfDate ? asOfDate.getTime() : Date.now();
        var best = null,
          bestRank = 0;
        list.forEach(function (d) {
          // Date window
          if (d.array_startdate && new Date(d.array_startdate).getTime() > t)
            return;
          if (d.array_enddate && new Date(d.array_enddate).getTime() < t)
            return;
          var rank = 0;
          if (
            d.array_chargetype === 126330002 &&
            d._array_recurringcharge_value === rc.array_recurringchargeid
          )
            rank = 3; // Specific Charge
          else if (
            d.array_chargetype === 126330001 &&
            d._array_chargetypecategory_value === rc._array_chargetype_value
          )
            rank = 2; // Specific Charge Type
          else if (d.array_chargetype === 126330000) rank = 1; // All Charges
          if (rank > bestRank) {

            bestRank = rank;

        if (!best) return null;

        } else {

          discNet = best.array_discountamount || 0;

          best.array_discounttype === 126330001
            ? (best.array_discountpercentage || 0) + "%"
            : "flat";

      // ---------- Projection ----------
      function projectAll() {

          if (!isLeaseActive(rc._array_leaseagreement_value)) return;

                  rc.array_dueindays,

                freqStart: currentFS ? new Date(currentFS.getTime()) : null,
                freqEnd: currentFE ? new Date(currentFE.getTime()) : null,

      // ---------- Export ----------
      // CSV export — Polish-Excel-safe (BOM + semicolon delimiter + Polish decimals)
      // Opens cleanly in pl-PL Excel: numbers with comma decimals, dates as text, UTF-8 characters intact.
      function csvNum(n) {
        if (n == null || isNaN(n)) return "";

        return Number(n).toFixed(2).replace(".", ",");

      function csvCell(v) {
        if (v == null) return "";

          s.indexOf(";") >= 0 ||
          s.indexOf('"') >= 0 ||
          s.indexOf("\n") >= 0 ||
          s.indexOf("\r") >= 0
        ) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }

          .map(function (r) {

            var styleId = 0;
            if (cell.__ttl) styleId = 3;
            else if (cell.__hdr) styleId = 1;
            else if (cell.__lbl) styleId = 4;

                '<c r="' +

                '"' +
                sAttr +
                ' t="inlineStr"><is><t xml:space="preserve">' +
                xmlEsc(cell.v) +

          '<fill><patternFill patternType="solid"><fgColor rgb="FF0071E3"/></patternFill></fill>' +
          "</fills>" +
          '<borders count="1"><border/></borders>' +
          '<cellStyleXfs count="1"><xf/></cellStyleXfs>' +
          '<cellXfs count="5">' +
          "<xf/>" /* 0 default */ +
          '<xf fontId="1" fillId="2" applyFont="1" applyFill="1"/>' /* 1 header  */ +
          '<xf numFmtId="164" applyNumberFormat="1"/>' /* 2 number  */ +
          '<xf fontId="2" applyFont="1"/>' /* 3 title   */ +
          '<xf fontId="1" applyFont="1"/>' /* 4 label (bold black on white) — reuse fontId 1 but no fill */ +
          "</cellXfs>" +
          "</styleSheet>"
        );
      }

      function buildXlsxBlob(rows, sheetName) {
        var files = {
          "[Content_Types].xml":
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' +
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
            '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
            '<Default Extension="xml" ContentType="application/xml"/>' +
            '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
            '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
            '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
            "</Types>",
          "_rels/.rels":
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
            "</Relationships>",
          "xl/_rels/workbook.xml.rels":
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
            '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
            "</Relationships>",
          "xl/workbook.xml":
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' +
            '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
            '<sheets><sheet name="' +
            xmlEsc((sheetName || "Sheet1").substring(0, 31)) +
            '" sheetId="1" r:id="rId1"/></sheets>' +
            "</workbook>",
          "xl/styles.xml": buildStylesXML(),
          "xl/worksheets/sheet1.xml": buildSheetXML(rows),
        };
        var order = [
          "[Content_Types].xml",
          "_rels/.rels",
          "xl/_rels/workbook.xml.rels",
          "xl/workbook.xml",
          "xl/styles.xml",
          "xl/worksheets/sheet1.xml",
        ];
        return zipStore(
          order.map(function (n) {
            return { name: n, content: files[n] };
          }),
        );
      }

      // Build a ZIP file (store method, no compression) as a Blob.
      // Uses standard PKZIP file format so any Excel/OpenXML consumer can read it.
      function zipStore(entries) {
        var CRC_TABLE = zipStore._t;
        if (!CRC_TABLE) {
          CRC_TABLE = new Array(256);
          for (var i = 0; i < 256; i++) {
            var c = i;
            for (var k = 0; k < 8; k++)
              c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
            CRC_TABLE[i] = c >>> 0;
          }
          zipStore._t = CRC_TABLE;
        }
        function crc32(bytes) {
          var c = 0xffffffff;
          for (var i = 0; i < bytes.length; i++)
            c = (CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8)) >>> 0;
          return (c ^ 0xffffffff) >>> 0;
        }
        var enc = new TextEncoder();
        var localParts = [];
        var centralParts = [];
        var offset = 0;
        var centralSize = 0;

        entries.forEach(function (e) {
          var nameBytes = enc.encode(e.name);
          var dataBytes = enc.encode(e.content);
          var crc = crc32(dataBytes);
          var size = dataBytes.length;

          // Local file header (30 bytes) + name + data
          var lh = new ArrayBuffer(30);
          var dv = new DataView(lh);
          dv.setUint32(0, 0x04034b50, true); // signature
          dv.setUint16(4, 20, true); // version
          dv.setUint16(6, 0, true); // flags
          dv.setUint16(8, 0, true); // method 0 = store
          dv.setUint16(10, 0, true); // mod time
          dv.setUint16(12, 0, true); // mod date
          dv.setUint32(14, crc, true); // crc32
          dv.setUint32(18, size, true); // compressed size
          dv.setUint32(22, size, true); // uncompressed size
          dv.setUint16(26, nameBytes.length, true);
          dv.setUint16(28, 0, true); // extra field length
          localParts.push(new Uint8Array(lh), nameBytes, dataBytes);
          var localLen = 30 + nameBytes.length + size;

          // Central directory record (46 bytes) + name
          var ch = new ArrayBuffer(46);
          var cv = new DataView(ch);
          cv.setUint32(0, 0x02014b50, true);
          cv.setUint16(4, 20, true); // version made by
          cv.setUint16(6, 20, true); // version needed
          cv.setUint16(8, 0, true);
          cv.setUint16(10, 0, true);
          cv.setUint16(12, 0, true);
          cv.setUint16(14, 0, true);
          cv.setUint32(16, crc, true);
          cv.setUint32(20, size, true);
          cv.setUint32(24, size, true);
          cv.setUint16(28, nameBytes.length, true);
          cv.setUint16(30, 0, true); // extra
          cv.setUint16(32, 0, true); // comment
          cv.setUint16(34, 0, true); // disk #
          cv.setUint16(36, 0, true); // internal attrs
          cv.setUint32(38, 0, true); // external attrs
          cv.setUint32(42, offset, true); // local header offset
          centralParts.push(new Uint8Array(ch), nameBytes);
          centralSize += 46 + nameBytes.length;
          offset += localLen;
        });

        // End of central directory
        var eocd = new ArrayBuffer(22);
        var ev = new DataView(eocd);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(4, 0, true);
        ev.setUint16(6, 0, true);
        ev.setUint16(8, entries.length, true);
        ev.setUint16(10, entries.length, true);
        ev.setUint32(12, centralSize, true);
        ev.setUint32(16, offset, true);
        ev.setUint16(20, 0, true);

        var all = localParts
          .concat(centralParts)
          .concat([new Uint8Array(eocd)]);
        return new Blob(all, {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
      }

      // Download that works inside a D365 web-resource iframe (where a plain anchor click
      // can be silently blocked). Tries msSaveBlob, then anchor download, then a new tab.
      function downloadBlob(blob, filename) {
        try {
          if (window.navigator && window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(blob, filename);
            return;
          }
        } catch (e) {}
        var url = URL.createObjectURL(blob);
        try {
          var a = document.createElement("a");
          if ("download" in a) {
            a.href = url;
            a.download = filename;
            a.rel = "noopener";
            a.style.display = "none";
            (document.body || document.documentElement).appendChild(a);
            a.click();
            a.remove();
          } else {
            (window.top || window).open(url, "_blank");
          }
        } catch (e) {
          try {
            (window.top || window).open(url, "_blank");
          } catch (e2) {}
        }
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 2000);
      }

      if (document.readyState === "loading")
        document.addEventListener("DOMContentLoaded", init);
      else init();
    </script>
  
</body></html>
