<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #ffffff;
  }

  .factbox {
    background: #ffffff;
    border-radius: 14px;
    border: 1px solid #e4e8ef;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    min-height: 100vh;
  }

  .factbox-header {
    background: #f8fafc;
    border-bottom: 1px solid #e4e8ef;
    padding: 14px 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .header-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a95a3;
  }

  .due-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px 3px 7px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
    border: 1.5px solid transparent;
    white-space: nowrap;
  }

  .due-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-not-due   { background: rgba(63,232,91,0.12);  color: #2fb94a; border-color: rgba(63,232,91,0.35); }
  .cat-not-due .dot { background: #3fe85b; }
  .cat-overdue   { background: rgba(241,245,10,0.12); color: #b8bd00; border-color: rgba(241,245,10,0.35); }
  .cat-overdue .dot { background: #f1f50a; }
  .cat-at-risk   { background: rgba(240,156,12,0.12); color: #c77700; border-color: rgba(240,156,12,0.35); }
  .cat-at-risk .dot { background: #f09c0c; }
  .cat-high-risk { background: rgba(240,19,19,0.12);  color: #c11212; border-color: rgba(240,19,19,0.35); }
  .cat-high-risk .dot { background: #f01313; }
  .cat-critical  { background: rgba(173,19,19,0.18);  color: #ff6b6b; border-color: rgba(173,19,19,0.5); }
  .cat-critical .dot { background: #ad1313; box-shadow: 0 0 6px rgba(173,19,19,0.6); }
  .cat-expiring  { background: rgba(231,242,10,0.12); color: #aab300; border-color: rgba(231,242,10,0.35); }
  .cat-expiring .dot { background: #e7f20a; }
  .cat-active    { background: rgba(74,232,98,0.12);  color: #28b44a; border-color: rgba(74,232,98,0.35); }
  .cat-active .dot { background: #4ae862; }
  .cat-paid      { background: rgba(21,237,234,0.12); color: #0ea5a3; border-color: rgba(21,237,234,0.35); }
  .cat-paid .dot { background: #15edea; }
  .cat-cancelled { background: rgba(173,168,168,0.15); color: #6b6b6b; border-color: rgba(173,168,168,0.4); }
  .cat-cancelled .dot { background: #ada8a8; }

  .factbox-body {
    padding: 10px 18px 17px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  @media (min-width: 3740px) {
    .factbox-body { padding: 2px 18px 17px !important; }
  }

  .field-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #f0f2f5;
    gap: 12px;
  }

  .field-row:last-child { border-bottom: none; }
  .field-left { flex: 1; min-width: 0; }

  .field-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #616366;
    margin-bottom: 3px;
  }

  .field-desc {
    font-size: 11px;
    color: #b0b8c4;
    line-height: 1.4;
    margin-top: 2px;
    font-weight: 400;
  }

  .field-value {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: #1a202c;
    line-height: 1.15;
    white-space: nowrap;
  }

  .field-value.paid      { color: #16a34a; }
  .field-value.remaining { color: #dc2626; }
  .field-value.total     { color: #1a202c;}

  .progress-wrap {
    padding-top: 14px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
  }

  .progress-meta-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #9aa3af;
  }

  .progress-pct {
    font-size: 11px;
    font-weight: 600;
    color: #4b5563;
  }

  .progress-track {
    width: 100%;
    height: 5px;
    background: #eef0f3;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #16a34a, #4ade80);
    width: 0%;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: shim 2s infinite;
  }

  @keyframes shim {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .skeleton {
    background: linear-gradient(90deg, #f0f2f5 25%, #e4e8ef 50%, #f0f2f5 75%);
    background-size: 200% 100%;
    animation: skel 1.4s ease-in-out infinite;
    border-radius: 6px;
  }

  @keyframes skel {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .skel-badge  { width: 80px; height: 22px; border-radius: 20px; }
  .skel-value  { height: 24px; width: 110px; margin-top: 2px; }
  .skel-value.sm { width: 90px; height: 20px; }
  .skel-desc   { height: 10px; width: 130px; margin-top: 5px; }
  .skel-bar    { height: 5px; width: 100%; margin-top: 7px; border-radius: 99px; }

  .skeleton-state .field-value,
  .skeleton-state .field-desc,
  .skeleton-state .due-badge,
  .skeleton-state .progress-pct,
  .skeleton-state .progress-fill { display: none !important; }

  .skeleton-state .skel-value,
  .skeleton-state .skel-desc,
  .skeleton-state .skel-badge,
  .skeleton-state .skel-bar { display: block !important; }

  .skel-value, .skel-desc, .skel-badge, .skel-bar { display: none; }
</style>
</head>
<body>

<div class="factbox skeleton-state" id="factbox">

  <div class="factbox-header">
    <span class="header-label">Payment Summary</span>
    <span class="due-badge" id="due-badge">
      <span class="dot"></span>
      <span id="due-text">—</span>
    </span>
    <span class="skeleton skel-badge"></span>
  </div>

  <div class="factbox-body">

    <div class="field-row">
      <div class="field-left">
        <div class="field-label">Amount Paid</div>
        <div class="field-value paid" id="val-paid">—</div>
        <div class="skeleton skel-value"></div>
        <div class="field-desc">Total settled by the payer to date.</div>
        <div class="skeleton skel-desc"></div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-left">
        <div class="field-label">Remaining</div>
        <div class="field-value remaining" id="val-remaining">—</div>
        <div class="skeleton skel-value"></div>
        <div class="field-desc">Balance still outstanding on this invoice.</div>
        <div class="skeleton skel-desc"></div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-left">
        <div class="field-label">Total Amount</div>
        <div class="field-value total" id="val-total">—</div>
        <div class="skeleton skel-value sm"></div>
        <div class="field-desc">Full invoice value including all charges.</div>
        <div class="skeleton skel-desc"></div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="progress-meta-label">Payment Progress</span>
        <span class="progress-pct" id="pct-label">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="skeleton skel-bar"></div>
    </div>

  </div>
</div>

<script>
  /* ── FORMAT: always 2 decimal places, no rounding of final value ── */
  function fmt(symbol, n) {
    return symbol + '\u00a0' + n.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  /* ── ANIMATE NUMBER: counts up with decimals, ends at exact value ── */
  function animNum(el, end, symbol, dur = 900) {
    const start = performance.now();
    (function tick(now) {
      const p    = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 4);
      el.textContent = fmt(symbol, end * ease);
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = fmt(symbol, end); // ensure exact final value
    })(start);
  }

  function hexToRgba(hex, alpha) {
    if (!hex) return '';
    const r = parseInt(hex.substr(1,2), 16);
    const g = parseInt(hex.substr(3,2), 16);
    const b = parseInt(hex.substr(5,2), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  /* ── GLOBAL CHOICE CACHE ── */
  let dueCategoryMap = null;

  async function getDueCategoryMap() {
    if (dueCategoryMap) return dueCategoryMap;

    const url = parent.Xrm.Utility.getGlobalContext().getClientUrl() +
      "/api/data/v9.2/GlobalOptionSetDefinitions(Name='array_overduecategory')";

    const res  = await fetch(url, { headers: { Accept: "application/json" } });
    const data = await res.json();

    dueCategoryMap = {};
    data.Options.forEach(opt => {
      dueCategoryMap[opt.Value] = {
        label: opt.Label?.UserLocalizedLabel?.Label || '',
        color: opt.Color || '#999999'
      };
    });

    return dueCategoryMap;
  }

  /* ── APPLY BADGE (DYNAMIC) ── */
  async function applyDueBadge(categoryValue) {
    const badge = document.getElementById('due-badge');
    const dot   = badge.querySelector('.dot');
    const text  = document.getElementById('due-text');

    const map  = await getDueCategoryMap();
    const meta = map[categoryValue];

    if (!meta) { text.textContent = '—'; return; }

    text.textContent    = meta.label;
    badge.style.background  = hexToRgba(meta.color, 0.12);
    badge.style.borderColor = hexToRgba(meta.color, 0.35);
    badge.style.color       = "rgb(60,60,60)";
    dot.style.background    = meta.color;
  }

  /* ── URL PARAMS ── */
  function qp(k) {
    return new URLSearchParams(window.location.search).get(k);
  }

  async function getCurrencySymbol(id) {
    try {
      const r = await parent.Xrm.WebApi.retrieveRecord(
        'transactioncurrency', id, '?$select=currencysymbol'
      );
      return r.currencysymbol || '';
    } catch { return ''; }
  }

  /* ── MAIN LOAD ── */
  async function load() {
    try {
      const recordId   = qp('id');
      const entityName = qp('typename');
      if (!recordId || !entityName) throw new Error('Missing params');

      const cleanId = recordId.replace(/[{}]/g, '');

      const data = await parent.Xrm.WebApi.retrieveRecord(
        entityName, cleanId,
        '?$select=totalamount,array_amountpaid,array_remainingamount,array_duecategory,_transactioncurrencyid_value'
      );

      const total     = data.totalamount     || 0;
      const paid      = data.array_amountpaid      || 0;
      const remaining = data.array_remainingamount || 0;
      const catValue  = data.array_duecategory;

      const currencyId = data._transactioncurrencyid_value;
      const symbol     = currencyId ? await getCurrencySymbol(currencyId) : '';

      /* remove skeleton */
      document.getElementById('factbox').classList.remove('skeleton-state');

      animNum(document.getElementById('val-paid'),      paid,      symbol);
      animNum(document.getElementById('val-remaining'), remaining, symbol);
      animNum(document.getElementById('val-total'),     total,     symbol);

      const pct = total > 0 ? (paid / total) * 100 : 0;
      setTimeout(() => {
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('pct-label').textContent     = Math.round(pct) + '%';
      }, 120);

      await applyDueBadge(catValue);

    } catch (err) {
      console.error('Factbox load error:', err);
    }
  }

  window.onload = load;
</script>
</body>
</html>
