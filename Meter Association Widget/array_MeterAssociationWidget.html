      function openRecordPicker(uid) {
        if (isReadOnly) return;
        var row = rows.find(function (r) {
          return r.uid === uid;
        });
        if (!row || !row.type) return;
        _popupTargetUid = uid;
        _popupType = row.type;
        if (row.type === "customer")
          _popupCustomerMode = row.customerType || "account";
        try {
          var pd = parent.document;
          injectPopupStyles();
          var old = pd.getElementById(POPUP_ID);
          if (old) old.remove();
          var overlay = pd.createElement("div");
          overlay.id = POPUP_ID;
          overlay.innerHTML = buildPickerHTML();
          overlay.addEventListener("click", function (e) {
            if (e.target === overlay) closePicker();
          });
          pd.body.appendChild(overlay);
          setTimeout(function () {
            var inp = pd.getElementById("ma-search-input");
            if (inp) inp.focus();
          }, 60);
          parent.window.maClosePopup = closePicker;
          parent.window.maRenderPopup = renderPicker;
          parent.window.maSelectRecord = selectRecord;
          parent.window.maSetCustomerMode = setCustomerMode;
        } catch (e) {
          setStatus("err", "Unable to open picker: " + e.message);
        }
      }

      function closePicker() {
        try {
          var el = parent.document.getElementById(POPUP_ID);
          if (el) el.remove();
        } catch (e) {}
        _popupTargetUid = null;
      }

      function buildPickerHTML() {
        var titleNoun =
          _popupType === "lease"
            ? "lease agreement"
            : _popupType === "unit"
              ? "unit"
              : "customer";
        var toggle = "";
        if (_popupType === "customer") {
          toggle =
            '<div class="ma-toggle" id="ma-toggle">' +
            '<button id="ma-tg-account" class="' +
            (_popupCustomerMode === "account" ? "active" : "") +
            '" onclick="window.maSetCustomerMode(\'account\')">Account</button>' +
            '<button id="ma-tg-contact" class="' +
            (_popupCustomerMode === "contact" ? "active" : "") +
            '" onclick="window.maSetCustomerMode(\'contact\')">Contact</button>' +
            "</div>";
        }
        return (
          '<div class="ma-popup" role="dialog" aria-modal="true">' +
          '<div class="ma-ph"><span class="ma-ph-title">Select ' +
          titleNoun +
          "</span>" +
          '<button class="ma-close-btn" onclick="window.maClosePopup()" aria-label="Close">&#x2715;</button></div>' +
          toggle +
          '<div class="ma-search"><input type="text" id="ma-search-input" placeholder="Search\u2026" oninput="window.maRenderPopup()"></div>' +
          '<div class="ma-list" id="ma-popup-list">' +
          buildPickerItems("") +
          "</div>" +
          '<div class="ma-footer">Records already used in other rows are hidden.</div>' +
          "</div>"
        );
      }

      function setCustomerMode(mode) {
        _popupCustomerMode = mode === "contact" ? "contact" : "account";
        try {
          var pd = parent.document;
          var a = pd.getElementById("ma-tg-account"),
            c = pd.getElementById("ma-tg-contact");
          if (a) a.className = _popupCustomerMode === "account" ? "active" : "";
          if (c) c.className = _popupCustomerMode === "contact" ? "active" : "";
          var inp = pd.getElementById("ma-search-input");
          var list = pd.getElementById("ma-popup-list");
          if (list) list.innerHTML = buildPickerItems(inp ? inp.value : "");
        } catch (e) {}
      }

      function getUsedIdsForType(type, excludeUid, customerMode) {
        var used = new Set();
        rows.forEach(function (r) {
          if (r.uid === excludeUid) return;
          if (r.type !== type || !r.recordId) return;
          if (type === "customer" && r.customerType !== customerMode) return;
          used.add(r.recordId);
        });
        return used;
      }

      function buildPickerItems(query) {
        var q = (query || "").toLowerCase();
        var isCustomer = _popupType === "customer";
        var custContact = isCustomer && _popupCustomerMode === "contact";
        var used = getUsedIdsForType(
          _popupType,
          _popupTargetUid,
          _popupCustomerMode,
        );
        var items =
          _popupType === "lease"
            ? allLeases
            : _popupType === "unit"
              ? allUnits
              : custContact
                ? allContacts
                : allAccounts;
        var filtered = items.filter(function (i) {
          var id =
            _popupType === "lease"
              ? i.array_leaseagreementid
              : _popupType === "unit"
                ? i.array_unitid
                : custContact
                  ? i.contactid
                  : i.accountid;
          if (used.has(id)) return false;
          if (!q) return true;
          if (_popupType === "lease")
            return (
              (i.array_leasename || "").toLowerCase().includes(q) ||
              (i.array_leaserecordid || "").toLowerCase().includes(q)
            );
          if (_popupType === "unit")
            return (
              (i.array_unitname || "").toLowerCase().includes(q) ||
              (i.array_unitrecordid || "").toLowerCase().includes(q)
            );
          if (custContact)
            return (
              (i.fullname || "").toLowerCase().includes(q) ||
              (i.emailaddress1 || "").toLowerCase().includes(q)
            );
          return (
            (i.name || "").toLowerCase().includes(q) ||
            (i.accountnumber || "").toLowerCase().includes(q)
          );
        });
        if (!filtered.length)
          return '<div class="ma-empty">No records available</div>';
        return filtered
          .map(function (item) {
            var id, name, sub;
            if (_popupType === "lease") {
              id = item.array_leaseagreementid;
              name = esc(item.array_leasename || "(no name)");
              var s = item.array_leasestartdate
                ? item.array_leasestartdate.substring(0, 10)
                : "—";
              var e = item.array_leaseenddate
                ? item.array_leaseenddate.substring(0, 10)
                : "—";
              sub =
                esc(item.array_leaserecordid || "") +
                " &middot; " +
                s +
                " &rarr; " +
                e;
            } else if (_popupType === "unit") {
              id = item.array_unitid;
              var baseName = esc(item.array_unitname || "(unnamed)");
              var stKey =
                item.array_spacetype != null
                  ? SPACE_TYPE_MAP[String(item.array_spacetype)]
                  : null;
              var stPill = stKey
                ? '<span class="space-badge-inline ' +
                  stKey +
                  '">' +
                  SPACE_TYPE_LABEL[stKey] +
                  "</span>"
                : "";
              name = baseName + stPill;
              var tl =
                item[
                  "_array_unittype_value@OData.Community.Display.V1.FormattedValue"
                ] || "";
              sub =
                esc(item.array_unitrecordid || "") +
                (tl ? " &middot; " + esc(tl) : "");
            } else if (custContact) {
              id = item.contactid;
              name = esc(item.fullname || "(no name)");
              var pc =
                item[
                  "_parentcustomerid_value@OData.Community.Display.V1.FormattedValue"
                ] || "";
              sub =
                esc(item.emailaddress1 || "") +
                (pc ? (item.emailaddress1 ? " &middot; " : "") + esc(pc) : "");
            } else {
              id = item.accountid;
              name = esc(item.name || "(unnamed)");
              sub = esc(item.accountnumber || "");
            }
            return (
              '<div class="ma-item" onclick="window.maSelectRecord(\'' +
              id +
              "')\">" +
              '<div class="ma-item-body"><div class="ma-item-name">' +
              name +
              "</div>" +
              (sub ? '<div class="ma-item-sub">' + sub + "</div>" : "") +
              "</div></div>"
            );
          })
          .join("");
      }

      function renderPicker() {
        try {
          var pd = parent.document;
          var inp = pd.getElementById("ma-search-input");
          var list = pd.getElementById("ma-popup-list");
          if (list) list.innerHTML = buildPickerItems(inp ? inp.value : "");
        } catch (e) {}
      }

      function selectRecord(recordId) {
        var row = rows.find(function (r) {
          return r.uid === _popupTargetUid;
        });
        if (!row) {
          closePicker();
          return;
        }
        row.recordId = recordId;
        if (row.type === "customer") row.customerType = _popupCustomerMode;
        row.dirty = true;
        closePicker();
        if (row.method === "area") recalcAllAreaRows();
        else {
          renderRows();
          updateAllocSummary();
        }
      }

      function getUnitSpaceType(unitId) {
        if (!unitId) return null;
        var u = allUnits.find(function (x) {
          return x.array_unitid === unitId;
        });
        if (!u || u.array_spacetype == null) return null;
        return SPACE_TYPE_MAP[String(u.array_spacetype)] || null;
      }

      function getAreaForRow(row) {
        if (!row.recordId) return 0;
        if (row.type === "lease") {
          var l = allLeases.find(function (x) {
            return x.array_leaseagreementid === row.recordId;
          });
          var v =
            l && l.array_totalareaofunits != null
              ? parseFloat(l.array_totalareaofunits)
              : 0;
          return isNaN(v) ? 0 : v;
        }
        if (row.type === "unit") {
          var u = allUnits.find(function (x) {
            return x.array_unitid === row.recordId;
          });
          var v2 =
            u && u.array_unitareasqm != null
              ? parseFloat(u.array_unitareasqm)
              : 0;
          return isNaN(v2) ? 0 : v2;
        }
        return 0;
      }

      function recalcAllAreaRows() {
        var eligible = rows.filter(function (r) {
          return (
            r.method === "area" &&
            r.recordId &&
            (r.type === "lease" || r.type === "unit")
          );
        });
        var denom = eligible.reduce(function (s, r) {
          return s + getAreaForRow(r);
        }, 0);
        eligible.forEach(function (r) {
          r.calcError = null;
          r.calcLoading = false;
          if (denom <= 0) {
            r.calcedPct = 0;
            r.pct = 0;
            return;
          }
          var pct = Math.round((getAreaForRow(r) / denom) * 10000) / 100;
          r.calcedPct = pct;
          r.pct = pct;
          r.dirty = true;
        });
        // Rounding can leave the area rows at 99.99 / 100.01 — put the
        // difference on the largest row so they total exactly 100.
        if (denom > 0 && eligible.length) {
          var sum = eligible.reduce(function (s, r) {
            return s + r.pct;
          }, 0);
          var diff = Math.round((100 - sum) * 100) / 100;
          if (diff !== 0) {
            var largest = eligible.reduce(function (a, b) {
              return b.pct > a.pct ? b : a;
            });
            largest.pct = Math.round((largest.pct + diff) * 100) / 100;
            largest.calcedPct = largest.pct;
          }
        }
        renderRows();
        updateAllocSummary();
      }

      function applyReadOnlyToControls() {
        if (!isReadOnly) return;
        var root = document.getElementById("main-content");
        if (!root) return;
        root
          .querySelectorAll(".row-select, .alloc-pct-input")
          .forEach(function (el) {
            el.disabled = true;
          });
        var addBtn = root.querySelector(".btn-add");
        if (addBtn) {
          addBtn.disabled = true;
          addBtn.style.opacity = "0.5";
          addBtn.style.cursor = "not-allowed";
        }
        root.querySelectorAll(".btn-remove").forEach(function (el) {
          el.disabled = true;
          el.style.opacity = "0.5";
          el.style.cursor = "not-allowed";
        });
        root.querySelectorAll(".record-picker").forEach(function (el) {
          el.classList.add("disabled");
          el.onclick = null;
        });
      }

      function dupKey(r) {
        return r.type === "customer"
          ? r.type + "|" + r.customerType + "|" + r.recordId
          : r.type + "|" + r.recordId;
      }

      function renderRows() {
        var cnt = document.getElementById("row-count");
        cnt.textContent = rows.length + " row" + (rows.length === 1 ? "" : "s");
        cnt.className = "sel-count" + (rows.length ? " has" : "");
        var el = document.getElementById("row-list");
        if (!rows.length) {
          el.innerHTML =
            '<div class="empty-state">' +
            '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            "<p>No associations yet.<br>Click \u201cAdd row\u201d to begin.</p></div>";
          return;
        }
        var dupSet = computeDuplicates();
        var customerPresent = hasCustomerRow();
        el.innerHTML = rows
          .map(function (row) {
            return buildRowHTML(row, dupSet, customerPresent);
          })
          .join("");
        applyReadOnlyToControls();
      }

      function computeDuplicates() {
        var seen = {};
        rows.forEach(function (r) {
          if (!r.type || !r.recordId) return;
          var k = dupKey(r);
          seen[k] = (seen[k] || 0) + 1;
        });
        var dup = new Set();
        Object.keys(seen).forEach(function (k) {
          if (seen[k] > 1) dup.add(k);
        });
        return dup;
      }

      function buildRowHTML(row, dupSet, customerPresent) {
        var typeOpts =
          '<option value="" ' +
          (!row.type ? "selected" : "") +
          ">type\u2026</option>" +
          '<option value="lease" ' +
          (row.type === "lease" ? "selected" : "") +
          ">Lease</option>" +
          '<option value="unit" ' +
          (row.type === "unit" ? "selected" : "") +
          ">Unit</option>" +
          '<option value="customer" ' +
          (row.type === "customer" ? "selected" : "") +
          ">Tenant</option>";

        var areaDisabled =
          row.type === "customer" ||
          (customerPresent && row.type !== "customer");
        var methodOpts =
          '<option value="" ' +
          (!row.method ? "selected" : "") +
          ">method\u2026</option>" +
          '<option value="fixed" ' +
          (row.method === "fixed" ? "selected" : "") +
          ">Fixed %</option>" +
          '<option value="area"  ' +
          (row.method === "area" ? "selected" : "") +
          (areaDisabled ? " disabled" : "") +
          ">By Area" +
          (areaDisabled ? " (n/a)" : "") +
          "</option>";

        var pickerText,
          pickerCls = "record-picker",
          pickerDisabled = !row.type;
        if (!row.type) {
          pickerText = '<span class="placeholder">Choose type first</span>';
          pickerCls += " disabled";
        } else if (!row.recordId) {
          pickerText =
            '<span class="placeholder">Select ' + row.type + "\u2026</span>";
        } else {
          var rec;
          if (row.type === "lease")
            rec = allLeases.find(function (l) {
              return l.array_leaseagreementid === row.recordId;
            });
          else if (row.type === "unit")
            rec = allUnits.find(function (u) {
              return u.array_unitid === row.recordId;
            });
          else if (row.customerType === "contact")
            rec = allContacts.find(function (c) {
              return c.contactid === row.recordId;
            });
          else
            rec = allAccounts.find(function (a) {
              return a.accountid === row.recordId;
            });
          if (rec) {
            if (row.type === "lease")
              pickerText = esc(rec.array_leasename || "(no name)");
            else if (row.type === "unit")
              pickerText = esc(rec.array_unitname || "(unnamed)");
            else if (row.customerType === "contact")
              pickerText = esc(rec.fullname || "(no name)");
            else pickerText = esc(rec.name || "(unnamed)");
          } else pickerText = "(unknown record)";
        }

        var dupBadge =
          row.type && row.recordId && dupSet.has(dupKey(row))
            ? '<span class="dup-badge" title="Duplicate">DUP</span>'
            : "";
        var savedBadge = row.assocId
          ? '<span class="saved-badge">saved</span>'
          : "";
        var spaceBadge = "";
        if (row.type === "unit" && row.recordId) {
          var st = getUnitSpaceType(row.recordId);
          if (st)
            spaceBadge =
              '<span class="space-badge ' +
              st +
              '" title="Space type">' +
              SPACE_TYPE_LABEL[st] +
              "</span>";
        }
        var custSub =
          row.type === "customer" && row.recordId && row.customerType
            ? '<span class="cust-sub ' +
              row.customerType +
              '">' +
              row.customerType +
              "</span>"
            : "";

        var areaDisplay = "";
        if (row.type && row.recordId && row.method === "area") {
          var areaVal = 0;
          if (row.type === "lease") {
            var l = allLeases.find(function (x) {
              return x.array_leaseagreementid === row.recordId;
            });
            if (l && l.array_totalareaofunits != null)
              areaVal = parseFloat(l.array_totalareaofunits) || 0;
          } else if (row.type === "unit") {
            var u = allUnits.find(function (x) {
              return x.array_unitid === row.recordId;
            });
            if (u && u.array_unitareasqm != null)
              areaVal = parseFloat(u.array_unitareasqm) || 0;
          }
          areaDisplay =
            '<span class="area-display" title="Area in square metres"><strong>' +
            areaVal.toLocaleString() +
            '</strong><span class="unit-label">sqm</span></span>';
        }

        var typeBadge = row.type
          ? '<span class="type-badge ' + row.type + '">' + row.type + "</span>"
          : '<span class="type-badge empty">\u2014</span>';

        /* ── Line 1: primary controls ── */
        var line1 =
          typeBadge +
          '<div class="field-group"><span class="field-label">Type *</span>' +
          '<select class="row-select sel-type" onchange="onTypeChange(\'' +
          row.uid +
          "',this.value)\">" +
          typeOpts +
          "</select>" +
          "</div>" +
          '<div class="field-group"><span class="field-label">Allocation Method *</span>' +
          '<select class="row-select sel-method" onchange="onMethodChange(\'' +
          row.uid +
          "',this.value)\">" +
          methodOpts +
          "</select>" +
          "</div>" +
          '<div class="field-group" style="flex:1 1 240px;min-width:220px"><span class="field-label">Record *</span>' +
          '<div class="' +
          pickerCls +
          '" style="width:100%;min-width:0;flex:0 0 auto"' +
          (pickerDisabled
            ? ""
            : " onclick=\"openRecordPicker('" + row.uid + "')\"") +
          ">" +
          '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
          '<span class="record-picker-text">' +
          pickerText +
          "</span>" +
          "</div>" +
          "</div>" +
          '<div class="field-group"><span class="field-label">Allocation % *</span>' +
          buildPctCell(row) +
          "</div>" +
          custSub +
          areaDisplay +
          spaceBadge +
          savedBadge +
          dupBadge +
          '<button class="btn-remove" onclick="removeRow(\'' +
          row.uid +
          '\')" title="Remove row">' +
          '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
          "</button>";

        /* ── Line 2: secondary controls ── */
        var line2 = "";

        /* Proration (lease / unit only) */
        if (row.type === "lease" || row.type === "unit") {
          var pYes = row.prorationEnabled ? "selected" : "";
          var pNo = row.prorationEnabled ? "" : "selected";
          var disabled = !row.recordId ? " disabled" : "";

          line2 +=
            '<div class="field-group"><span class="field-label">Proration</span>' +
            '<select class="row-select sel-proration"' +
            disabled +
            " onchange=\"onProrationChange('" +
            row.uid +
            "',this.value)\">" +
            '<option value="no" ' +
            pNo +
            ">No</option>" +
            '<option value="yes" ' +
            pYes +
            ">Yes</option>" +
            "</select></div>";
        }

        /* Remaining Amount Allocation — lease / unit only, NOT shown for customer/tenant */
        if (row.type && row.type !== "customer") {
          var remInner;
          if (!row.type || !row.recordId) {
            // Not yet configured — show disabled placeholder
            remInner =
              '<select class="row-select sel-remaining" disabled><option value="">—</option></select>';
          } else if (row.isExistingRow && !row.remainingAlloc) {
            // Existing saved row with no value set — show "Not set" + two real options so user can pick
            remInner =
              '<select class="row-select sel-remaining" onchange="onRemainingAllocChange(\'' +
              row.uid +
              "',this.value)\">" +
              '<option value="" selected>Not set</option>' +
              '<option value="landlord">Landlord Absorb</option>' +
              '<option value="split">Split Between Tenants</option>' +
              "</select>";
          } else {
            // New rows (default landlord) or existing rows that already have a value — no "Not set"
            var selL = row.remainingAlloc === "landlord" ? "selected" : "";
            var selS = row.remainingAlloc === "split" ? "selected" : "";
            remInner =
              '<select class="row-select sel-remaining" onchange="onRemainingAllocChange(\'' +
              row.uid +
              "',this.value)\">" +
              '<option value="landlord" ' +
              selL +
              ">Landlord Absorb</option>" +
              '<option value="split" ' +
              selS +
              ">Split Between Tenants</option>" +
              "</select>";
          }
          line2 +=
            '<div class="field-group"><span class="field-label">Remaining Amount Allocation</span>' +
            remInner +
            "</div>";
        }

        /* Combine Line on Invoice — lease, unit, AND customer/tenant */
        if (row.type) {
          var clYes = row.combinedLine ? "selected" : "";
          var clNo = row.combinedLine ? "" : "selected";
          line2 +=
            '<div class="field-group"><span class="field-label">Combine Line on Invoice</span>' +
            '<select class="row-select" style="width:100px" ' +
            "onchange=\"onCombinedLineChange('" +
            row.uid +
            "',this.value)\">" +
            '<option value="no" ' +
            clNo +
            ">No</option>" +
            '<option value="yes" ' +
            clYes +
            ">Yes</option>" +
            "</select></div>";
        }

        return (
          '<div class="row" data-uid="' +
          row.uid +
          '">' +
          '<div class="row-line1">' +
          line1 +
          "</div>" +
          (line2 ? '<div class="row-line2">' + line2 + "</div>" : "") +
          "</div>"
        );
      }

      function buildPctCell(row) {
        if (!row.method || !row.type || !row.recordId) {
          return '<div class="alloc-pct-input-wrap"><input type="number" class="alloc-pct-input" value="" disabled placeholder="\u2014"><span class="alloc-pct-symbol">%</span></div>';
        }
        if (row.method === "area" && row.calcLoading) {
          return '<span class="alloc-calc-badge loading"><span class="mini-spin"></span> Calc\u2026</span>';
        }
        if (row.method === "area" && row.calcError) {
          return (
            '<span class="alloc-calc-badge error" title="' +
            esc(row.calcError) +
            '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' +
            " Error</span>"
          );
        }
        var val = row.pct != null ? row.pct : "";
        var hint =
          row.method === "area" && row.calcedPct != null
            ? ' title="Auto-calculated: ' + row.calcedPct + '%"'
            : "";
        return (
          '<div class="alloc-pct-input-wrap">' +
          '<input type="number" class="alloc-pct-input" id="pct-' +
          row.uid +
          '" min="0" max="100" step="0.01" value="' +
          esc(String(val)) +
          '" ' +
          "oninput=\"onPctChange('" +
          row.uid +
          "',this.value)\" " +
          "onblur=\"onPctBlur('" +
          row.uid +
          '\',this.value)" placeholder="0"' +
          hint +
          ">" +
          '<span class="alloc-pct-symbol">%</span></div>'
        );
      }

      function updateAllocSummary() {
        var configured = rows.filter(function (r) {
          return r.type && r.recordId && r.method;
        });
        if (!configured.length) {
          document.getElementById("alloc-summary").style.display = "none";
          return;
        }
        var total =
          Math.round(
            configured.reduce(function (s, r) {
              return s + (parseFloat(r.pct) || 0);
            }, 0) * 100,
          ) / 100;
        var el = document.getElementById("alloc-summary");
        var msg = document.getElementById("alloc-summary-msg");
        var pct = document.getElementById("alloc-total-pct");
        el.style.display = "flex";
        pct.textContent = total + "%";
        if (total === 100) {
          el.className = "alloc-summary alloc-ok";
          msg.textContent = "Total allocation equals 100% \u2713";
          return;
        }
        var gap = Math.round(Math.abs(100 - total) * 100) / 100;
        el.className = "alloc-summary alloc-warn";
        msg.textContent =
          totalRuleText(configured) +
          (total > 100
            ? " \u2014 reduce by " + gap + "%"
            : " \u2014 add " + gap + "%");
      }

      // "Fixed % allocations must total 100%" etc., based on the methods in use
      function totalRuleText(list) {
        var hasFixed = list.some(function (r) {
          return r.method === "fixed";
        });
        var hasArea = list.some(function (r) {
          return r.method === "area";
        });
        if (hasFixed && hasArea)
          return "Fixed % and By Area allocations together must total 100%";
        if (hasArea) return "By Area allocations must total 100%";
        return "Fixed % allocations must total 100%";
      }

      function validateBeforeSave() {
        var errors = [];
        var incomplete = rows.filter(function (r) {
          return !r.type || !r.method || !r.recordId;
        });
        if (incomplete.length)
          errors.push(
            incomplete.length +
              " row(s) incomplete \u2014 set type, allocation method, record and allocation % on every row.",
          );
        var missingBasisIds = [];
        var zeroIds = rows
          .filter(function (r) {
            var v = parseFloat(r.pct);
            return r.type && r.recordId && r.method && (isNaN(v) || v <= 0);
          })
          .map(function (r) {
            return r.uid;
          });
        if (zeroIds.length)
          errors.push(
            zeroIds.length + " row(s) have 0% or missing percentage.",
          );
        var negIds = rows
          .filter(function (r) {
            var v = parseFloat(r.pct);
            return r.type && r.recordId && r.method && !isNaN(v) && v < 0;
          })
          .map(function (r) {
            return r.uid;
          });
        if (negIds.length)
          errors.push(negIds.length + " row(s) have a negative percentage.");
        if (hasCustomerRow()) {
          var bad = rows.filter(function (r) {
            return r.type !== "customer" && r.method === "area";
          });
          if (bad.length)
            errors.push(
              "When a tenant row is present, all rows must use Fixed % \u2014 found " +
                bad.length +
                " on By Area.",
            );
        }
        var dups = computeDuplicates();
        if (dups.size)
          errors.push(
            "Duplicate records detected \u2014 the same lease/unit/tenant appears in multiple rows.",
          );
        var calcErrs = rows.filter(function (r) {
          return r.calcError;
        });
        if (calcErrs.length)
          errors.push(calcErrs.length + " row(s) have calculation errors.");
        if (!incomplete.length && !zeroIds.length && rows.length > 0) {
          var total =
            Math.round(
              rows.reduce(function (s, r) {
                return s + (parseFloat(r.pct) || 0);
              }, 0) * 100,
            ) / 100;
          if (total !== 100)
            errors.push(
              totalRuleText(rows) +
                " \u2014 currently " +
                total +
                "%.",
            );
        }
        highlightErrorRows(zeroIds, missingBasisIds);
        return errors;
      }

      function highlightErrorRows(uids, basisUids) {
        var set = new Set(uids);
        document.querySelectorAll(".row").forEach(function (rowEl) {
          var uid = rowEl.getAttribute("data-uid");
          if (set.has(uid)) {
            rowEl.classList.add("pct-error");
            var inp = rowEl.querySelector(".alloc-pct-input");
            if (inp) inp.classList.add("err");
          } else rowEl.classList.remove("pct-error");
        });
      }

      async function handleSave() {
        if (isReadOnly) {
          setStatus(
            "err",
            "Cannot save \u2014 meter is " +
              statusLabel(meterStatusCode) +
              ". Only Draft meters are editable.",
          );
          return;
        }
        var errs = validateBeforeSave();
        if (errs.length) {
          setStatus("err", errs.join(" \u2022 "));
          return;
        }

        var btn = document.getElementById("save-btn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Saving\u2026';
        setStatus("loading", "Saving associations\u2026");

        try {
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var data = {
              "array_Meter@odata.bind": "/array_meters(" + meterId + ")",
              array_meterassociationtype: ASSOC_TYPE_REV[row.type],
              array_allocationmethod: ALLOC_METHOD_REV[row.method],
              array_allocationpercenatage: parseFloat(row.pct) || 0,
              array_prorationenabled:
                row.type === "lease" || row.type === "unit"
                  ? !!row.prorationEnabled
                  : false,
            };
            data["array_combinedline"] = !!row.combinedLine;
            data["array_remainingamountallocation"] =
              row.type !== "customer" &&
              row.remainingAlloc &&
              REMAINING_ALLOC_REV[row.remainingAlloc] != null
                ? REMAINING_ALLOC_REV[row.remainingAlloc]
                : null;
            if (row.type === "lease") {
              data["array_LeaseAgreement@odata.bind"] =
                "/array_leaseagreements(" + row.recordId + ")";
            } else if (row.type === "unit") {
              data["array_Unit@odata.bind"] =
                "/array_units(" + row.recordId + ")";
            } else if (row.type === "customer") {
              if (row.customerType === "contact")
                data[CUSTOMER_BIND_CONTACT + "@odata.bind"] =
                  "/contacts(" + row.recordId + ")";
              else
                data[CUSTOMER_BIND_ACCOUNT + "@odata.bind"] =
                  "/accounts(" + row.recordId + ")";
            }
            if (!row.assocId) {
              var res = await xrmCreate("array_meterassociation", data);
              if (res && res.id) row.assocId = res.id;
            } else if (row.dirty) {
              await xrmUpdate("array_meterassociation", row.assocId, data);
            }
            row.dirty = false;
            // After saving, mark as existing row so behaviour is consistent on re-render
            row.isExistingRow = true;
          }
          isEditMode = true;
          setSubtitle("edit");
          setPill("edit");
          setStatus("ok", "Associations saved successfully.");
          try {
            var x = getXrm();
            if (x && x.Page && x.Page.ui)
              x.Page.ui.clearFormNotification("ASSOC_MISSING");
          } catch (e) {}
          renderRows();
        } catch (e) {
          setStatus("err", "Save failed: " + e.message);
        }

        btn.disabled = false;
        btn.innerHTML =
          '<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save';
      }

      function setSubtitle(mode) {
        var el = document.getElementById("top-subtitle");
        if (mode === "readonly") {
          el.className = "top-subtitle error";
          el.textContent =
            "Read-only \u2014 meter status is " +
            statusLabel(meterStatusCode) +
            ". Only Draft meters can be edited.";
        } else if (mode === "edit") {
          el.className = "top-subtitle info";
          el.textContent =
            "Editing existing associations. Each row has its own type and allocation method.";
        } else {
          el.className = "top-subtitle warn";
          el.textContent =
            "Create mode \u2014 add rows below, configure each, then click Save.";
        }
      }

      function setPill(mode) {
        var el = document.getElementById("mode-pill");
        if (mode === "readonly") {
          el.textContent = statusLabel(meterStatusCode) + " \u00b7 Read-only";
          el.className = "mode-pill pill-readonly";
        } else if (mode === "edit") {
          el.textContent = "Edit";
          el.className = "mode-pill pill-edit";
        } else {
          el.textContent = "Create";
          el.className = "mode-pill pill-create";
        }
      }

      function showErrorBanner(msg) {
        document.getElementById("error-banner").style.display = "flex";
        document.getElementById("error-banner-text").textContent = msg;
      }

      function setStatus(type, msg) {
        var el = document.getElementById("status-msg");
        el.style.display = "flex";
        var icons = {
          ok: '<circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/>',
          err: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
          loading:
            '<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>',
        };
        var cls = {
          ok: "status status-ok",
          err: "status status-err",
          loading: "status status-loading",
        };
        el.className = cls[type] || cls.loading;
        el.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          (icons[type] || "") +
          "</svg>" +
          '<span class="status-msg-text">' +
          esc(msg) +
          "</span>" +
          (type === "loading"
            ? ""
            : '<button class="status-close" onclick="hideStatus()" aria-label="Dismiss"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>');
      }

      function hideStatus() {
        document.getElementById("status-msg").style.display = "none";
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Demo-only stub: real widget uses Xrm WebApi. This lets the layout be
      // previewed here without a live Dataverse environment behind it.
      if (!getXrm()) {
        document.querySelector(".page").style.display = "flex";
        document.getElementById("loading-state").style.display = "none";
        document.getElementById("main-content").style.display = "block";
        rows = [
          {
            uid: "r1",
            assocId: "existing-1",
            type: "unit",
            method: "area",
            recordId: "unit-1",
            customerType: "",
            pct: 62.5,
            calcedPct: 62.5,
            calcLoading: false,
            calcError: null,
            dirty: false,
            prorationEnabled: true,
            remainingAlloc: "landlord",
            combinedLine: true,
            isExistingRow: true,
          },
          {
            uid: "r2",
            assocId: "existing-2",
            type: "unit",
            method: "fixed",
            recordId: "unit-2",
            customerType: "",
            pct: 37.5,
            calcedPct: null,
            calcLoading: false,
            calcError: null,
            dirty: false,
            prorationEnabled: false,
            remainingAlloc: "split",
            combinedLine: false,
            isExistingRow: true,
          },
        ];
        allUnits = [
          {
            array_unitid: "unit-1",
            array_unitname: "Unit 101",
            array_unitareasqm: 62.5,
            array_spacetype: 590930000,
          },
          {
            array_unitid: "unit-2",
            array_unitname: "Unit 102",
            array_unitareasqm: 37.5,
            array_spacetype: 590930001,
          },
        ];
        document.getElementById("mode-pill").textContent = "Edit";
        document.getElementById("mode-pill").className = "mode-pill pill-edit";
        document.getElementById("top-subtitle").textContent =
          "Editing existing associations. Each row has its own type and allocation method.";
        document.getElementById("top-subtitle").className = "top-subtitle info";
        renderRows();
        updateAllocSummary();
      } else {
        init();
      }
    </script>
  </body>
</html>
