<!DOCTYPE html>
<html>
<head>
    <title>KSeF Integration - Purchase Invoice</title>
    <style>
        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            color: #323130;
            margin: 0;
            padding: 10px;
            background-color: #fff;
            overflow: hidden;
            box-sizing: border-box;
        }

        .ksef-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        /* Left Side: QR Section */
        .qr-section {
            flex: 0 0 auto;
        }

        .qr-wrapper img {
            display: block;
            width: 180px; /* Adjusted to match screenshot scale */
            height: 180px;
            border: 1px solid #edebe9;
        }

        /* Right Side: Details Section */
        .details-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 25px; /* pushes details down to align with QR */
            gap: 4px;
        }

        .section-header {
            font-size: 17px;
            font-weight: 900;
            color: #605e5c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: block;
        }

        /* Flex row for Label and Number */
        .field-group-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            color: #605e5c;
            text-transform: uppercase;
        }

        .value {
            font-size: 14px;
            color: #000000;
            word-break: break-all;
            font-family: 'Segoe UI', sans-serif;
        }

        .link-action {
            margin-top: 5px;
        }

        .link-action a {
            color: #0078d4;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
        }

        .link-action a:hover {
            text-decoration: underline;
        }

        @media (max-width: 400px) {
            .field-group-row {
                flex-direction: column;
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <div id="content">
        <div style="padding: 10px;">Loading KSeF Data...</div>
    </div>

<script>
    function hideParentSection() {
        try {
            const iframe = window.frameElement;
            if (iframe && iframe.closest("section")) {
                iframe.closest("section").style.display = "none";
            }
        } catch (e) { console.warn(e); }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const context = window.parent.Xrm;
        const invoiceId = context?.Page?.data?.entity?.getId()?.replace('{', '').replace('}', '');

        if (!invoiceId) {
            hideParentSection();
            return;
        }

        const select = "?$select=array_ksefno,array_ksefqrbase64,array_ksefurl";

        context.WebApi.retrieveRecord("array_purchaseinvoice", invoiceId, select).then(
            function success(result) {
                const ksefNo = result.array_ksefno;
                if (!ksefNo) {
                    hideParentSection();
                    return;
                }

                const ksefUrl = result.array_ksefurl;
                const base64 = result.array_ksefqrbase64;
                const qrSrc = base64 ? (base64.startsWith('data:image') ? base64 : `data:image/png;base64,${base64}`) : null;

                document.getElementById("content").innerHTML = `
                    <div class="ksef-container">
                        <div class="qr-section">
                            <div class="qr-wrapper">
                                ${qrSrc ? `<img src="${qrSrc}" alt="QR" />` : `<div style="width:140px;height:140px;background:#f3f2f1;"></div>`}
                            </div>
                        </div>

                        <div class="details-section">
                            <div class="section-header">KSeF Status & Verification</div>
                            
                            <div class="field-group-row">
                                <div class="label">KSeF Number: </div>
                                <div class="value">${ksefNo}</div>
                            </div>

                            <div class="link-action">
                                ${ksefUrl 
                                    ? `<a href="${ksefUrl}" target="_blank">View in KSeF Portal &rarr;</a>` 
                                    : '<span class="value">Portal Link Not Available</span>'}
                            </div>
                        </div>
                    </div>
                `;
            },
            function (error) {
                console.error(error.message);
                hideParentSection();
            }
        );
    });
</script>
</body>
</html>
