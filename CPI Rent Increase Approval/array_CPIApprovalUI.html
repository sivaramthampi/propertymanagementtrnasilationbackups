                    "<li" + (cls ? ' class="' + cls + '"' : "") + ">" + icon(cls === "warn" ? "warn" : cls === "ok" ? "check" : "dot") + "<span>" + html + "</span></li>";

                let html = li("The increase is effective from <strong>" + showDate(eff) + "</strong>" + (change != null ? " (index change " + pct(change) + ")" : "") + ".");
                if (ch && ch.inactive) html += li("The current charge is inactive; the new charge is created from it.");
                if (cpiIndexEdited() && cpiAddOn() == null) return html + li("The new rent shows once both index values are set.");
                if (!sch) return html + li(state.startMode ? "Check the split dates." : "Choose when the new rent starts.");

                const past = sch.newStart < todayDate();
                html += li(
                    "The new rent of <strong>" + money(newAmount()) + "</strong> starts on <strong>" + showDate(sch.newStart) + "</strong>" + (past ? ", a date in the past" : "") + ".",
                    past ? "warn" : ""
                );
                if (eff && sch.newStart > eff) {
                    // Days billed at the old rent: effective date to the day before the new rent (several cycles when the approval is late)
                    const to = addDays(sch.newStart, -1),
                        cycles = cyclesBetween(eff, sch.newStart);
                    html += li("<strong>" + range(eff, to) + "</strong> was billed at the old rent" + (cycles > 1 ? " (" + plural(cycles, "billing cycle") + ")" : "") + ".");
                    if (sch.missed) {
                        html += li("The difference is charged once: <strong>" + money(sch.missed.amount) + "</strong>, on the invoice of " + showDate(sch.missed.invoiceDate) + ".", "ok");
                    } else {
                        html += li(
                            "The difference is not charged: about <strong>" + money(diff != null ? round2(cycles * diff) : null) + "</strong> (" + plural(cycles, "billing cycle") +
                            " " + TXT.TIMES + " " + money(diff) + ") is not collected.",
                            "warn"
                        );
                    }
                } else if (eff && sch.newStart < eff) {
                    html += li("The new rent starts " + plural(daysBetween(sch.newStart, eff), "day") + " before the effective date.", "warn");
                } else {
                    html += li("Nothing is lost: the new rent starts on the effective date.", "ok");
                }
                if (sch.mode === "split") html += li("The old rent is billed until " + showDate(sch.oldEnd) + "; the new rent for the rest of the cycle.");
                return html;
            }

            /** "Show details" on Review: old vs new charge, the CPI calculation, charge facts and billing dates. */
            function reviewDetailsHtml() {
                const sch = getSchedule(),
                    c = state.cycle,
                    rc = state.oldRc,
                    p = getPicked(),
                    ch = state.charges[state.active],
                    calc = cpiRecalculated() ? cpiCalcHtml() : "";
                return (
                    (sch ? compareHtml(sch) : '<p class="hint">Choose when the new rent starts to compare the current and new charge.</p>') +
                    '<div class="kv">' +
                    (calc ? kv("How the CPI increase is calculated", calc) : "") +
                    kv("Recurring charge", rcLink(rc.array_recurringchargeid, rc.array_chargename) + (ch && ch.chargeId ? ' <span class="hint">' + esc(ch.chargeId) + "</span>" : "")) +
                    kv("Lease", ch ? '<span class="hfs">' + leaseDetailsHtml(ch) + "</span>" : esc(fv(p, "array_leaseagreement") || TXT.EMPTY)) +
                    kv("Lease clause", esc(fv(p, "array_leaseclause") || TXT.EMPTY)) +
                    (c
                        ? kv("Current billing cycle", range(c.fs, c.fe) + ' <span class="hint">(not invoiced yet)</span>') +
                        kv("Invoice generation date", showDate(c.gen)) +
                        (c.upcoming ? kv("Upcoming invoice generation", showDate(c.upcoming)) : "")
                        : "") +
                    "</div>"
                );
            }

            /**
             * Step 2 body for the charge in `state`: on the left the questions that apply (numbered) and
             * "Show details"; on the right the live summary card.
             */
            function reviewHtml() {
                let n = 0;
                const questions = [];
                if (state.cpi) questions.push(questionHtml(++n, state.cpi.pending ? "What is the new CPI index?" : "Is the CPI index right?", cpiQuestionBody()));
                questions.push(questionHtml(++n, "When does the new rent start?", startQuestionBody()));
                questions.push(extraHtml());
                return (
                    '<div class="rv">' +
                    '<div class="rv-main">' + questions.join("") +
                    detailsHtml(fid("rvMore"), "Show details", '<div id="' + fid("rvMoreBody") + '">' + reviewDetailsHtml() + "</div>") +
                    "</div>" +
                    '<aside class="rv-side" id="' + fid("side") + '" aria-live="polite">' + summaryCardHtml() + "</aside>" +
                    "</div>"
                );
            }

            /** Step 2 (one charge). */
            function renderStep2() {
                return (
                    '<div class="card"><h3>Check the new rent<span class="hint">Adjustment ' + esc(hname(getPicked())) + "</span></h3>" +
                    '<p class="rv-intro">Answer the questions on the left. The box on the right shows what will change.</p>' +
                    reviewHtml() +
                    "</div>"
                );
            }

            /** Step 2 (bulk): the questions and summary for every charge set to "To approve". */
            function renderBulkStep2() {
                let outstanding = 0;
                state.charges.forEach((ch, i) => {
                    if (!ch.loadError && ch.decision === "approve" && withCharge(i, () => !!nearestOlder())) outstanding++;
                });
                return (
                    '<p class="lead">For each charge, answer the questions. The box on the right of each charge shows what will change.</p>' +
                    issuesHtml(2) +
                    (outstanding
                        ? '<p><button type="button" class="link-btn" data-act="useAllPrev">Add the never-applied older increase to the new rent on the ' +
                        plural(outstanding, "charge") + " that " + (outstanding === 1 ? "has" : "have") + " one</button></p>"
                        : "") +
                    approvingCards(reviewHtml)
                );
            }

            /* =====================================================================
               11. INDEX EDITOR POPUP - choose the old / new CPI index (Step 2)
               Opened from the new index button or the old index "Change" link. Tabs: "Pick from CPI list" (the CPI Index rows of the
               lease clause's CPI type) | "Enter manually" (a typed value). Apply writes the value
               to state.cpi; Cancel, the close button, the backdrop and Escape leave it unchanged.
               state.indexEditor while open:
                 { i, field, tab: "pick" | "manual", pickId, raw, tried, focus }
               ===================================================================== */

            /**
             * Opens the popup for one index tile of the charge in `state` ("cpiPrev" | "cpiValue").
             * It opens on the list when the value was picked from a CPI Index row, or nothing is set yet and
             * a list exists; otherwise on manual entry with the current value filled in.
             */
            function openIndexEditor(field) {
                const c = state.cpi,
                    k = CPI_BOX[field],
                    hasRows = cpiRows().length > 0,
                    linked = !!cpiRow(c[k.id]),
                    hasValue = c[k.value] > 0;
                state.indexEditor = {
                    i: state.active,
                    field,
                    tab: hasRows && (linked || !hasValue) ? "pick" : "manual",
                    pickId: linked ? c[k.id] : null,
                    raw: hasValue ? c[k.raw] : "",
                    tried: false, // Apply / Enter was used with no valid value: show the error
                    focus: true // move focus into the popup on the next draw
                };
            }

            /** Closes the popup without changing anything and gives focus back to the index tile. */
            function closeIndexEditor() {
                const ed = state.indexEditor;
                if (!ed) return;
                state.indexEditor = null;
                state.focusAfter = withCharge(ed.i, () => fid(ed.field));
                render();
            }

            /**
             * The value the popup would apply: { id, raw, value } from the picked CPI Index row or the typed
             * text (id null = entered manually). value is NaN while there is no valid value.
             */
            function indexEditorChoice(ed) {
                if (ed.tab === "pick") {
                    const row = cpiRow(ed.pickId);
                    if (!row || row.array_indexvalue == null) return { id: null, raw: "", value: NaN };
                    const raw = String(row.array_indexvalue);
                    return { id: row.array_cpiindexid, raw, value: parseIndex(raw) };
                }
                return { id: null, raw: ed.raw, value: parseIndex(ed.raw) };
            }

            /**
             * Applies the popup's value to the index tile (linked to the picked CPI Index row, or entered
             * manually), refreshes the recommended missed-period amount and closes the popup.
             * Without a valid value it only shows the error.
             */
            function applyIndexEditor() {
                const ed = state.indexEditor;
                if (!ed) return;
                const choice = indexEditorChoice(ed);
                if (!(choice.value > 0)) {
                    ed.tried = true;
                    syncIndexEditor();
                    return;
                }
                withCharge(ed.i, () => {
                    const c = state.cpi,
                        k = CPI_BOX[ed.field];
                    c[k.id] = choice.id;
                    c[k.raw] = choice.raw;
                    c[k.value] = choice.value;
                    syncOneTime(); // the recommended missed-period amount follows the revised rent
                    state.focusAfter = fid(ed.field);
                });
                state.indexEditor = null;
                render();
            }

            /** Draws the popup (or hides it when closed). Called by render() and when the tab changes. */
            function renderIndexEditor() {
                const root = $("modal"),
                    ed = state.indexEditor;
                if (!ed) {
                    root.hidden = true;
                    root.innerHTML = "";
                    return;
                }
                root.innerHTML = withCharge(ed.i, () => indexEditorHtml(ed));
                root.hidden = false;
                if (ed.focus) {
                    ed.focus = false;
                    const f = root.querySelector("[data-autofocus]") || root.querySelector(".tab.sel");
                    if (f) f.focus();
                }
            }

            /**
             * Popup content for the charge in `state` (HTML): title, the two tabs, the active panel
             * (pick list or manual entry) and Cancel / Apply.
             */
            function indexEditorHtml(ed) {
                const c = state.cpi,
                    k = CPI_BOX[ed.field],
                    rows = cpiRows(),
                    valid = indexEditorChoice(ed).value > 0,
                    current = c[k.value] > 0 ? numText(c[k.value]) : null;
                // One tab button of the popup ("pick" | "manual")
                const tab = (key, ico, text, disabled) =>
                    '<button type="button" class="tab' + (ed.tab === key ? " sel" : "") + '" role="tab" aria-selected="' + (ed.tab === key) + '"' +
                    ' data-act="idxTab" data-tab="' + key + '"' + (disabled ? ' disabled title="' + esc(cpiNoListReason()) + '"' : "") + ">" + icon(ico) + esc(text) + "</button>";
                const panel = ed.tab === "pick" ? indexPickPanelHtml(ed, rows) : indexManualPanelHtml(ed, valid);
                return (
                    '<div class="modal-backdrop" data-act="idxCancel"></div>' +
                    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="idxTitle">' +
                    '<div class="modal-h"><h2 id="idxTitle">' + esc(k.label) + "</h2>" +
                    '<button type="button" class="icon-btn" data-act="idxCancel" title="Close" aria-label="Close">' + icon("close") + "</button></div>" +
                    '<div class="modal-sub">' + esc(hname(getPicked())) + (c.typeName ? '<span class="dot"></span>' + esc(c.typeName) : "") +
                    (current ? '<span class="dot"></span>Now ' + esc(current) : "") + "</div>" +
                    '<div class="modal-b">' +
                    '<div class="tabs" role="tablist">' + tab("pick", "list", "Pick from CPI list", !rows.length) + tab("manual", "edit", "Enter manually", false) + "</div>" +
                    '<div role="tabpanel">' + panel + "</div>" +
                    "</div>" +
                    '<div class="modal-f"><button type="button" class="btn" data-act="idxCancel">Cancel</button>' +
                    '<button type="button" class="btn btn-primary" id="idxApply" data-act="idxApply"' + (valid ? "" : " disabled") + ">" + icon("check") + "Apply</button></div>" +
                    "</div>"
                );
            }

            /** "Pick from CPI list" panel (HTML): one radio row per CPI index (month, value), newest first. */
            function indexPickPanelHtml(ed, rows) {
                if (!rows.length) return msgBox("info", esc(cpiNoListReason()));
                const c = state.cpi,
                    inUse = c[CPI_BOX[ed.field].id];
                const list = rows
                    .map((r, n) => {
                        const sel = r.array_cpiindexid === ed.pickId,
                            focus = sel || (!ed.pickId && n === 0);
                        return (
                            '<label class="pick-row' + (sel ? " sel" : "") + '">' +
                            '<input type="radio" name="idxPick" value="' + esc(r.array_cpiindexid) + '"' + (sel ? " checked" : "") + (focus ? " data-autofocus" : "") + " />" +
                            '<span class="pick-month">' + esc(monthText(parseDate(r.array_perioddate))) +
                            (r.array_cpiindexid === inUse ? ' <span class="badge current">In use</span>' : "") + "</span>" +
                            '<span class="pick-v">' + esc(numText(r.array_indexvalue)) + "</span></label>"
                        );
                    })
                    .join("");
                return (
                    '<div class="pick-h">' + esc((c.typeName || "CPI indices") + ", last " + CPI_INDEX_MONTHS + " months") + "</div>" +
                    '<div class="pick-list" role="radiogroup" aria-label="CPI indices">' + list + "</div>" +
                    '<div class="hint">Select a month, then Apply (or double-click it).</div>'
                );
            }

            /** "Enter manually" panel (HTML): the index value box, a hint and the error line. */
            function indexManualPanelHtml(ed, valid) {
                return (
                    '<div class="field-sm"><label class="lbl" for="idxRaw">Index value</label>' +
                    '<input class="input-num" id="idxRaw" type="text" inputmode="decimal" autocomplete="off" value="' + esc(ed.raw) + '" data-autofocus /></div>' +
                    '<div class="hint">A number greater than 0, for example 104.25.</div>' +
                    '<div class="field-err" id="idxErr"' + (indexEditorShowError(ed, valid) ? "" : " hidden") + ">Enter a number greater than 0.</div>"
                );
            }

            /** True when the manual entry's error line should show: something invalid was typed, or Apply was tried. */
            function indexEditorShowError(ed, valid) {
                return ed.tab === "manual" && !valid && (ed.tried || String(ed.raw).trim() !== "");
            }

            /** Updates the popup's Apply button, picked row and error line in place (no redraw, so focus and typing are kept). */
            function syncIndexEditor() {
                const ed = state.indexEditor,
                    valid = indexEditorChoice(ed).value > 0;
                $("idxApply").disabled = !valid;
                document.querySelectorAll("#modal .pick-row").forEach((row) => row.classList.toggle("sel", row.querySelector("input").checked));
                const err = $("idxErr");
                if (err) err.hidden = !indexEditorShowError(ed, valid);
            }

            /* =====================================================================
               12. STEP 3 - CONFIRM & APPROVE
               ===================================================================== */

            /** One line of the "What will change" list. */
            function changeRow(badgeCls, badgeLabel, h, detailHtml) {
                return (
                    '<li><span class="badge ' + badgeCls + '">' + esc(badgeLabel) + "</span>" +
                    '<span class="strong">' + esc(hname(h)) + "</span>" +
                    '<span class="hint">effective ' + showDate(effDate(h)) + '<span class="dot"></span>' + detailHtml + "</span></li>"
                );
            }

            /** "What will change" line for the one-time (missed-period) charge the approval creates (HTML). */
            function oneTimeChangeRow(m) {
                return (
                    '<li><span class="badge approved">Will be created</span><span class="strong">One-time charge</span>' +
                    '<span class="hint"><strong>' + money(m.amount) + "</strong> for the missed period " + range(m.from, m.to) +
                    '<span class="dot"></span>invoiced ' + showDate(m.invoiceDate) + "</span></li>"
                );
            }

            /**
             * Changes of the charge in `state` - what WILL happen on approval (nothing is saved yet, so the labels
             * are future tense): the approved history, the one-time charge created (if any), Missed and unchanged
             * histories, then which CPI schedules are completed.
             */
            function statusChangesHtml() {
                const p = getPicked(),
                    sch = getSchedule(),
                    missed = olderSelectable(),
                    untouched = newerSelectable(),
                    withSchedule = [p].concat(missed).filter((h) => h._array_cpiadjustmentschedule_value);
                return (
                    '<ul class="changes">' +
                    changeRow("pending", "Will be approved", p, amountChangeHtml(rcAmount(), newAmount())) +
                    (sch && sch.missed ? oneTimeChangeRow(sch.missed) : "") +
                    missed
                        .map((h) =>
                            changeRow("missed", "Will be Missed", h, "never applied" + (increase(h) != null ? ", its increase of " + money(increase(h)) + " is dropped" : " (its CPI index was never chosen)"))
                        )
                        .join("") +
                    untouched.map((h) => changeRow("untouched", "No change", h, increase(h) != null ? "CPI increase " + money(increase(h)) : "CPI pending")).join("") +
                    "</ul>" +
                    (withSchedule.length
                        ? '<p class="hint">The CPI schedule' + (withSchedule.length > 1 ? "s" : "") + " of " + esc(withSchedule.map(hname).join(", ")) +
                        (withSchedule.length > 1 ? " are" : " is") + " set to Inactive (Completed).</p>"
                        : "")
                );
            }

            /**
             * Step 3 CPI index (HTML): the new and old index and where they came from, the change, what was changed
             * on a saved increase, and what the approval saves (history, and the lease clause when it is updated).
             */
            function cpiSummaryHtml() {
                const c = state.cpi,
                    changes = cpiChangeList();
                // One index value with where it came from: "122.1 (CPI index Sep 2026)"
                const value = (field) =>
                    "<strong>" + esc(numText(c[CPI_BOX[field].value])) + "</strong>" + (cpiSourceText(field) ? ' <span class="hint">(' + esc(cpiSourceText(field)) + ")</span>" : "");
                return (
                    value("cpiValue") + '<span class="dot"></span>old index ' + value("cpiPrev") +
                    '<span class="dot"></span>change <strong>' + pct(indexChange(getPicked())) + "</strong><br />" +
                    '<span class="hint">' + (changes.length ? "Changed: " + esc(changes.join("; ")) + ". " : "") +
                    "Saved on " + esc(hname(getPicked())) + " with the approval" +
                    (cpiUpdatesClause() ? "; the lease clause&#39;s current index becomes " + esc(numText(c.value)) : "") + ".</span>"
                );
            }

            /** Step 3 CPI index row (kv HTML) when the approval saves CPI values on the history, else "". */
            function cpiSummaryRow() {
                if (!cpiWillSave()) return "";
                return kv(state.cpi.pending ? "New CPI index" : "CPI index (changed)", cpiSummaryHtml());
            }

            /**
             * Step 3 "Lease limit" row (kv HTML) when a lease floor / cap changes the CPI increase, else "": applied
             * (plain CPI amount -> limited amount), switched off by the approver, or applied by the CPI run.
             */
            function limitSummaryRow() {
                const l = historyLimit(getPicked());
                if (!l) return "";
                const tag = esc(limitTagText(l.res.applied, l.lim)),
                    name = l.res.applied === "max" ? "maximum" : "minimum";
                if (l.off) {
                    return kv(
                        "Lease limit",
                        '<span class="lim-warn">Not applied</span>: the CPI amount of <strong>' + money(cpiRawAddOn()) + "</strong> is used" +
                        ' <span class="hint">(the lease ' + name + " would make it " + money(l.res.amount) + ")</span>"
                    );
                }
                if (!cpiIndexEdited()) return kv("Lease limit", tag + ' <span class="hint">(applied by the CPI run)</span>');
                return kv("Lease limit", "<strong>" + tag + "</strong>: CPI increase " + money(cpiRawAddOn()) + " " + icon("arrowRight", "sm") + " <strong>" + money(l.res.amount) + "</strong>");
            }

            /** Confirm summary for the charge in `state`: headline, amount flow, key dates, summary points, details on demand. */
            function confirmSummaryHtml(sch) {
                const c = state.cycle;
                return (
                    "<h3>New rent from " + showDate(sch.newStart) + '<span class="hint">' + esc(MODE_LABEL[sch.mode]) + (sch.missed ? " + missed-period charge" : "") + "</span></h3>" +
                    flowHtml(sch) +
                    (sch.mode === "split" ? timelineHtml(sch) : "") +
                    '<div class="kv">' +
                    cpiSummaryRow() +
                    limitSummaryRow() +
                    kv("New rent starts", "<strong>" + showDate(sch.newStart) + "</strong>") +
                    kv("Last day at the old rent", showDate(sch.oldEnd) + ' <span class="hint">(the current charge stays Active)</span>') +
                    kv("First invoice at the new rent", showDate(sch.invoiceGenDate)) +
                    (sch.missed
                        ? kv(
                            "Missed-period charge",
                            "<strong>" + money(sch.missed.amount) + "</strong> for " + range(sch.missed.from, sch.missed.to) +
                            ' <span class="hint">(one-time, invoiced ' + showDate(sch.missed.invoiceDate) + ")</span>"
                        )
                        : "") +
                    "</div>" +
                    '<div class="rv-h">Summary</div>' +
                    '<ul class="points">' + impactHtml() + "</ul>" +
                    (effectiveAdditional() > 0 ? '<div class="warn-box">' + recurringWarningHtml() + "</div>" : "") +
                    detailsHtml(
                        fid("cfMore"),
                        "Show details",
                        compareHtml(sch) +
                        '<div class="kv">' +
                        kv("Frequency", esc(c.freq.label)) +
                        kv("Charge end date", showDate(c.chargeEnd) + ' <span class="hint">(unchanged)</span>') +
                        "</div>"
                    )
                );
            }

            /** "Send notification email" tick box for the charge in `state` (one charge, Step 3). Unticked by default. */
            function notifyHtml() {
                return (
                    '<label class="check first"><input type="checkbox" id="' + fid("notify") + '"' + (state.notify ? " checked" : "") + " />" +
                    "<span><strong>Send notification email</strong><br />" +
                    '<span class="hint">Ticked: Send Notification is saved as Yes on ' + esc(hname(getPicked())) + " when it is approved. Unticked: No.</span></span></label>"
                );
            }

            /** Step 3 (one charge): the new rent, every history status that will change, and the notification tick box. */
            function renderStep3() {
                const sch = getSchedule();
                return (
                    (sch ? '<div class="card">' + confirmSummaryHtml(sch) + "</div>" : "") +
                    '<div class="card"><h3>What will change</h3>' + statusChangesHtml() + "</div>" +
                    '<div class="card">' + notifyHtml() + "</div>"
                );
            }

            /**
             * One compact bulk Confirm row for the charge in `state`; click it to expand the details.
             * The Notify cell holds the charge's "Send notification email" tick box (approvals only; a
             * rejection is always No). data-charge on the box tells the change handler which charge it is.
             */
            function summaryRowHtml(ch) {
                const reject = state.decision === "reject",
                    sch = reject ? null : getSchedule(),
                    d = DECISION[state.decision],
                    p = getPicked();
                const cells =
                    '<span class="sum-charge"><span class="strong">' + esc(ch.chargeName) + '</span><span class="charge-meta hfs">' + chargeIdsHtml(ch) + "</span></span>" +
                    "<span>" + esc(hname(p)) + "</span>" +
                    "<span>" +
                    (sch ? showDate(sch.newStart) + '<span class="sum-sub">' + esc(MODE_LABEL[sch.mode]) + (sch.missed ? " + missed period" : "") + "</span>" : TXT.EMPTY) +
                    "</span>" +
                    '<span class="num">' +
                    (reject ? TXT.EMPTY : amountChangeHtml(rcAmount(), newAmount())) +
                    (sch && sch.missed ? '<span class="sum-sub">+ missed period ' + money(sch.missed.amount) + "</span>" : "") +
                    "</span>" +
                    '<span class="sum-notify">' +
                    (reject
                        ? TXT.EMPTY
                        : '<label title="Send notification email"><input type="checkbox" id="' + fid("notify") + '" data-charge="' + state.active + '"' +
                        (state.notify ? " checked" : "") + ' aria-label="Send notification email for ' + esc(chargeLabel(ch)) + '" /></label>') +
                    "</span>" +
                    '<span><span class="badge ' + d.cls + '">' + esc(d.label) + "</span></span>" +
                    '<span class="sum-chev" aria-hidden="true">' + icon("chevronRight") + "</span>";
                const body = reject
                    ? '<ul class="changes">' +
                    changeRow("to-reject", "Will be rejected", p, "no recurring charge is created" + (p._array_cpiadjustmentschedule_value ? "; its CPI schedule is set to Inactive (Completed)" : "")) +
                    "</ul>"
                    : (cpiSummaryRow() + limitSummaryRow() ? '<div class="kv">' + cpiSummaryRow() + limitSummaryRow() + "</div>" : "") +
                    '<div class="rv-h">Summary</div>' +
                    '<ul class="points">' + impactHtml() + "</ul>" +
                    (sch && sch.mode === "split" ? timelineHtml(sch) : "") +
                    (sch ? compareHtml(sch) : "") +
                    '<div class="rv-h">What will change</div>' +
                    statusChangesHtml();
                return detailsHtml(fid("sum"), cells, body, "sum-row");
            }

            /**
             * "Tick all" for the bulk Notify column: ticks / unticks "Send notification email" on every charge
             * set to To approve. Checked when all are ticked; data-mixed (shown as a dash, see render) when some are.
             */
            function notifyAllHtml() {
                const approving = state.charges.filter((ch) => !ch.loadError && ch.decision === "approve");
                if (!approving.length) return "";
                const ticked = approving.filter((ch) => ch.notify).length;
                return (
                    '<label class="check"><input type="checkbox" id="notifyAll"' +
                    (ticked === approving.length ? " checked" : "") + (ticked && ticked < approving.length ? " data-mixed" : "") + " />" +
                    "<span><strong>Send notification email</strong> for every approved charge" +
                    ' <span class="hint">(' + ticked + " of " + approving.length + " ticked)</span><br />" +
                    '<span class="hint">Or tick each charge in the Notify column. Unticked = Send Notification No; rejections are always No.</span></span></label>'
                );
            }

            /** Step 3 (bulk): totals, notification "tick all", one compact row per charge (grouped by lease agreement), skipped charges. */
            function renderBulkStep3() {
                const n = decisionCounts();
                const skipped = state.charges.filter((ch) => ch.loadError || ch.decision === "skip");
                let missedCharges = 0;
                state.charges.forEach((ch, i) => {
                    if (!ch.loadError && ch.decision === "approve" && withCharge(i, missedChargeOn)) missedCharges++;
                });
                return (
                    '<div class="card"><h3>Ready to save</h3>' +
                    '<p class="ready"><strong>' + n.approve + "</strong>&nbsp;to approve" +
                    (missedCharges ? "&nbsp;(" + plural(missedCharges, "missed-period charge") + ")" : "") +
                    '<span class="dot"></span><strong>' + n.reject + "</strong>&nbsp;to reject" +
                    '<span class="dot"></span><strong>' + n.skip + "</strong>&nbsp;skipped</p>" +
                    '<p class="hint ready-note">All ' + countOps() + " changes are saved in one transaction: if anything fails, nothing is saved. Click a row to see its details.</p>" +
                    notifyAllHtml() +
                    "</div>" +
                    issuesHtml(3) +
                    byLease(
                        (ch, i) => (ch.loadError || ch.decision === "skip" ? "" : withCharge(i, () => summaryRowHtml(ch))),
                        // Column headings inside each lease panel, so they line up with its rows
                        '<div class="sum-head"><span>Recurring charge</span><span>Adjustment</span><span>New rent starts</span><span class="num">Rent (old to new)</span>' +
                        '<span class="sum-notify">Notify</span><span>Decision</span><span></span></div>'
                    ) +
                    (skipped.length ? '<p class="hint">Skipped (not changed): ' + skipped.map((ch) => esc(chargeLabel(ch))).join(", ") + "</p>" : "")
                );
            }

            /* ---------- Approval writes ---------- */

            /** A copy of the current RC for a new charge: copied columns, lookups (with history fallback) and tenant. */
            function copyRcBase(rc, picked) {
                const body = {};
                RC_COPY_COLUMNS.forEach((c) => {
                    if (rc[c] !== null && rc[c] !== undefined) body[c] = rc[c];
                });
                RC_COPY_LOOKUPS.forEach((l) => {
                    const id = rc["_" + l.attr + "_value"] || (l.historyFallback ? picked[l.historyFallback] : null);
                    if (id) body[l.nav + "@odata.bind"] = "/" + l.set + "(" + id + ")";
                });
                const tenantId = rc["_" + RC_TENANT.attr + "_value"];
                if (tenantId) {
                    const logical = rc["_" + RC_TENANT.attr + "_value@Microsoft.Dynamics.CRM.lookuplogicalname"];
                    const set = RC_TENANT.sets[logical] || logical + "s";
                    body[RC_TENANT.navPrefix + logical + "@odata.bind"] = "/" + set + "(" + tenantId + ")";
                }
                return body;
            }

            /**
             * Body of the missed-period charge (Next cycle, box ticked): a copy of the current RC - same charge
             * name - with Frequency = One Time Charge, the approver's amount, the missed period and the charge's
             * next regular invoice date. array_notes says "CPI missed period ...". Not linked through Amended From
             * Charge (it does not replace the charge).
             */
            function buildMissedBody(rc, picked, sch) {
                const ct = sch.missed,
                    body = copyRcBase(rc, picked);
                body.array_frequency = ONE_TIME_FREQUENCY;
                body.array_amount = ct.amount;
                body.array_startdate = isoDate(ct.from);
                body.array_enddate = isoDate(ct.to);
                body.array_frequencystartdate = isoDate(ct.from);
                body.array_frequencyenddate = isoDate(ct.to);
                body.array_frequencystartday = ct.from.getUTCDate();
                if (ct.invoiceDate) body.array_invoicegenerationdate = isoDate(ct.invoiceDate);
                body.array_prorationenabled = false;
                body.array_prorationenabledforfirstcycle = false;
                body.array_prorationenabledforlastcycle = false;
                body.array_notes =
                    "CPI missed period" + TXT.DASH + hname(picked) + ": " + dateText(ct.from) + TXT.RANGE + dateText(ct.to) +
                    " was billed at the old rent (" + plural(ct.cycles, "cycle") + "). One-time charge created by the CPI approval.";
                body.statuscode = RC_ACTIVE_STATUSCODE;
                return body;
            }

            /**
             * Body of the new recurring charge: a copy of the current RC (columns, lookups, tenant)
             * with the new amount, the schedule's dates and, for a split, the approver's proration.
             */
            function buildNewRcBody(rc, picked, sch, amount) {
                const body = copyRcBase(rc, picked);

                // Overrides
                body.array_amount = amount;
                body.array_startdate = isoDate(sch.newStart);
                body.array_frequencystartdate = isoDate(sch.freqStart);
                body.array_frequencyenddate = isoDate(sch.freqEnd);
                body.array_frequencystartday = sch.freqStartDay;
                if (sch.invoiceGenDate) body.array_invoicegenerationdate = isoDate(sch.invoiceGenDate);
                if (sch.upcomingGenDate) body.array_upcominginvoicegenerationday = isoDate(sch.upcomingGenDate);
                if (state.cycle.chargeEnd) body.array_enddate = isoDate(state.cycle.chargeEnd); // lease/charge end, unchanged
                if (sch.flags) {
                    // Split: proration as set by the approver
                    body.array_prorationenabled = sch.flags.prorate;
                    body.array_prorationenabledforfirstcycle = sch.flags.firstCycle;
                }
                body.statuscode = RC_ACTIVE_STATUSCODE;
                body["array_AmendedFromCharge@odata.bind"] = "/array_recurringcharges(" + rc.array_recurringchargeid + ")";
                return body;
            }

            /** Update for the current recurring charge: new end date (it stays Active), frequency window, lease clause, proration, split flag. */
            function buildOldRcBody(sch) {
                const body = { array_enddate: isoDate(sch.oldEnd) }; // stays Active
                body[CPI_SPLIT_FLAG] = sch.mode === "split";
                // Frequency Start / End = the old charge's last cycle, ending on its new end date
                // (the proration child flow bills Frequency End - Frequency Start + 1 days)
                if (sch.oldFreqStart) {
                    body.array_frequencystartdate = isoDate(sch.oldFreqStart);
                    body.array_frequencyenddate = isoDate(sch.oldEnd);
                    body.array_frequencystartday = sch.oldFreqStart.getUTCDate();
                }
                // Re-assert the lease clause. Creating the new charge can detach it from the old one;
                // this PATCH runs after the create in the same changeset, so the value is restored.
                const clauseId = state.oldRc._array_leaseclause_value;
                if (clauseId) body["array_LeaseClause@odata.bind"] = "/array_leaseclauses(" + clauseId + ")";
                if (sch.clearOldUpcoming) body.array_upcominginvoicegenerationday = null; // billing never picks it again
                if (sch.flags) {
                    body.array_prorationenabledforlastcycle = sch.flags.lastCycle;
                    if (sch.flags.lastCycle) body.array_prorationenabled = true;
                }
                return body;
            }

            /**
             * CPI values saved on the history in the approval update (as the CPI run would; call when cpiWillSave or
             * cpiRecalculated): all of them for a CPI-pending increase or a changed index, else the effective date,
             * the CPI Index link that was changed, and - for a saved one whose lease limit was unticked - the plain
             * CPI increase. The increase is saved after the lease floor / cap (unless the approver unticked it); the
             * index change % stays the plain index change, as the CPI run saves it.
             */
            function cpiHistoryFields() {
                const c = state.cpi;
                const body = { array_adjustmenteffectivefrom: isoDate(c.eff) };
                if (cpiIndexEdited()) {
                    Object.assign(body, {
                        array_previousindexvalue: c.prev,
                        array_newindexvalue: c.value,
                        array_indexchangepercentage: cpiChange(),
                        array_increasedamount: cpiAddOn()
                    });
                } else if (cpiRecalculated()) {
                    body.array_increasedamount = cpiAddOn(); // saved one, lease limit unticked: the plain CPI amount
                }
                if (c.indexId && c.indexId !== c.indexIdStored) body["array_CPIIndex@odata.bind"] = "/array_cpiindexes(" + c.indexId + ")";
                if (c.prevIndexId && PREVIOUS_CPI_INDEX_NAV) body[PREVIOUS_CPI_INDEX_NAV + "@odata.bind"] = "/array_cpiindexes(" + c.prevIndexId + ")";
                return body;
            }

            /**
             * Extra writes when the approval saves new index values (CPI-pending, or a changed index), as the CPI
             * run does: the lease clause's current index (the next CPI run compares against it) and last CPI
             * adjustment date, the CPI trigger marked triggered with the change, and - when a
             * saved new index was replaced by a typed one - the history's link to its old CPI Index row removed.
             * [] when no index value changes.
             */
            function cpiRequests(picked) {
                const c = state.cpi,
                    requests = [];
                if (!c || !picked || !cpiIndexEdited()) return requests;
                if (cpiUpdatesClause()) {
                    requests.push({
                        label: "Update the lease clause's current index",
                        method: "PATCH",
                        path: "array_leaseclauses(" + picked._array_leaseclause_value + ")",
                        body: { array_currentindex: c.value, array_lastadjustmentdatecpi: isoDate(c.eff) }
                    });
                }
                if (picked._array_triggerid_value) {
                    requests.push({
                        label: "Mark the CPI trigger as triggered",
                        method: "PATCH",
                        path: "array_cpiadjustmenttriggers(" + picked._array_triggerid_value + ")",
                        body: { array_wastriggered: true, array_indexchangepercentage: cpiChange(), array_startingindex: c.prev }
                    });
                }
                if (c.indexIdStored && !c.indexId && !sameIndex(c.value, c.valueStored)) {
                    requests.push({
                        label: "Remove the old CPI index link from " + hname(picked),
                        method: "DELETE",
                        path: "array_cpiadjustmenthistories(" + hid(picked) + ")/array_CPIIndex/$ref"
                    });
                }
                return requests;
            }

            /** Histories whose CPI schedules approving `picked` completes (charge in `state`): it and the older open ones marked Missed. */
            function closedByApproval(picked) {
                return picked ? [picked].concat(olderSelectable()) : [];
            }

            /**
             * Writes that set the CPI schedules of `histories` to Status Inactive, Status Reason Completed, each
             * schedule once ([] when none is linked). Approval: see closedByApproval; rejection: the rejected history.
             */
            function scheduleRequests(histories) {
                const ids = Array.from(new Set(histories.map((h) => h._array_cpiadjustmentschedule_value).filter(Boolean)));
                return ids.map((id) => ({
                    label: "Complete the CPI schedule",
                    method: "PATCH",
                    path: "array_cpiadjustmentschedules(" + id + ")",
                    body: { statecode: SCHEDULE_INACTIVE, statuscode: SCHEDULE_COMPLETED }
                }));
            }

            /**
             * All writes of one rejection, in changeset order: the history Rejected (Send Notification = No), then
             * its CPI schedule completed. No recurring charge, lease clause or other history is touched.
             */
            function buildRejectRequests(picked) {
                return [
                    {
                        label: "Reject " + hname(picked),
                        method: "PATCH",
                        path: "array_cpiadjustmenthistories(" + hid(picked) + ")",
                        body: { array_approvalstatus: STATUS.REJECTED, [SEND_NOTIFICATION]: false }
                    }
                ].concat(scheduleRequests([picked]));
            }

            /**
             * All writes of one approval (charge in `state`), in changeset order:
             *   (0. create the missed-period charge - Next cycle with the box ticked)
             *   1. create the new RC   2. end the current RC
             *   3. approve the picked history (Send Notification = the Step 3 tick box, in the same update;
             *      CPI-pending or changed on Step 2: also its CPI values - see cpiHistoryFields)
             *   4+. mark each older open history Missed (Send Notification = No)
             *   (then, CPI-pending or index changed: update the lease clause and the CPI trigger - see cpiRequests)
             *   (last: set the CPI schedules of the approved and Missed histories Inactive / Completed - see scheduleRequests)
             * The missed-period charge is created first, so the new recurring charge is the newest charge on the
             * lease clause; the "end the current RC" PATCH then re-asserts the clause on the old charge.
             * @param {number} [offset] requests already in the changeset (bulk); Content-IDs continue after them
             * @returns {{requests, amount, additional, previous, newRcCid:string, oneTimeCid:string|null, oneTimeAmount, missedCount, notify:boolean}}
             *          (oneTime* = the missed-period charge)
             */
            function buildApprovalRequests(offset) {
                const base = offset || 0,
                    rc = state.oldRc,
                    sch = getSchedule(),
                    picked = getPicked();
                const additional = effectiveAdditional();
                const amount = newAmount();

                const requests = [];
                if (sch.missed) {
                    requests.push({ label: "Create the missed-period charge", method: "POST", path: "array_recurringcharges", body: buildMissedBody(rc, picked, sch) });
                }
                const oneTimeCid = sch.missed ? String(base + 1) : null;
                requests.push({
                    label: "Create the new recurring charge",
                    method: "POST",
                    path: "array_recurringcharges",
                    body: buildNewRcBody(rc, picked, sch, amount)
                });
                const newRcCid = String(base + requests.length); // Content-ID of the new recurring charge
                requests.push({
                    label: "End the current recurring charge",
                    method: "PATCH",
                    path: "array_recurringcharges(" + rc.array_recurringchargeid + ")",
                    body: buildOldRcBody(sch)
                });

                const pickedBody = {
                    array_approvalstatus: STATUS.APPROVED,
                    array_previousrent: rc.array_amount,
                    array_newrent: amount,
                    array_additionalchargeamount: additional,
                    [SEND_NOTIFICATION]: !!state.notify // same update as the status, so a notification flow sees both together
                };
                if (cpiWillSave() || cpiRecalculated()) Object.assign(pickedBody, cpiHistoryFields());
                if (LINK_HISTORY_TO_NEW_RC) pickedBody["array_RecurringCharge@odata.bind"] = "$" + newRcCid;
                requests.push({
                    label: "Approve " + hname(picked),
                    method: "PATCH",
                    path: "array_cpiadjustmenthistories(" + hid(picked) + ")",
                    body: pickedBody
                });

                olderSelectable().forEach((h) =>
                    requests.push({
                        label: "Mark " + hname(h) + " as Missed",
                        method: "PATCH",
                        path: "array_cpiadjustmenthistories(" + hid(h) + ")",
                        body: { array_approvalstatus: STATUS.MISSED, [SEND_NOTIFICATION]: false }
                    })
                );
                requests.push(...cpiRequests(picked));
                requests.push(...scheduleRequests(closedByApproval(picked)));

                return {
                    requests,
                    amount,
                    additional,
                    previous: rc.array_amount,
                    newRcCid,
                    oneTimeCid,
                    oneTimeAmount: sch.missed ? sch.missed.amount : 0,
                    missedCount: olderSelectable().length,
                    notify: !!state.notify
                };
            }

            /**
             * Approve button (one charge). Re-checks the history and the charge, then saves everything
             * in one atomic $batch. On success state.done holds the result; on failure state.error explains it.
             */
            async function approve() {
                if (state.busy || state.done || state.blocker) return;
                const picked = getPicked();
                if (!picked) return;

                state.busy = true; // double-click guard: set before any await
                state.error = null;
                renderFooter();
                showOverlay("Approving: creating the new recurring charge...");
                try {
                    // Re-check right before writing: someone else may have acted in the meantime
                    const fresh = await state.xrm.WebApi.retrieveRecord(
                        "array_cpiadjustmenthistory",
                        hid(picked),
                        "?$select=array_approvalstatus,statecode,array_increasedamount,array_newrent,array_previousrent"
                    );
                    if (!isSelectable(fresh)) {
                        const label = (STATUS_INFO[fresh.array_approvalstatus] || { label: "changed" }).label;
                        throw new Error("This adjustment is now " + label + ". Close and reopen to see the latest status.");
                    }
                    if (state.cpi && state.cpi.pending && !isCpiPending(fresh)) throw new Error("The CPI values of this adjustment have just been filled in. Close and reopen to see them.");
                    if (cpiError()) throw new Error(cpiError());
                    const amended = await findActiveAmendment(state.oldRc.array_recurringchargeid);
                    if (amended) throw new Error("The current charge has just been replaced by another approval. Close and reopen.");
                    if (rcAmount() == null) throw new Error("The current recurring charge has no Amount.");
                    if (increase(picked) == null) throw new Error("This adjustment has no Increased Amount.");
                    if (!getSchedule()) throw new Error("Choose when the new rent should start and check the dates.");
                    if (oneTimeError()) throw new Error(oneTimeError());

                    const plan = buildApprovalRequests();
                    const created = await executeChangeset(plan.requests);

                    // Pre-empt the webhook flow's per-charge invoicing by firing the
                    // batch flow once. Must run before the webhook's 30s debounce.
                    showOverlay("Generating invoices...");
                    await triggerBatchInvoiceGeneration();

                    state.done = {
                        kind: "approved",
                        newRcId: created[plan.newRcCid] || null,
                        oneTimeId: plan.oneTimeCid ? created[plan.oneTimeCid] || null : null,
                        oneTimeAmount: plan.oneTimeAmount,
                        amount: plan.amount,
                        additional: plan.additional,
                        previous: plan.previous,
                        missedCount: plan.missedCount,
                        notify: plan.notify,
                        sch: getSchedule()
                    };
                } catch (e) {
                    if (e.uncertain) {
                        state.error = e.message;
                    } else {
                        state.error =
                            (e.step ? 'Approval failed at step "' + e.step + '": ' : "Approval failed: ") +
                            (e.message || String(e)) +
                            " Nothing was saved: the whole approval was rolled back.";
                    }
                } finally {
                    state.busy = false;
                    hideOverlay();
                    render();
                }
            }

            /**
             * All writes of the bulk run, charge by charge, for ONE changeset:
             * approvals as in buildApprovalRequests (each history bound to its own new RC through the
             * Content-ID of that charge's create request), rejections as in buildRejectRequests.
             * @returns {{requests: object[], items: {i:number, kind:string, newRcCid?:string, oneTimeCid?:string, result?:object}[]}}
             */
            function buildBulkRequests() {
                const requests = [],
                    items = [];
                state.charges.forEach((ch, i) => {
                    if (ch.loadError || ch.decision === "skip") return;
                    withCharge(i, () => {
                        const p = getPicked();
                        if (state.decision === "reject") {
                            buildRejectRequests(p).forEach((r) => requests.push(Object.assign(r, { label: chargeLabel(ch) + ": " + r.label })));
                            items.push({ i, kind: "rejected" });
                            return;
                        }
                        const plan = buildApprovalRequests(requests.length); // Content-IDs continue after the requests so far
                        plan.requests.forEach((r) => requests.push(Object.assign(r, { label: chargeLabel(ch) + ": " + r.label })));
                        items.push({
                            i,
                            kind: "approved",
                            newRcCid: plan.newRcCid,
                            oneTimeCid: plan.oneTimeCid,
                            result: {
                                amount: plan.amount,
                                additional: plan.additional,
                                previous: plan.previous,
                                missedCount: plan.missedCount,
                                oneTimeAmount: plan.oneTimeAmount,
                                notify: plan.notify,
                                sch: getSchedule()
                            }
                        });
                    });
                });
                return { requests, items };
            }

            /**
             * "Approve all" (bulk Step 3). Re-checks every history and charge, then saves all approvals and
             * rejections in ONE changeset: everything is saved, or nothing is.
             */
            async function approveAll() {
                if (state.busy || state.bulkDone || bulkIssues(3).length) return;

                state.busy = true; // double-click guard: set before any await
                state.bulkError = null;
                renderFooter();
                showOverlay("Checking the selected records...");
                try {
                    const acting = state.charges.filter((ch) => !ch.loadError && ch.decision !== "skip");
                    const approving = acting.filter((ch) => ch.decision === "approve");

                    // Re-check right before writing: someone else may have acted in the meantime
                    const fresh = await retrieveByIds(
                        "array_cpiadjustmenthistory",
                        "array_cpiadjustmenthistoryid,array_approvalstatus,statecode,array_increasedamount,array_newrent,array_previousrent",
                        "array_cpiadjustmenthistoryid",
                        acting.map((ch) => ch.pickedId)
                    );
                    acting.forEach((ch) => {
                        const f = fresh.find((h) => hid(h) === ch.pickedId);
                        if (!f || !isSelectable(f)) {
                            const now = f ? "is now " + (STATUS_INFO[f.array_approvalstatus] || { label: "changed" }).label : "can no longer be found";
                            throw new Error(chargeLabel(ch) + ": the selected adjustment " + now + ". Close and reopen to see the latest status.");
                        }
                        if (ch.decision === "approve" && ch.cpi && ch.cpi.pending && !isCpiPending(f)) {
                            throw new Error(chargeLabel(ch) + ": the CPI values of the selected adjustment have just been filled in. Close and reopen to see them.");
                        }
                    });
                    const replaced = await retrieveByIds(
                        "array_recurringcharge",
                        "array_recurringchargeid,_array_amendedfromcharge_value",
                        "_array_amendedfromcharge_value",
                        approving.map((ch) => ch.rcId),
                        " and statecode eq " + RC_ACTIVE_STATECODE
                    );
                    if (replaced.length) {
                        const names = approving.filter((ch) => replaced.some((r) => r._array_amendedfromcharge_value === ch.rcId)).map(chargeLabel);
                        throw new Error(names.join(", ") + ": the current charge has just been replaced by another approval. Close and reopen.");
                    }

                    const plan = buildBulkRequests();
                    showOverlay("Saving " + plural(acting.length, "charge") + " in one transaction...");
                    const created = await executeChangeset(plan.requests);

                    // Pre-empt the webhook flow's per-charge invoicing by firing the
                    // batch flow once. Must run before the webhook's 30s debounce.
                    showOverlay("Generating invoices...");
                    await triggerBatchInvoiceGeneration();

                    plan.items.forEach((it) => {
                        state.charges[it.i].done =
                            it.kind === "approved"
                                ? Object.assign(
                                    { kind: "approved", newRcId: created[it.newRcCid] || null, oneTimeId: it.oneTimeCid ? created[it.oneTimeCid] || null : null },
                                    it.result
                                )
                                : { kind: "rejected" };
                    });
                    state.bulkDone = decisionCounts();
                } catch (e) {
                    state.bulkError = e.uncertain
                        ? e.message
                        : (e.step ? 'Approval failed at "' + e.step + '": ' : "Approval failed: ") +
                        (e.message || String(e)) +
                        " Nothing was saved: the whole bulk approval was rolled back.";
                } finally {
                    state.busy = false;
                    hideOverlay();
                    render();
                }
            }

            /* =====================================================================
               13. REJECT & CLOSE (one charge; in bulk, rejections are decisions on Step 1)
               ===================================================================== */

            /** Dynamics confirm dialog (falls back to the browser's confirm). Resolves true when confirmed. */
            async function confirmDialog(title, text, confirmLabel) {
                try {
                    const r = await state.xrm.Navigation.openConfirmDialog({ title, text, confirmButtonLabel: confirmLabel, cancelButtonLabel: "Cancel" });
                    return !!(r && r.confirmed);
                } catch (e) {
                    return window.confirm(text);
                }
            }

            /**
             * Reject button (one charge, Steps 1-3): after confirmation, re-checks that the history is still open,
             * then saves it as Rejected (Send Notification = No) and completes its CPI schedule in one changeset
             * (see buildRejectRequests), and closes the dialog. No recurring charge is touched.
             */
            async function reject() {
                const picked = getPicked();
                if (state.busy || state.done || !picked) return;
                const ok = await confirmDialog(
                    "Reject CPI increase",
                    "Reject " + hname(picked) + "? No recurring charge will be created and the current rent stays as it is." +
                    (picked._array_cpiadjustmentschedule_value ? " Its CPI schedule is set to Inactive (Completed)." : ""),
                    "Reject"
                );
                if (!ok) return;

                state.busy = true;
                state.error = null;
                renderFooter();
                showOverlay("Rejecting...");
                try {
                    // Re-check right before writing: someone else may have acted in the meantime
                    const fresh = await state.xrm.WebApi.retrieveRecord("array_cpiadjustmenthistory", hid(picked), "?$select=array_approvalstatus,statecode");
                    if (!isSelectable(fresh)) {
                        const label = (STATUS_INFO[fresh.array_approvalstatus] || { label: "changed" }).label;
                        throw new Error("This adjustment is now " + label + ". Close and reopen to see the latest status.");
                    }
                    await executeChangeset(buildRejectRequests(picked));
                    state.done = { kind: "rejected" };
                } catch (e) {
                    state.error = e.uncertain ? e.message : "Reject failed: " + (e.message || String(e)) + " Nothing was saved.";
                } finally {
                    state.busy = false;
                    hideOverlay();
                    render();
                }
                if (state.done) closeDialog();
            }

            /**
             * Closes the dialog.
             * Dynamics exposes no supported close API to a web resource opened with navigateTo. Clicking the
             * dialog's own close button is a widely used (unsupported) workaround; window.close() is the fallback.
             */
            function closeDialog() {
                try {
                    const btn = window.parent && window.parent.document.querySelector('button[data-id="dialogCloseIconButton"]');
                    if (btn) {
                        btn.click();
                        return;
                    }
                } catch (e) {
                    /* ignore */
                }
                window.close();
            }

            /* =====================================================================
               14. RESULT
               ===================================================================== */

            /** Result card after Approve (new charge, amounts, start date) or Reject - one charge. */
            function renderDone() {
                if (state.done.kind === "rejected") {
                    return '<div class="card result ok"><div class="result-title">' + icon("check") + "Rejected</div><p>The increase was rejected. No recurring charge was created.</p></div>";
                }
                const d = state.done,
                    sch = d.sch;
                return (
                    '<div class="card result ok"><div class="result-title">' + icon("check") + "Approved</div>" +
                    "<p>New recurring charge created. The previous charge stops billing after <strong>" + showDate(sch.oldEnd) + "</strong>.</p>" +
                    '<div class="kv">' +
                    (d.newRcId ? kv("New recurring charge", rcLink(d.newRcId, "Open new charge")) : "") +
                    kv("Old rent", '<span class="amt-old">' + money(d.previous) + "</span>") +
                    kv("New rent", '<span class="amt-new big">' + money(d.amount) + "</span>") +
                    kv("New rent starts", showDate(sch.newStart)) +
                    (d.additional > 0 ? kv("Extra amount included", money(d.additional)) : "") +
                    (sch.missed
                        ? kv(
                            "Missed-period charge",
                            "<strong>" + money(d.oneTimeAmount) + "</strong> for " + range(sch.missed.from, sch.missed.to) +
                            (d.oneTimeId ? '<span class="dot"></span>' + rcLink(d.oneTimeId, "Open missed-period charge") : "")
                        )
                        : "") +
                    kv("Older increases closed as Missed", String(d.missedCount)) +
                    kv("Send notification", d.notify ? "Yes" : "No") +
                    "</div></div>"
                );
            }

            /** One row of the bulk result table: what happened to charge ch. */
            function resultRowHtml(ch) {
                const d = ch.done,
                    approved = !!d && d.kind === "approved",
                    p = ch.histories.find((h) => hid(h) === ch.pickedId);
                const outcome = ch.loadError
                    ? { label: "Couldn't load", cls: "rejected" }
                    : d
                        ? STATUS_INFO[approved ? STATUS.APPROVED : STATUS.REJECTED]
                        : { label: "Skipped", cls: "untouched" };
                return (
                    "<tr>" +
                    "<td>" + (ch.rcId ? rcLink(ch.rcId, ch.chargeName) : esc(ch.chargeName)) + '<div class="charge-meta hfs">' + chargeIdsHtml(ch) + "</div></td>" +
                    "<td>" + esc(p ? hname(p) : TXT.EMPTY) + "</td>" +
                    '<td><span class="badge ' + outcome.cls + '">' + esc(outcome.label) + "</span>" +
                    (approved ? '<span class="sum-sub">Send notification: ' + (d.notify ? "Yes" : "No") + "</span>" : "") +
                    "</td>" +
                    '<td class="num"><span class="amt-old">' + money(approved ? d.previous : null, ch.symbol) + "</span></td>" +
                    '<td class="num"><span class="amt-new">' + money(approved ? d.amount : null, ch.symbol) + "</span>" +
                    (approved && d.sch.missed ? '<span class="sum-sub">+ missed period ' + money(d.oneTimeAmount, ch.symbol) + "</span>" : "") +
                    "</td>" +
                    "<td>" + (approved ? showDate(d.sch.newStart) : TXT.EMPTY) + "</td>" +
                    "<td>" +
                    (approved && d.newRcId ? rcLink(d.newRcId, "Open new charge") : TXT.EMPTY) +
                    (approved && d.oneTimeId ? '<span class="sum-sub">' + rcLink(d.oneTimeId, "Open missed-period charge") + "</span>" : "") +
                    "</td>" +
                    "</tr>"
                );
            }

            /** Bulk result: totals and the outcome of every charge, grouped by lease agreement. */
            function renderBulkDone() {
                const n = state.bulkDone;
                let lease = null;
                const rows = state.charges
                    .map((ch) => {
                        let head = "";
                        if (ch.leaseId !== lease) {
                            lease = ch.leaseId;
                            head = '<tr class="grp"><td colspan="7"><div class="hfs">' + leaseFieldsHtml(ch) + "</div></td></tr>";
                        }
                        return head + resultRowHtml(ch);
                    })
                    .join("");
                return (
                    '<div class="card result ok"><div class="result-title">' + icon("check") + "Saved</div>" +
                    "<p>" + plural(n.approve, "charge") + " approved" +
                    '<span class="dot"></span>' + plural(n.reject, "charge") + " rejected" +
                    '<span class="dot"></span>' + plural(n.skip, "charge") + " skipped. Everything was saved in one transaction.</p></div>" +
                    '<div class="card flush"><div class="tbl-wrap"><table class="tbl">' +
                    "<thead><tr><th>Recurring charge</th><th>Adjustment</th><th>Outcome</th>" +
                    '<th class="num">Old rent</th><th class="num">New rent</th><th>New rent starts</th><th>New charge</th></tr></thead>' +
                    "<tbody>" + rows + "</tbody></table></div></div>"
                );
            }

            /* =====================================================================
               15. EVENTS & START-UP
               In bulk, an event inside a charge card ([data-charge]) is handled with that charge
               loaded into `state` (withCharge), so the same handlers serve both modes.
               ===================================================================== */

            /**
             * Click inside the content of the charge in `state`: Step 1 rows, Step 2 options and links (index
             * popup, effective date, recommended missed-period amount, extra amount, split reset). Returns true
             * when the page must be redrawn.
             */
            function onWizardClick(e) {
                // Element with this data-act that was clicked (or contains the clicked element), or null
                const act = (name) => e.target.closest('[data-act="' + name + '"]');

                // Step 2: the new index button or the old index "Change" link opens the index editor popup
                const edit = act("idxEdit");
                if (edit && state.cpi) {
                    openIndexEditor(edit.getAttribute("data-field"));
                    return true;
                }

                // Step 2 (saved increase): "Undo changes" puts back the saved index values and effective date
                if (act("cpiUndo") && state.cpi) {
                    undoCpiChanges();
                    return true;
                }

                // Step 2: "Change" / "Done" next to the effective date opens / closes the date box
                if (act("effEdit") && state.cpi) {
                    state.cpi.effOpen = true;
                    state.focusAfter = fid("cpiEff");
                    return true;
                }
                if (act("effDone") && state.cpi) {
                    state.cpi.effOpen = false;
                    return true;
                }

                // Step 2: "Add an extra amount to the rent" opens the extra amount box
                if (act("extraOpen")) {
                    state.extraOpen = true;
                    state.focusAfter = fid("addl");
                    return true;
                }

                // Step 2: "Add its <amount> to the new rent" puts the never-applied increase into the extra amount
                const use = act("usePrev");
                if (use) {
                    state.additionalRaw = use.getAttribute("data-amount");
                    state.additional = parseAdditional(state.additionalRaw);
                    state.extraOpen = true;
                    syncOneTime(); // the recommended missed-period amount follows the new rent
                    return true;
                }

                // Step 2: reset the split editor
                if (act("splitReset") && getOption("split")) {
                    state.split = initSplit(getOption("split").defaultStart);
                    return true;
                }

                // Step 2: "Use recommended" missed-period amount (follows the new rent again)
                const rec = act("useRec");
                if (rec) {
                    const input = $(fid("oneTime"));
                    input.value = rec.getAttribute("data-amount");
                    onOneTimeInput(input.value);
                    state.oneTimeTouched = false;
                    return false;
                }

                // Editing inside the split panel or the missed-period box, not re-selecting an option
                if (e.target.closest(".split-box") || e.target.closest(".ot-box")) return false;

                // Step 2: choose a start option
                const opt = e.target.closest(".opt[data-mode]");
                if (opt && state.step === 2) {
                    const mode = opt.getAttribute("data-mode");
                    if (mode === state.startMode) return false;
                    state.startMode = mode;
                    return true;
                }

                // Step 1: pick a history row
                const row = e.target.closest("tr.selectable");
                if (row && state.step === 1) {
                    const id = row.getAttribute("data-id");
                    if (id !== state.pickedId) {
                        // Bulk: picking an increase on a charge that had none picked sets it to "To approve"
                        if (isBulk() && !state.pickedId && state.decision === "skip" && !state.blocker) state.decision = "approve";
                        pick(id);
                    }
                    return true;
                }
                return false;
            }

            /** Index of the bulk charge card an element is in, or -1 (one charge, or outside any card). */
            function chargeIndexOf(el) {
                const card = isBulk() ? el.closest("[data-charge]") : null;
                return card ? +card.getAttribute("data-charge") : -1;
            }

            /** Focusable controls of the open popup, in tab order (used to keep Tab inside it). */
            function popupFocusables() {
                return Array.from($("modal").querySelectorAll("button:not(:disabled), input:not(:disabled)")).filter(
                    (el) => !(el.type === "radio" && !el.checked && el.closest(".pick-list").querySelector("input:checked"))
                );
            }

            // Clicks inside the content area
            $("content").addEventListener("click", (e) => {
                if (e.target.closest("a")) return; // links open in a new tab; don't select the row
                if (state.busy || state.done || state.bulkDone || state.fatal || state.indexEditor) return;

                let redraw;
                const i = chargeIndexOf(e.target);
                if (i >= 0) {
                    redraw = withCharge(i, () => onWizardClick(e));
                } else if (isBulk()) {
                    // Bulk Step 2: "Add the never-applied increase ... on all charges"
                    redraw = !!e.target.closest('[data-act="useAllPrev"]');
                    if (redraw) useAllOutstanding();
                } else {
                    redraw = onWizardClick(e);
                }
                if (redraw) render();
            });

            // Step 2: extra amount or missed-period amount typed
            $("content").addEventListener("input", (e) => {
                const f = fieldOf(e.target);
                const handler = f === "addl" ? onAdditionalInput : f === "oneTime" ? onOneTimeInput : null;
                if (!handler) return;
                const i = chargeIndexOf(e.target);
                if (i >= 0) withCharge(i, () => handler(e.target.value));
                else handler(e.target.value);
            });

            // Step 1 (bulk): decision selector. Step 2: "Charge the missed period" and lease limit tick boxes,
            // effective date, split editor dates and proration checkboxes. Step 3: "Send notification email" tick boxes.
            $("content").addEventListener("change", (e) => {
                if (state.busy) return;
                const i = chargeIndexOf(e.target);
                if (i >= 0 && e.target.getAttribute("data-f") === "decision") {
                    state.charges[i].decision = e.target.value;
                    render();
                    return;
                }
                // Step 3 (bulk): "tick all" sets every charge set to To approve
                if (e.target.id === "notifyAll") {
                    state.charges.forEach((ch) => {
                        if (!ch.loadError && ch.decision === "approve") ch.notify = e.target.checked;
                    });
                    render();
                    return;
                }
                // Step 3: one charge's "Send notification email" tick box
                if (fieldOf(e.target) === "notify") {
                    if (i >= 0) state.charges[i].notify = e.target.checked;
                    else state.notify = e.target.checked;
                    render();
                    return;
                }
                // Step 2: "Charge the missed period" tick box
                const f = fieldOf(e.target);
                if (f === "missedOn") {
                    // Ticks / unticks the missed-period charge on the charge in `state`
                    const apply = () => {
                        state.missedOn = e.target.checked;
                        syncOneTime();
                    };
                    if (i >= 0) withCharge(i, apply);
                    else apply();
                    render();
                    return;
                }
                // Step 2: "Apply the lease minimum / maximum" tick box
                if (f === "limitsOn") {
                    // Applies / removes the lease floor / cap on the charge in `state`; the recommended missed-period amount follows the rent
                    const apply = () => {
                        state.limitsOn = e.target.checked;
                        syncOneTime();
                    };
                    if (i >= 0) withCharge(i, apply);
                    else apply();
                    render();
                    return;
                }
                // Step 2: effective date changed (the box keeps focus after the redraw)
                if (f === "cpiEff") {
                    // Applies the new effective date to the charge in `state`
                    const apply = () => {
                        onCpiEffChange(e.target.value);
                        state.focusAfter = fid("cpiEff");
                    };
                    if (i >= 0) withCharge(i, apply);
                    else apply();
                    render();
                    return;
                }
                const handled = i >= 0 ? withCharge(i, () => onSplitChange(fieldOf(e.target), e.target)) : onSplitChange(fieldOf(e.target), e.target);
                if (handled) render();
            });

            // "Show details" and bulk Confirm rows: remember which are open, so a re-render keeps them open.
            // (toggle does not bubble, so listen in the capture phase)
            $("content").addEventListener(
                "toggle",
                (e) => {
                    const key = e.target.getAttribute && e.target.getAttribute("data-key");
                    if (!key) return;
                    if (e.target.open) state.openKeys.add(key);
                    else state.openKeys.delete(key);
                },
                true
            );

            // Index editor popup: tabs, Apply, Cancel / close button / backdrop
            $("modal").addEventListener("click", (e) => {
                const ed = state.indexEditor,
                    act = e.target.closest("[data-act]");
                if (!ed || !act) return;
                const a = act.getAttribute("data-act");
                if (a === "idxCancel") {
                    closeIndexEditor();
                } else if (a === "idxApply") {
                    applyIndexEditor();
                } else if (a === "idxTab") {
                    const tab = act.getAttribute("data-tab");
                    if (tab === ed.tab) return;
                    ed.tab = tab;
                    ed.tried = false;
                    ed.focus = true;
                    renderIndexEditor();
                }
            });

            // Index editor popup: a CPI index picked in the list (mouse or arrow keys)
            $("modal").addEventListener("change", (e) => {
                const ed = state.indexEditor;
                if (!ed || e.target.name !== "idxPick") return;
                ed.pickId = e.target.value;
                syncIndexEditor();
            });

            // Index editor popup: the manual value typed
            $("modal").addEventListener("input", (e) => {
                const ed = state.indexEditor;
                if (!ed || e.target.id !== "idxRaw") return;
                ed.raw = e.target.value;
                ed.tried = false;
                syncIndexEditor();
            });

            // Index editor popup: double-clicking a CPI index applies it straight away
            $("modal").addEventListener("dblclick", (e) => {
                if (state.indexEditor && e.target.closest(".pick-row")) applyIndexEditor();
            });

            // Index editor popup keyboard: Escape closes, Enter applies, Tab stays inside the popup
            document.addEventListener("keydown", (e) => {
                if (!state.indexEditor) return;
                if (e.key === "Escape") {
                    e.preventDefault();
                    e.stopPropagation();
                    closeIndexEditor();
                } else if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))) {
                    e.preventDefault();
                    applyIndexEditor();
                } else if (e.key === "Tab") {
                    const items = popupFocusables();
                    if (!items.length) return;
                    const first = items[0],
                        last = items[items.length - 1];
                    if (e.shiftKey && (document.activeElement === first || !$("modal").contains(document.activeElement))) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && (document.activeElement === last || !$("modal").contains(document.activeElement))) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            });

            // Footer: Next (Steps 1-2), Approve (Step 3) - or Approve all in bulk
            $("btnNext").addEventListener("click", () => {
                if (state.busy) return;
                if (isBulk()) {
                    if (state.bulkDone || bulkIssues(state.bulkStep).length) return;
                    if (state.bulkStep < 3) goBulkStep(state.bulkStep + 1);
                    else approveAll();
                    return;
                }
                if (!canAdvance()) return;
                if (state.step < 3) {
                    state.step++;
                    state.error = null;
                    render();
                    $("content").scrollTop = 0;
                } else {
                    approve();
                }
            });

            // Footer: Back one step
            $("btnBack").addEventListener("click", () => {
                if (state.busy) return;
                if (isBulk()) {
                    if (state.bulkStep > 1 && !state.bulkDone) goBulkStep(state.bulkStep - 1);
                    return;
                }
                if (state.step === 1) return;
                state.step--;
                state.error = null;
                render();
            });

            // Footer: Reject (one charge), Cancel / Close
            $("btnReject").addEventListener("click", reject);
            $("btnCancel").addEventListener("click", () => {
                if (!state.busy) closeDialog();
            });

            // Start-up
            load();
        })();
    </script>
</body>

</html>
