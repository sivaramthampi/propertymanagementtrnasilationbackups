            /* =====================================================================
               3. UTILITIES & ICONS - text, icons, money and dates
               ===================================================================== */

            // Typographic characters, built from their character codes so this file stays plain ASCII
            // (a pasted character or a "\u" escape can be turned into garbled text by editors and upload tools)
            const TXT = {
                EMPTY: String.fromCharCode(0x2014), // em dash, shown for an empty value
                DASH: " " + String.fromCharCode(0x2014) + " ", // em dash between two parts of a sentence
                RANGE: " " + String.fromCharCode(0x2013) + " ", // en dash between the two dates of a range
                TIMES: String.fromCharCode(0x00d7) // multiplication sign in calculations
            };

            /**
             * Inline SVG icons (16 x 16, drawn with the text colour). SVG is used instead of symbol characters
             * or emoji, which Dataverse can show as garbled text or as coloured emoji depending on the file
             * encoding and the device.
             */
            const ICONS = {
                check: '<path d="M3.2 8.4l3.1 3.1 6.5-6.8" />',
                warn: '<path d="M8 2.2l6.6 11.3H1.4z" /><path d="M8 6.4v3.4" /><path d="M8 11.7v.1" />',
                error: '<circle cx="8" cy="8" r="6.2" /><path d="M5.9 5.9l4.2 4.2M10.1 5.9l-4.2 4.2" />',
                info: '<circle cx="8" cy="8" r="6.2" /><path d="M8 7.3v3.9" /><path d="M8 4.9v.1" />',
                dot: '<circle cx="8" cy="8" r="2" fill="currentColor" stroke="none" />',
                arrowRight: '<path d="M2.8 8h10.4M9.2 4l4 4-4 4" />',
                arrowLeft: '<path d="M13.2 8H2.8M6.8 4l-4 4 4 4" />',
                chevronRight: '<path d="M6 3.5L10.5 8 6 12.5" />',
                edit: '<path d="M11.2 2.3a1.6 1.6 0 0 1 2.3 2.3L5.6 12.5l-3.1 1 1-3.1z" /><path d="M10 3.5L12.5 6" />',
                close: '<path d="M4 4l8 8M12 4l-8 8" />',
                list: '<path d="M6 4.5h7.5M6 8h7.5M6 11.5h7.5" /><path d="M2.6 4.5v.1M2.6 8v.1M2.6 11.5v.1" />'
            };

            /**
             * Returns an icon as inline SVG (HTML). Decorative: hidden from screen readers.
             * @param {string} name key of ICONS
             * @param {string} [cls] extra class, e.g. "sm" for a small icon
             */
            function icon(name, cls) {
                return (
                    '<svg class="ico' + (cls ? " " + cls : "") + '" viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"' +
                    ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || "") + "</svg>"
                );
            }

            /** HTML-escapes a value for safe use in innerHTML. */
            function esc(s) {
                return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
            }

            /** Rounds to 2 decimals (currency). */
            function round2(n) {
                return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
            }

            /**
             * Formats an amount as plain text, e.g. "EUR 1,030.00" (for textContent / title attributes).
             * @param {number} v   amount; null/empty shows a dash
             * @param {string} [sym] currency symbol; defaults to the currency of the charge in `state`
             */
            function moneyText(v, sym) {
                if (v === null || v === undefined || v === "" || isNaN(v)) return TXT.EMPTY;
                const n = Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                if (sym === undefined) sym = state.symbol;
                return sym ? sym + (sym.length > 1 ? " " : "") + n : n;
            }

            /** Same as moneyText, HTML-escaped (for innerHTML). */
            function money(v, sym) {
                return esc(moneyText(v, sym));
            }

            /** Formats a percentage, e.g. "3.5%", HTML-escaped. */
            function pct(v) {
                if (v === null || v === undefined || isNaN(v)) return TXT.EMPTY;
                return esc(Number(v).toLocaleString(undefined, { maximumFractionDigits: 4 }) + "%");
            }

            /** Formats an index value as plain text, e.g. "104.25" (a dash when empty). */
            function numText(v) {
                if (v === null || v === undefined || isNaN(v)) return TXT.EMPTY;
                return Number(v).toLocaleString(undefined, { maximumFractionDigits: 4 });
            }

            /** "1 recurring charge" / "3 recurring charges". */
            function plural(n, word) {
                return n + " " + word + (n === 1 ? "" : "s");
            }

            /** Random GUID (used for $batch boundaries). */
            function uuid() {
                if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
                return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
                    const r = (Math.random() * 16) | 0;
                    return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
                });
            }

            /* ---------- Dates (calendar dates held as UTC midnight) ---------- */

            /** Parses a Dataverse date value into a calendar date (UTC midnight); null if empty/invalid. */
            function parseDate(v) {
                if (!v) return null;
                const s = String(v);
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
                if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); // Date Only column
                const d = new Date(s);
                if (isNaN(d)) return null;
                return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); // User Local column -> user's calendar date
            }

            /** Date plus n days (n may be negative). */
            function addDays(d, n) {
                return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + n));
            }

            /** Number of days in month m (0-11) of year y. */
            function daysInMonth(y, m) {
                return new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
            }

            /** Month-safe add: Jan 31 + 1 month -> Feb 28/29. */
            function addMonthsSafely(d, n) {
                const total = d.getUTCMonth() + n;
                const y = d.getUTCFullYear() + Math.floor(total / 12);
                const m = ((total % 12) + 12) % 12;
                return new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), daysInMonth(y, m))));
            }

            /** Date plus one billing period of the given FREQ entry. */
            function addPeriod(d, freq) {
                return freq.add.unit === "month" ? addMonthsSafely(d, freq.add.n) : addDays(d, freq.add.n);
            }

            /** Date minus one billing period of the given FREQ entry. */
            function subtractPeriod(d, freq) {
                return freq.add.unit === "month" ? addMonthsSafely(d, -freq.add.n) : addDays(d, -freq.add.n);
            }

            /** Today's calendar date (UTC midnight, like the other dates). */
            function todayDate() {
                const n = new Date();
                return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
            }

            /** Date as "YYYY-MM-DD" (format Dataverse expects for Date Only columns). */
            function isoDate(d) {
                // Two-digit month / day
                const p = (n) => String(n).padStart(2, "0");
                return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
            }

            /** isoDate, or "" when there is no date (for <input type="date"> values). */
            function isoOrEmpty(d) {
                return d ? isoDate(d) : "";
            }

            /**
             * Re-anchors a date to a fixed day of the month, trimming for short months.
             * Stops drift: 31 Jan -> 28 Feb -> 31 Mar, not 28 Feb -> 28 Mar.
             */
            function onDay(d, day) {
                if (!d || day == null) return d;
                const y = d.getUTCFullYear(),
                    m = d.getUTCMonth();
                return new Date(Date.UTC(y, m, Math.min(day, daysInMonth(y, m))));
            }

            /** Display text for a date, e.g. "01 Oct 2026" (a dash when empty). */
            function dateText(d) {
                if (!d) return TXT.EMPTY;
                return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
            }

            /** Month of a date, e.g. "Sep 2026" (a dash when empty) - the period of a CPI index. */
            function monthText(d) {
                if (!d) return TXT.EMPTY;
                return d.toLocaleDateString(undefined, { month: "short", year: "numeric", timeZone: "UTC" });
            }

            /** dateText, HTML-escaped. */
            function showDate(d) {
                return esc(dateText(d));
            }

            /** Parses a raw Dataverse date value and returns it as escaped display text. */
            function fmtDate(v) {
                return showDate(parseDate(v));
            }

            /** Date range as HTML, e.g. "01 Oct 2026 - 31 Oct 2026" (with an en dash). */
            function range(a, b) {
                return showDate(a) + TXT.RANGE + showDate(b);
            }

            /** Whole days from a to b. */
            function daysBetween(a, b) {
                return Math.round((b - a) / 86400000);
            }

            /* =====================================================================
               4. DATAVERSE ACCESS - Xrm, launch ids, links, queries, $batch
               ===================================================================== */

            /** Returns the Dynamics client API from the hosting window (dialog parent), or null. */
            function getXrm() {
                try {
                    if (window.parent && window.parent.Xrm && window.parent.Xrm.WebApi) return window.parent.Xrm;
                } catch (e) {
                    /* cross-frame access denied - fall through */
                }
                return window.Xrm && window.Xrm.WebApi ? window.Xrm : null;
            }

            /* =====================================================================
               BATCH INVOICE GENERATION TRIGGER
               Called once per approval save (single or bulk), AFTER the $batch has
               committed. POSTs an empty body to the "Batch Invoice Draft Recurring
               Charges" HTTP wrapper flow, which invokes the system-wide child flow
               that discovers today's charges and groups them by (Lease x InvoiceType),
               producing one invoice per group instead of one invoice per charge via
               the webhook flow.

               This runs BEFORE the locked webhook flow's 30-second debounce elapses,
               so when that flow queries for today's charges after its delay, the
               dates have already been advanced and the webhook flow finds no work.

               Setup: Dataverse environment variable with schema name
               'array_BatchInvoiceDraftRecurringChargesFlowURL' set to the HTTP POST
               URL of the wrapper flow trigger (shared with Lease Creation, Amendment,
               and Termination widgets - same env var, same URL).

               Errors here are logged but NEVER thrown - a failure here must not fail
               the approval. If this call fails, the locked webhook flow still runs
               as a fallback (producing the pre-fix multi-invoice behaviour).
               ===================================================================== */
            const BATCH_INVOICE_FLOW_ENV_VAR = "array_BatchInvoiceDraftRecurringChargesFlowURL";

            /**
             * Fetch an environment variable's current value (falling back to its
             * default) by schema name. Returns the trimmed string value, or null if
             * not configured. Uses state.xrm.WebApi to match the rest of this file.
             */
            async function getEnvVarText(schemaName) {
                try {
                    const r = await state.xrm.WebApi.retrieveMultipleRecords(
                        "environmentvariabledefinition",
                        "?$select=environmentvariabledefinitionid,schemaname,defaultvalue"
                        + "&$filter=schemaname eq '" + schemaName + "'"
                        + "&$expand=environmentvariablevalues($select=value)"
                    );
                    const def = r.entities && r.entities[0];
                    if (!def) return null;
                    const values = def.environmentvariablevalues;
                    if (values && values.length > 0 && values[0].value) {
                        return String(values[0].value).trim();
                    }
                    return def.defaultvalue ? String(def.defaultvalue).trim() : null;
                } catch (e) {
                    console.warn("[CPI] getEnvVarText error for", schemaName, e);
                    return null;
                }
            }

            /**
             * Fire the batch invoice generation flow. Fire-and-log: never throws, so a
             * flow failure cannot fail the approval save. The webhook flow remains the
             * fallback for correctness.
             */
            async function triggerBatchInvoiceGeneration() {
                try {
                    const flowUrl = await getEnvVarText(BATCH_INVOICE_FLOW_ENV_VAR);
                    if (!flowUrl) {
                        console.warn("[CPI] Batch invoice flow URL not configured in env var '"
                            + BATCH_INVOICE_FLOW_ENV_VAR + "' - webhook flow will act as fallback");
                        return;
                    }
                    const response = await fetch(flowUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: "{}"
                    });
                    if (!response.ok) {
                        const bodyText = await response.text().catch(() => "");
                        throw new Error("Batch invoice flow returned HTTP " + response.status
                            + ": " + bodyText.slice(0, 200));
                    }
                    console.log("[CPI] Batch invoice generation triggered successfully");
                } catch (err) {
                    // Fire-and-log: NEVER rethrow. Webhook flow is the fallback.
                    console.warn("[CPI] Batch invoice generation call failed - webhook flow will act as fallback:", err);
                }
            }

            /**
             * History ids passed by the launcher (lower-case, no duplicates).
             * navigateTo passes "data" as id=<guid>, ids=<guid>,<guid>,... or sel=<token>
             * (a large selection handed over through sessionStorage). ?id=<guid> also works.
             * @returns {string[]}
             */
            function getLaunchIds() {
                const qs = new URLSearchParams(window.location.search);
                for (const raw of [qs.get("id"), qs.get("data")]) {
                    if (!raw) continue;
                    let v = raw;
                    try {
                        v = decodeURIComponent(raw);
                    } catch (e) {
                        /* already decoded */
                    }
                    const sel = /(?:^|&)sel=([0-9a-z]+)/i.exec(v);
                    const ids = sel ? readHandoff(sel[1]) : v.match(GUID_RE) || [];
                    if (ids.length) return Array.from(new Set(ids.map((id) => id.toLowerCase())));
                }
                return [];
            }

            /**
             * Reads a large selection the launcher stored in sessionStorage.
             * The token must match, so a stale selection from an earlier launch is never used.
             * @throws when the hand-off is missing or does not match
             */
            function readHandoff(token) {
                let h = null;
                try {
                    h = JSON.parse(window.sessionStorage.getItem(SELECTION_KEY));
                } catch (e) {
                    /* storage blocked or unreadable */
                }
                if (!h || h.token !== token || !Array.isArray(h.ids)) {
                    throw new Error("The selected records could not be read. Close this dialog and launch it again from the view.");
                }
                return h.ids.join(",").match(GUID_RE) || [];
            }

            /** Record URL in the current app, for links that open in a new tab. */
            function recordUrl(entity, id) {
                let base;
                try {
                    base = state.xrm.Utility.getGlobalContext().getCurrentAppUrl();
                } catch (e) {
                    base = state.clientUrl + "/main.aspx";
                }
                return base + (base.indexOf("?") >= 0 ? "&" : "?") + "pagetype=entityrecord&etn=" + entity + "&id=" + id;
            }

            /** Link (HTML) that opens a recurring charge in a new tab; a dash when there is no id. */
            function rcLink(id, name) {
                if (!id) return TXT.EMPTY;
                return (
                    '<a class="rc-link" href="' + esc(recordUrl("array_recurringcharge", id)) + '" target="_blank" rel="noopener noreferrer">' +
                    esc(name || "Open recurring charge") + "</a>"
                );
            }

            /** Formatted (display) value of a lookup, e.g. fv(rc, "array_leaseagreement") -> lease name. */
            const fv = (rec, attr) => (rec ? rec["_" + attr + "_value" + FV] || "" : "");

            // Currency symbol per currency id, fetched once (selected charges usually share one or two currencies)
            const symbolCache = {};

            /** Currency symbol for a transactioncurrency id ("" when unknown). Cached. */
            function getCurrencySymbol(currencyId) {
                if (!currencyId) return Promise.resolve("");
                if (!symbolCache[currencyId]) {
                    symbolCache[currencyId] = state.xrm.WebApi.retrieveRecord("transactioncurrency", currencyId, "?$select=currencysymbol").then(
                        (c) => c.currencysymbol || "",
                        () => ""
                    );
                }
                return symbolCache[currencyId];
            }

            /**
             * Retrieves rows whose `attr` equals any of `ids`, one query per ID_CHUNK ids.
             * @param {string} entity  logical name
             * @param {string} select  $select list
             * @param {string} attr    column compared with the ids
             * @param {string[]} ids
             * @param {string} [suffix] appended after the id filter: " and ..." clauses and/or "&$orderby=..."
             * @returns {Promise<object[]>} rows of all chunks, in chunk order
             */
            async function retrieveByIds(entity, select, attr, ids, suffix) {
                const rows = [];
                for (let i = 0; i < ids.length; i += ID_CHUNK) {
                    const anyOf = ids.slice(i, i + ID_CHUNK).map((id) => attr + " eq " + id).join(" or ");
                    const r = await state.xrm.WebApi.retrieveMultipleRecords(entity, "?$select=" + select + "&$filter=(" + anyOf + ")" + (suffix || ""));
                    rows.push(...r.entities);
                }
                return rows;
            }

            /**
             * Active charge already amended from this one, or null.
             * Found = another approval already replaced this charge (re-checked just before approving).
             */
            async function findActiveAmendment(rcId) {
                const r = await state.xrm.WebApi.retrieveMultipleRecords(
                    "array_recurringcharge",
                    "?$select=array_recurringchargeid,array_chargename" +
                    "&$filter=_array_amendedfromcharge_value eq " + rcId + " and statecode eq " + RC_ACTIVE_STATECODE +
                    "&$top=1"
                );
                return r.entities[0] || null;
            }

            /* ---------- $batch (single atomic changeset) ---------- */

            /**
             * Splits a $batch response into its parts.
             * @returns {{status:number, contentId:string|null, entityId:string|null, message:string|null}[]}
             */
            function parseBatchResponse(text) {
                return text
                    .split(/--(?:batchresponse|changesetresponse)_[0-9a-zA-Z-]+(?:--)?/)
                    .map((part) => {
                        const status = /HTTP\/1\.1 (\d{3})/.exec(part);
                        if (!status) return null;
                        const cid = /Content-ID:\s*(\S+)/i.exec(part);
                        const entity = /OData-EntityId:\s*\S*\(([0-9a-fA-F-]{36})\)/i.exec(part);
                        let message = null;
                        const jsonStart = part.indexOf("{");
                        if (jsonStart >= 0) {
                            try {
                                const j = JSON.parse(part.slice(jsonStart).trim());
                                message = j.error && j.error.message;
                            } catch (e) {
                                /* not JSON */
                            }
                        }
                        return { status: +status[1], contentId: cid ? cid[1] : null, entityId: entity ? entity[1] : null, message };
                    })
                    .filter(Boolean);
            }

            /**
             * Sends all requests in ONE changeset: either every request is saved or none is.
             * @param {{label:string, method:string, path:string, body?:object}[]} requests
             *        Content-IDs are 1..n, so "$3" in a body refers to the record created by the third request.
             *        A request without a body (DELETE) is sent without one.
             * @returns {Promise<Object<string,string>>} ids of the created records by Content-ID ("1", "2", ...)
             * @throws Error with .step = label of the failing request, or .uncertain = true when the
             *         server could not be reached (the outcome is unknown)
             */
            async function executeChangeset(requests) {
                const base = state.clientUrl + "/api/data/" + API_VERSION + "/";
                const batchId = "batch_" + uuid();
                const csId = "changeset_" + uuid();
                let body = "--" + batchId + "\r\nContent-Type: multipart/mixed; boundary=" + csId + "\r\n\r\n";
                requests.forEach((r, i) => {
                    body +=
                        "--" + csId + "\r\n" +
                        "Content-Type: application/http\r\n" +
                        "Content-Transfer-Encoding: binary\r\n" +
                        "Content-ID: " + (i + 1) + "\r\n\r\n" +
                        r.method + " " + base + r.path + " HTTP/1.1\r\n" +
                        (r.body ? "Content-Type: application/json; type=entry\r\n" : "") +
                        (r.method === "PATCH" ? "If-Match: *\r\n" : "") + // update only, never upsert
                        "\r\n" +
                        (r.body ? JSON.stringify(r.body) : "") + "\r\n";
                });
                body += "--" + csId + "--\r\n--" + batchId + "--\r\n";

                let res, text;
                try {
                    res = await fetch(base + "$batch", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "multipart/mixed; boundary=" + batchId,
                            Accept: "application/json",
                            "OData-MaxVersion": "4.0",
                            "OData-Version": "4.0"
                        },
                        body: body
                    });
                    text = await res.text();
                } catch (e) {
                    const err = new Error("The server could not be reached (" + e.message + "). The changes may or may not have been saved. Refresh and check before retrying.");
                    err.uncertain = true;
                    throw err;
                }

                const parts = parseBatchResponse(text);
                const failed = parts.find((p) => p.status >= 400);
                if (!res.ok || failed) {
                    let message = failed && failed.message;
                    if (!message) {
                        try {
                            message = JSON.parse(text).error.message;
                        } catch (e) {
                            message = "HTTP " + res.status;
                        }
                    }
                    const err = new Error(message);
                    const req = failed && failed.contentId ? requests[+failed.contentId - 1] : null;
                    err.step = req ? req.label : null;
                    throw err;
                }
                const created = {};
                parts.forEach((p) => {
                    if (p.contentId && p.entityId) created[p.contentId] = p.entityId;
                });
                if (!created["1"] && parts[0] && parts[0].entityId) created["1"] = parts[0].entityId; // response without Content-IDs
                return created;
            }

            /* =====================================================================
               5. BUSINESS RULES - history, amounts and billing cycle (used by all steps)
               All of these work on the charge in `state`.
               ===================================================================== */

            /** Id of a history record. */
            const hid = (h) => h.array_cpiadjustmenthistoryid;

            /** Display name of a history record (its Adjustment ID). */
            const hname = (h) => h.array_adjustmentid || "(no adjustment ID)";

            /** Only ACTIVE histories with Approval Status DRAFT can be approved, rejected or marked Missed. */
            const isSelectable = (h) =>
                h.array_approvalstatus === STATUS.DRAFT && (h.statecode === undefined || h.statecode === HISTORY_ACTIVE_STATECODE);

            /** The history picked on Step 1, or null. */
            const getPicked = () => state.histories.find((h) => hid(h) === state.pickedId) || null;

            /** Current amount = the current (old) RC amount, read live. */
            const rcAmount = () => (state.oldRc ? state.oldRc.array_amount : null);

            /** Stored add-on amount of a history: array_increasedamount, else stored new - previous (older records). */
            function storedIncrease(h) {
                if (h.array_increasedamount !== null && h.array_increasedamount !== undefined) return h.array_increasedamount;
                if (h.array_newrent != null && h.array_previousrent != null) return round2(h.array_newrent - h.array_previousrent);
                return null;
            }

            /**
             * CPI-pending: created while the CPI index was not published yet (the CPI run's "CPI Data Pending"
             * branch), so there is no index, add-on or new rent. The approver sets the index on Step 2.
             */
            const isCpiPending = (h) => storedIncrease(h) == null;

            /** The picked history: its index values and effective date come from state.cpi (set / changed on Step 2). */
            const isCpiEntry = (h) => !!state.cpi && hid(h) === state.pickedId;

            /** Add-on amount of a history: calculated on Step 2 when it is worked out there (see cpiRecalculated), else stored. */
            function increase(h) {
                return isCpiEntry(h) && cpiRecalculated() ? cpiAddOn() : storedIncrease(h);
            }

            /** Effective date of a history: from Step 2 for the picked one (stored until changed), else stored. */
            function effDate(h) {
                return isCpiEntry(h) ? state.cpi.eff : parseDate(h.array_adjustmenteffectivefrom);
            }

            /** Index change %: calculated from the Step 2 index values when they are set or changed, else stored. */
            function indexChange(h) {
                return isCpiEntry(h) && cpiIndexEdited() ? cpiChange() : h.array_indexchangepercentage;
            }

            /** Revised amount before any additional amount = RC amount + add-on. */
            function baseNewRent(h) {
                const inc = increase(h),
                    amt = rcAmount();
                return inc == null || amt == null ? null : round2(amt + inc);
            }

            /** CPI Adjustment Schedule of a history (from state.schedules), or null. */
            const scheduleOf = (h) => state.schedules[h._array_cpiadjustmentschedule_value] || null;

            /**
             * Date that places a history among the others of its charge: its schedule's end date, else its
             * Adjustment Effective From, else its Created On (a CPI-pending history has no effective date yet).
             */
            function orderDate(h) {
                const s = scheduleOf(h);
                return (s && parseDate(s[SCHEDULE_END])) || parseDate(h.array_adjustmenteffectivefrom) || parseDate(h.createdon);
            }

            /**
             * Sorts a charge's histories oldest to newest by orderDate, then Created On. This order decides the
             * "Latest" tag and which open histories become Missed (older) or stay unchanged (newer).
             */
            function sortHistories(list) {
                // Date as a sortable number (no date sorts first)
                const t = (d) => (d ? d.getTime() : 0);
                return list.sort((a, b) => t(orderDate(a)) - t(orderDate(b)) || String(a.createdon || "").localeCompare(String(b.createdon || "")));
            }

            /** Position of the picked history in state.histories (oldest first, see sortHistories); -1 if none. */
            function pickedIndex() {
                return state.histories.findIndex((h) => hid(h) === state.pickedId);
            }

            /** Open histories before the picked one - all become Missed when it is approved. */
            function olderSelectable() {
                const i = pickedIndex();
                return i < 0 ? [] : state.histories.slice(0, i).filter(isSelectable);
            }

            /** Open histories after the picked one - left untouched. */
            function newerSelectable() {
                const i = pickedIndex();
                return i < 0 ? [] : state.histories.slice(i + 1).filter(isSelectable);
            }

            /** The nearest older open history - the only one offered as an extra amount on Step 2. */
            function nearestOlder() {
                const older = olderSelectable();
                return older.length ? older[older.length - 1] : null;
            }

            /** Additional amount entered on Step 2 (0 while the input is invalid). */
            function effectiveAdditional() {
                return isNaN(state.additional) ? 0 : state.additional;
            }

            /** New RC amount = history New Rent = RC amount + add-on + additional. */
            function newAmount() {
                const p = getPicked();
                const base = p ? baseNewRent(p) : null;
                return base == null ? null : round2(base + effectiveAdditional());
            }

            /**
             * Billing cycle of the current RC.
             * Frequency Start/End on the RC = the billing cycle that has not been invoiced yet (after each run
             * the engine rolls this window forward), so it is the earliest cycle that can still carry a new rent.
             * @throws when the charge is a One Time Charge, the frequency is not in FREQ, or the cycle dates are missing
             */
            function readCycle(rc) {
                if (rc.array_frequency === ONE_TIME_FREQUENCY) {
                    throw new Error("This is a One Time Charge, so a CPI increase can't be applied to it. You can still reject the increase.");
                }
                const freq = FREQ[rc.array_frequency];
                if (!freq) throw new Error("Frequency value " + rc.array_frequency + " on the current charge is not in the FREQ map. Add it to the constants.");
                const fs = parseDate(rc.array_frequencystartdate),
                    fe = parseDate(rc.array_frequencyenddate);
                if (!fs || !fe) throw new Error("The current charge has no Frequency Start/End Date, so the new charge dates can't be calculated.");
                return {
                    freq,
                    fs,
                    fe,
                    chargeEnd: parseDate(rc.array_enddate),
                    gen: parseDate(rc.array_invoicegenerationdate),
                    upcoming: parseDate(rc.array_upcominginvoicegenerationday),
                    genDay: rc.array_invoicegenerationday != null ? rc.array_invoicegenerationday : null
                };
            }

            /**
             * Next generation date: one frequency period on, re-anchored to the charge's billing day.
             * Mirrors the billing flow's expression - month of (date + period), on min(Invoice Day, days in month).
             */
            function nextGen(d) {
                const c = state.cycle;
                if (!d) return null;
                const n = addPeriod(d, c.freq);
                return c.freq.add.unit === "month" ? onDay(n, c.genDay) : n;
            }

            /**
             * Start of the old charge's last billed cycle: one period before the current cycle, not before the
             * charge start date. null when the charge has billed no cycle yet.
             */
            function prevCycleStart() {
                const c = state.cycle,
                    start = parseDate(state.oldRc.array_startdate),
                    prev = subtractPeriod(c.fs, c.freq),
                    from = start && start > prev ? start : prev;
                return from < c.fs ? from : null;
            }

            /**
             * Why this charge can't be approved (already replaced by an active charge), or null when it can.
             * An INACTIVE charge can still be approved: the new charge is created from it.
             * Reject is always allowed.
             */
            function validateCharge(rc, amended) {
                if (amended) {
                    return 'This charge has already been replaced by "' + (amended.array_chargename || "another recurring charge") + '". Approve increases on the latest charge instead. You can still reject this one.';
                }
                return null;
            }

            /* =====================================================================
               6. PAGE FRAME - render() and the shared header / banners / footer / blocks
               ===================================================================== */

            /** Redraws the whole page for the current stage. Call after any state change. */
            function render() {
                renderHeader();
                renderSteps();
                renderBanners();
                const c = $("content");
                if (state.fatal) c.innerHTML = renderFatal();
                else if (isBulk()) c.innerHTML = state.bulkDone ? renderBulkDone() : [renderBulkStep1, renderBulkStep2, renderBulkStep3][state.bulkStep - 1]();
                else if (state.done) c.innerHTML = renderDone();
                else c.innerHTML = [renderStep1, renderStep2, renderStep3][state.step - 1]();
                // Bulk Confirm: "tick all" shows a dash when only some charges are ticked (property only, no HTML attribute)
                const notifyAll = $("notifyAll");
                if (notifyAll) notifyAll.indeterminate = notifyAll.hasAttribute("data-mixed");
                renderFooter();
                renderIndexEditor();
                // Focus asked for by the last action (e.g. the index tile after the popup closed), now that the element exists
                if (state.focusAfter) {
                    const f = $(state.focusAfter);
                    state.focusAfter = null;
                    if (f) f.focus();
                }
            }

            /**
             * Header, as labelled fields so it is clear which value is which:
             *   one charge : Lease name, Tenant, Charge ID (opens the recurring charge), Frequency
             *   bulk       : Bulk approval, Recurring charges, Lease agreements, Selected records
             */
            function renderHeader() {
                const el = $("hdrSub");
                if (state.fatal) {
                    el.innerHTML = "";
                } else if (isBulk()) {
                    const leases = new Set(state.charges.map((ch) => ch.leaseId)).size;
                    el.innerHTML =
                        '<div class="hfs"><span class="hf"><span class="hdr-name">Bulk approval</span></span>' +
                        fieldHtml("Recurring charges", String(state.charges.length)) +
                        fieldHtml("Lease agreements", String(leases)) +
                        fieldHtml("Selected records", String(selectedCount())) +
                        "</div>";
                } else if (state.oldRc) {
                    const rc = state.oldRc,
                        ch = state.charges[state.active],
                        freq = FREQ[rc.array_frequency];
                    el.innerHTML =
                        '<div class="hfs">' +
                        leaseFieldsHtml(ch) +
                        fieldHtml("Charge ID", rcLink(rc.array_recurringchargeid, ch.chargeId || "Open recurring charge")) +
                        (freq ? fieldHtml("Frequency", esc(freq.label)) : "") +
                        "</div>";
                } else {
                    el.innerHTML = "";
                }
            }

            /** Stage tracker (Steps 1-3) under the header; finished steps show a check. Hidden on load errors. */
            function renderSteps() {
                const el = $("steps");
                const step = isBulk() ? state.bulkStep : state.step,
                    finished = isBulk() ? state.bulkDone : state.done;
                el.hidden = !!state.fatal;
                el.innerHTML = STEP_NAMES.map((n, i) => {
                    const s = i + 1,
                        done = finished || s < step;
                    const cls = done ? "done" : s === step ? "active" : "";
                    return '<li class="' + cls + '"><span class="step-no">' + (done ? icon("check") : s) + "</span>" + esc(n) + "</li>";
                }).join("");
            }

            /**
             * One banner above the content (HTML): "error" or "warn", with its icon.
             * @param {string} text plain text (escaped here)
             */
            function bannerHtml(kind, text) {
                return (
                    '<div class="banner ' + kind + '"' + (kind === "error" ? ' role="alert"' : "") + ">" +
                    icon(kind === "error" ? "error" : "warn") + "<div>" + esc(text) + "</div></div>"
                );
            }

            /** Load notice, last action error and "can't approve" warning, above the content. */
            function renderBanners() {
                let html = "";
                if (state.notice && !state.fatal) html += bannerHtml("warn", state.notice);
                if (state.error) html += bannerHtml("error", state.error);
                if (state.bulkError) html += bannerHtml("error", state.bulkError);
                if (state.blocker && !state.done && !state.fatal) html += bannerHtml("warn", state.blocker);
                $("banners").innerHTML = html;
            }

            /**
             * Footer buttons for the current stage:
             *   one charge : Cancel, Reject, Back, Next / Approve      (result: Close)
             *   bulk       : Cancel, Back, Next / Approve all          (result: Close)
             */
            function renderFooter() {
                const cancel = $("btnCancel"),
                    reject = $("btnReject"),
                    back = $("btnBack"),
                    next = $("btnNext");
                back.innerHTML = icon("arrowLeft") + "Back";
                if (isBulk()) {
                    const finished = !!(state.fatal || state.bulkDone);
                    cancel.textContent = finished ? "Close" : "Cancel";
                    cancel.disabled = state.busy;
                    reject.hidden = true; // bulk: rejections are set per charge on Step 1
                    back.hidden = finished || state.bulkStep === 1;
                    back.disabled = state.busy;
                    next.hidden = finished;
                    next.innerHTML = state.bulkStep === 3 ? icon("check") + (decisionCounts().approve ? "Approve all" : "Save all") : "Next" + icon("arrowRight");
                    next.disabled = state.busy || bulkIssues(state.bulkStep).length > 0;
                    return;
                }
                const finished = !!(state.fatal || state.done);
                cancel.textContent = finished ? "Close" : "Cancel";
                cancel.disabled = state.busy;
                reject.hidden = finished || !getPicked();
                reject.disabled = state.busy;
                back.hidden = finished || state.step === 1;
                back.disabled = state.busy;
                next.hidden = finished;
                next.innerHTML = state.step === 3 ? icon("check") + "Approve" : "Next" + icon("arrowRight");
                next.disabled = state.busy || !canAdvance();
            }

            /** One charge: whether Next / Approve is allowed on the current step. */
            function canAdvance() {
                const p = getPicked();
                if (!p) return false;
                if (state.step === 2) return !cpiError() && !!getSchedule() && !isNaN(state.additional) && !oneTimeError(); // valid CPI index, start and amounts
                if (state.step === 3) return !state.blocker && !cpiError() && !!getSchedule() && newAmount() != null;
                return true;
            }

            /** Full-page error when loading failed. */
            function renderFatal() {
                return '<div class="card result err"><div class="result-title">' + icon("error") + "Unable to load</div><p>" + esc(state.fatal) + "</p></div>";
            }

            /**
             * Message box with a leading icon (HTML).
             * @param {string} kind "warn" | "info"
             * @param {string} bodyHtml content (must already be escaped)
             * @param {string} [cls] extra class, e.g. "issues"
             */
            function msgBox(kind, bodyHtml, cls) {
                return '<div class="' + kind + "-box" + (cls ? " " + cls : "") + '">' + icon(kind) + "<div>" + bodyHtml + "</div></div>";
            }

            /** One label/value pair for a .kv grid (valueHtml must already be escaped). */
            const kv = (label, valueHtml) => '<div class="k">' + esc(label) + "</div><div>" + valueHtml + "</div>";

            /**
             * One labelled field for a row of fields (.hfs container): grey field name, then the value
             * (valueHtml must already be escaped). A dot is drawn between fields.
             */
            function fieldHtml(label, valueHtml) {
                return '<span class="hf"><span class="hf-k">' + esc(label) + '</span><span class="hf-v">' + valueHtml + "</span></span>";
            }

            /**
             * Collapsible block whose open/closed state survives re-renders (kept in state.openKeys).
             * @param {string} key unique key - build it with fid() so it is unique per charge
             * @param {string} summaryHtml the clickable line (HTML)
             * @param {string} bodyHtml content shown when open
             * @param {string} [cls] "more" (default: a "Show details" link) or "sum-row" (bulk Confirm row)
             */
            function detailsHtml(key, summaryHtml, bodyHtml, cls) {
                const k = cls || "more";
                return (
                    '<details class="' + k + '" data-key="' + key + '"' + (state.openKeys.has(key) ? " open" : "") + "><summary>" + summaryHtml + "</summary>" +
                    '<div class="' + k + '-b">' + bodyHtml + "</div></details>"
                );
            }

            /**
             * One item of an amount flow: label above a value, and an optional line under it (HTML).
             * cls "total" = the result, "once" = the one-time charge set apart after it.
             */
            function flowItemHtml(label, valueHtml, cls, subHtml) {
                return (
                    '<div class="flow-item' + (cls ? " " + cls : "") + '"><div class="flow-k">' + esc(label) + '</div><div class="flow-v">' + valueHtml + "</div>" +
                    (subHtml ? '<div class="flow-sub">' + subHtml + "</div>" : "") + "</div>"
                );
            }

            /**
             * Read-only amount flow (Step 3): current rent + CPI increase (+ extra amount) = new rent per billing
             * cycle, then - set apart, as it is billed once - the missed-period charge when there is one.
             */
            function flowHtml(sch) {
                const p = getPicked(),
                    additional = effectiveAdditional(),
                    missed = sch && sch.missed;
                return (
                    '<div class="flow">' +
                    flowItemHtml("Current rent", '<span class="amt-old">' + money(rcAmount()) + "</span>") +
                    '<div class="flow-op">+</div>' +
                    flowItemHtml("CPI increase", money(increase(p))) +
                    (additional > 0 ? '<div class="flow-op">+</div>' + flowItemHtml("Extra amount", money(additional)) : "") +
                    '<div class="flow-op">=</div>' +
                    flowItemHtml("New rent", '<span class="amt-new">' + money(newAmount()) + "</span>", "total", esc(freqWords().per)) +
                    (missed ? flowItemHtml("One-time charge", money(missed.amount), "once", "Missed period, on the invoice of " + showDate(missed.invoiceDate)) : "") +
                    "</div>"
                );
            }

            /** "old -> new" amount pair (HTML), with an arrow icon between the two amounts. */
            function amountChangeHtml(oldValue, newValue, sym) {
                return '<span class="amt-old">' + money(oldValue, sym) + '</span><span class="amt-arrow">' + icon("arrowRight", "sm") + '</span><span class="amt-new">' + money(newValue, sym) + "</span>";
            }

            /**
             * Element id / radio name for the charge in `state`.
             * In bulk every charge is on the page at once, so ids get a "c<index>-" prefix to stay unique.
             */
            function fid(name) {
                return isBulk() && state.active >= 0 ? "c" + state.active + "-" + name : name;
            }

            /** Field name of an element: its id without the bulk "c<index>-" prefix. */
            function fieldOf(el) {
                return (el.id || "").replace(/^c\d+-/, "");
            }

            /** Shows the loading / saving overlay with a message. */
            function showOverlay(text) {
                $("overlayText").textContent = text;
                $("overlay").hidden = false;
            }

            /** Hides the loading / saving overlay. */
            function hideOverlay() {
                $("overlay").hidden = true;
            }

            /* =====================================================================
               7. LOAD - read the selection and every recurring charge it touches
               ===================================================================== */

            /**
             * Groups the selected histories by the charge they amend: array_OldRecurringCharge (active
             * charge when CPI ran), else array_RecurringCharge.
             * @returns {{rcId:string|null, field:string, ids:string[], first:object}[]}
             */
            function groupSelection(selected) {
                const groups = new Map();
                selected.forEach((h) => {
                    const field = h[OLD_RC] ? OLD_RC : CUR_RC;
                    const rcId = h[field] || null;
                    const key = rcId || "none:" + hid(h);
                    if (!groups.has(key)) groups.set(key, { rcId, field, ids: [], first: h });
                    groups.get(key).ids.push(hid(h));
                });
                return Array.from(groups.values());
            }

            /**
             * Loads every charge in a few chunked queries (not one round-trip per charge):
             * the RCs, their full history, and any active charge already amended from them.
             * @returns {Promise<object[]>} one entry per group (blankCharge fields + rcId, rcName, chargeId,
             *          chargeName, inactive, leaseId, leaseRef, leaseName, tenant, brand, loadError),
             *          sorted by lease agreement then charge name
             */
            async function loadCharges(groups) {
                const linked = groups.filter((g) => g.rcId);
                const rcIds = linked.map((g) => g.rcId);
                // Charge ids of the groups found through one history lookup (old or current recurring charge)
                const rcIdsBy = (field) => linked.filter((g) => g.field === field).map((g) => g.rcId);
                const histOrder = "&$orderby=array_adjustmenteffectivefrom asc,createdon asc";

                const [rcs, oldHist, curHist, amendments] = await Promise.all([
                    retrieveByIds("array_recurringcharge", RC_SELECT, "array_recurringchargeid", rcIds),
                    retrieveByIds("array_cpiadjustmenthistory", HISTORY_SELECT, OLD_RC, rcIdsBy(OLD_RC), histOrder),
                    retrieveByIds("array_cpiadjustmenthistory", HISTORY_SELECT, CUR_RC, rcIdsBy(CUR_RC), histOrder),
                    // An ACTIVE charge already amended from one of these means another approval already replaced it
                    retrieveByIds(
                        "array_recurringcharge",
                        "array_recurringchargeid,array_chargename,_array_amendedfromcharge_value",
                        "_array_amendedfromcharge_value",
                        rcIds,
                        " and statecode eq " + RC_ACTIVE_STATECODE
                    )
                ]);

                // Lease name, tenant and brand for the lease sections. Display only: if this query fails the
                // page still works and falls back to the lease lookup's name.
                // Recurring charge of a group, or null
                const rcOf = (g) => rcs.find((r) => r.array_recurringchargeid === g.rcId) || null;
                // Lease agreement of a group: from its recurring charge, else from the history
                const leaseIdOf = (g) => (rcOf(g) && rcOf(g)._array_leaseagreement_value) || g.first._array_leaseagreement_value || "";
                let leases = [];
                try {
                    leases = await retrieveByIds("array_leaseagreement", LEASE_SELECT, "array_leaseagreementid", Array.from(new Set(groups.map(leaseIdOf).filter(Boolean))));
                } catch (e) {
                    /* keep the lookup name */
                }

                const charges = [];
                for (const g of groups) {
                    const rc = rcOf(g);
                    const ch = Object.assign(blankCharge(), { rcId: g.rcId, first: g.first, selectedIds: g.ids, loadError: null });
                    if (!g.rcId) {
                        ch.loadError = "This CPI adjustment is not linked to a recurring charge.";
                    } else if (!rc) {
                        ch.loadError = "The recurring charge could not be found, or you don't have access to it.";
                    } else {
                        ch.oldRc = rc;
                        ch.histories = (g.field === OLD_RC ? oldHist : curHist).filter((h) => h[g.field] === g.rcId);
                        ch.symbol = await getCurrencySymbol(g.first._transactioncurrencyid_value || rc._transactioncurrencyid_value);
                        try {
                            ch.cycle = readCycle(rc);
                        } catch (e) {
                            ch.blocker = e.message;
                        }
                        ch.blocker = ch.blocker || validateCharge(rc, amendments.find((a) => a._array_amendedfromcharge_value === g.rcId));
                    }
                    ch.leaseId = leaseIdOf(g);
                    const lease = leases.find((l) => l.array_leaseagreementid === ch.leaseId) || null;
                    // Lease reference = the lease lookup's display name (e.g. NX-PL-001-...-LA01)
                    ch.leaseRef = fv(rc, "array_leaseagreement") || fv(g.first, "array_leaseagreement") || (lease && lease.array_leasenumber) || "";
                    ch.leaseName = (lease && lease.array_leasename) || ch.leaseRef || "No lease agreement";
                    ch.tenant = fv(lease, "array_tenant");
                    ch.brand = fv(lease, "array_brand");
                    // RC name = the charge's primary name (its Charge ID), as shown by the history's recurring charge lookup
                    ch.rcName = fv(g.first, g.field === OLD_RC ? "array_oldrecurringcharge" : "array_recurringcharge");
                    ch.chargeId = (rc && rc.array_chargeid) || ch.rcName || "";
                    ch.chargeName = (rc && rc.array_chargename) || ch.rcName || "(unnamed charge)";
                    ch.inactive = !!rc && rc.statecode !== RC_ACTIVE_STATECODE;
                    charges.push(ch);
                }
                // Grouped by lease agreement in bulk
                return charges.sort(
                    (a, b) => a.leaseName.localeCompare(b.leaseName) || a.leaseId.localeCompare(b.leaseId) || a.chargeName.localeCompare(b.chargeName)
                );
            }

            /**
             * CPI Adjustment Schedules of the open histories (start / end date, shown on Step 1), then each charge's
             * histories sorted by them (sortHistories). If the schedules can't be read the histories are still
             * sorted (effective date / Created On) and Step 1 says the dates couldn't be loaded.
             */
            async function loadSchedules() {
                const ids = new Set();
                state.charges.forEach((ch) =>
                    ch.histories.forEach((h) => {
                        if (isSelectable(h) && h._array_cpiadjustmentschedule_value) ids.add(h._array_cpiadjustmentschedule_value);
                    })
                );
                if (ids.size) {
                    try {
                        const rows = await retrieveByIds(
                            "array_cpiadjustmentschedule",
                            "array_cpiadjustmentscheduleid," + SCHEDULE_START + "," + SCHEDULE_END,
                            "array_cpiadjustmentscheduleid",
                            Array.from(ids)
                        );
                        rows.forEach((s) => (state.schedules[s.array_cpiadjustmentscheduleid] = s));
                    } catch (e) {
                        state.schedLoadFailed = true;
                    }
                }
                state.charges.forEach((ch) => sortHistories(ch.histories));
            }

            /**
             * For the open increases of all charges: their lease clauses (CPI type, current index) and the recent
             * CPI Index rows of those CPI types, offered in the Step 2 index popup. If this fails the page still
             * works: the approver enters the index values manually (state.cpiLoadFailed explains why there is no list).
             */
            async function loadCpiData() {
                const clauseIds = new Set();
                state.charges.forEach((ch) =>
                    ch.histories.forEach((h) => {
                        if (isSelectable(h) && h._array_leaseclause_value) clauseIds.add(h._array_leaseclause_value);
                    })
                );
                if (!clauseIds.size) return;
                try {
                    const clauses = await retrieveByIds("array_leaseclause", CLAUSE_SELECT, "array_leaseclauseid", Array.from(clauseIds));
                    clauses.forEach((c) => (state.clauses[c.array_leaseclauseid] = c));
                    const types = Array.from(new Set(clauses.map((c) => c._array_cpitype_value).filter(Boolean)));
                    const since = isoDate(addMonthsSafely(todayDate(), -CPI_INDEX_MONTHS));
                    state.cpiIndexes = await retrieveByIds(
                        "array_cpiindex",
                        CPI_INDEX_SELECT,
                        "_array_cpitype_value",
                        types,
                        " and Microsoft.Dynamics.CRM.OnOrAfter(PropertyName='array_perioddate',PropertyValue='" + since + "')&$orderby=array_perioddate desc"
                    );
                } catch (e) {
                    state.cpiLoadFailed = true;
                }
            }

            /**
             * Page start-up: reads the launch ids, loads all data, preselects a history on each charge,
             * then shows Step 1 for one charge, or bulk Step 1 for several.
             */
            async function load() {
                showOverlay("Loading CPI adjustment history...");
                try {
                    state.xrm = getXrm();
                    if (!state.xrm) throw new Error("The Dynamics 365 client API (Xrm) is not available. Open this page from the CPI Approval button.");
                    state.clientUrl = state.xrm.Utility.getGlobalContext().getClientUrl();

                    state.launchIds = getLaunchIds();
                    if (!state.launchIds.length) throw new Error("No CPI Adjustment History record was passed to this page.");

                    const selected = await retrieveByIds("array_cpiadjustmenthistory", HISTORY_SELECT, "array_cpiadjustmenthistoryid", state.launchIds);
                    if (!selected.length) throw new Error("The selected CPI Adjustment History record could not be found, or you don't have access to it.");
                    const missing = state.launchIds.length - selected.length;
                    if (missing > 0) {
                        state.notice = missing + " of the " + state.launchIds.length + " selected records could not be found, or you don't have access to them, so they are not shown.";
                    }

                    const groups = groupSelection(selected);
                    if (groups.length > 1) showOverlay("Loading " + groups.length + " recurring charges...");
                    state.charges = await loadCharges(groups);
                    if (state.charges.length === 1 && state.charges[0].loadError) throw new Error(state.charges[0].loadError);
                    await loadCpiData(); // before pick(): the CPI entry needs the lease clause
                    await loadSchedules(); // before pick(): the order decides the latest and the Missed ones

                    // Pre-select on each charge the latest selected record that can still be approved
                    // (approving it marks older open records Missed, as with a single record).
                    // Bulk default: Approve when a record is picked and the charge can be approved, else Skip.
                    state.charges.forEach((ch, i) => {
                        if (ch.loadError) return;
                        useCharge(i);
                        const target = state.histories.filter((h) => isSelectable(h) && state.selectedIds.indexOf(hid(h)) >= 0).pop();
                        if (target) pick(hid(target));
                        state.decision = state.pickedId && !state.blocker ? "approve" : "skip";
                    });
                    useCharge(-1);

                    if (state.charges.length > 1) state.view = "bulk";
                    else useCharge(0);
                } catch (e) {
                    state.fatal = e.message || String(e);
                } finally {
                    hideOverlay();
                    render();
                }
            }

            /* =====================================================================
               8. BULK FRAME - several charges on one page
               Every step shows all charges, in one section per lease agreement and one card
               per recurring charge. The single-charge step functions are reused for each card
               through withCharge(). Nothing is saved until "Approve all" (Step 3).
               ===================================================================== */

            /** Copies the fields of the charge in `state` back into state.charges[active]. */
            function saveCharge() {
                const ch = state.charges[state.active];
                if (ch) CHARGE_FIELDS.forEach((k) => (ch[k] = state[k]));
            }

            /**
             * Keeps the progress of the charge in `state`, then loads charge i into `state`.
             * @param {number} i index in state.charges; -1 = no charge (blank fields)
             */
            function useCharge(i) {
                saveCharge();
                state.active = i;
                const src = state.charges[i] || blankCharge();
                CHARGE_FIELDS.forEach((k) => (state[k] = src[k]));
            }

            /**
             * Runs fn with charge i loaded into `state`, so the single-charge functions (getPicked,
             * newAmount, the step renderers, ...) work on that charge; the previous charge is restored
             * afterwards. Calls can be nested.
             * Inside fn, read the per-charge fields from `state`; use the `ch` argument only for the
             * fixed ones (chargeName, leaseName, rcId, ...).
             * @param {number} i
             * @param {function(object): *} fn receives state.charges[i]
             * @returns whatever fn returns
             */
            function withCharge(i, fn) {
                const prev = state.active;
                useCharge(i);
                try {
                    return fn(state.charges[i]);
                } finally {
                    useCharge(prev);
                }
            }

            /** Short name of a charge for messages and error steps: "RC-3320 - Base Rent". */
            function chargeLabel(ch) {
                return (ch.chargeId ? ch.chargeId + " - " : "") + ch.chargeName;
            }

            /** "Charge ID RC-3320" as a labelled field (+ an "Inactive" tag) (HTML). The charge name is the card / row title. */
            function chargeIdsHtml(ch) {
                return fieldHtml("Charge ID", esc(ch.chargeId || TXT.EMPTY)) + (ch.inactive ? ' <span class="badge untouched">Inactive</span>' : "");
            }

            /**
             * Lease for headings, as labelled fields (HTML): Lease name and Tenant. Without a lease name the
             * lease agreement number is shown as the name; a missing tenant is left out.
             */
            function leaseFieldsHtml(ch) {
                return fieldHtml("Lease name", esc(ch.leaseName)) + (ch.tenant ? fieldHtml("Tenant", esc(ch.tenant)) : "");
            }

            /**
             * Full lease details for "Show details" (HTML): Lease name, Lease agreement (the record's name,
             * e.g. NX-PL-...-LA01), Tenant, Brand. Missing parts are left out.
             */
            function leaseDetailsHtml(ch) {
                const named = ch.leaseRef && ch.leaseRef !== ch.leaseName;
                return (
                    (named ? fieldHtml("Lease name", esc(ch.leaseName)) + fieldHtml("Lease agreement", esc(ch.leaseRef)) : fieldHtml("Lease agreement", esc(ch.leaseName))) +
                    (ch.tenant ? fieldHtml("Tenant", esc(ch.tenant)) : "") +
                    (ch.brand ? fieldHtml("Brand", esc(ch.brand)) : "")
                );
            }

            /** Number of history records selected in the view, over all charges. */
            function selectedCount() {
                return state.charges.reduce((n, ch) => n + ch.selectedIds.length, 0);
            }

            /** How many charges will be approved / rejected / skipped (charges that failed to load are skipped). */
            function decisionCounts() {
                saveCharge();
                const n = { approve: 0, reject: 0, skip: 0 };
                state.charges.forEach((ch) => n[ch.loadError ? "skip" : ch.decision]++);
                return n;
            }

            /**
             * Requests "Approve all" will send: 3 per approval (+1 per history marked Missed, +1 for a
             * missed-period charge, +1-3 for a CPI-pending or changed index - see cpiRequests, +1 per CPI schedule
             * closed - see scheduleRequests), 1-2 per rejection (see buildRejectRequests).
             */
            function countOps() {
                let ops = 0;
                state.charges.forEach((ch, i) => {
                    if (ch.loadError) return;
                    withCharge(i, () => {
                        const p = getPicked();
                        if (state.decision === "approve") {
                            ops += 3 + olderSelectable().length + (missedChargeOn() ? 1 : 0) + cpiRequests(p).length + scheduleRequests(closedByApproval(p)).length;
                        } else if (state.decision === "reject") {
                            ops += p ? buildRejectRequests(p).length : 1;
                        }
                    });
                });
                return ops;
            }

            /**
             * What still blocks the bulk run up to `step` - empty when the approver can continue.
             * @returns {string[]} one message per problem, naming the charge
             */
            function bulkIssues(step) {
                const issues = [];
                let acting = 0;
                state.charges.forEach((ch, i) => {
                    if (ch.loadError) return;
                    withCharge(i, () => {
                        if (state.decision === "skip") return;
                        acting++;
                        const name = chargeLabel(ch) + ": ";
                        if (!getPicked()) return issues.push(name + "select an increase.");
                        if (state.decision !== "approve") return;
                        if (state.blocker) return issues.push(name + state.blocker);
                        const cpiErr = step >= 2 ? cpiError() : null;
                        if (cpiErr) return issues.push(name + cpiErr.charAt(0).toLowerCase() + cpiErr.slice(1));
                        if (step >= 2 && !getSchedule()) {
                            if (!state.options.length) return issues.push(name + 'there is no remaining period to apply the increase to. Set it to "To reject" or "Skip".');
                            return issues.push(name + (state.startMode ? "check the split dates." : "choose when the new rent starts."));
                        }
                        if (step >= 2 && isNaN(state.additional)) return issues.push(name + "enter an extra amount of 0 or more.");
                        if (step >= 2 && oneTimeError()) return issues.push(name + oneTimeError().toLowerCase());
                        if (step >= 3 && newAmount() == null) return issues.push(name + "the revised amount can't be calculated (no Amount or Increased Amount).");
                    });
                });
                if (!acting) issues.unshift('Set at least one charge to "To approve" or "To reject".');
                if (step >= 3) {
                    const ops = countOps();
                    if (ops > MAX_CHANGESET_OPS) {
                        issues.push(
                            "This run needs " + ops + " changes, but one all-or-nothing save is limited to " + MAX_CHANGESET_OPS +
                            ". Skip some charges, or approve them in smaller selections."
                        );
                    }
                }
                return issues;
            }

            /** "Before you continue" box listing bulkIssues(step) (first 10). */
            function issuesHtml(step) {
                const issues = bulkIssues(step);
                if (!issues.length) return "";
                const shown = issues.slice(0, 10);
                return msgBox(
                    "warn",
                    "<strong>Before you continue:</strong><ul>" +
                    shown.map((m) => "<li>" + esc(m) + "</li>").join("") +
                    "</ul>" +
                    (issues.length > shown.length ? '<div class="hint">...and ' + (issues.length - shown.length) + " more.</div>" : ""),
                    "issues"
                );
            }

            /** Moves the bulk run to step n. Every charge follows, so the step checks in the shared code work. */
            function goBulkStep(n) {
                state.bulkStep = n;
                state.bulkError = null;
                state.charges.forEach((ch) => (ch.step = n));
                render();
                $("content").scrollTop = 0;
            }

            /**
             * Lays charges out in one panel per lease agreement: a header band ("Lease 1 of 2", lease name, tenant),
             * then the charges' cards. Charges are sorted by lease agreement, so each lease's charges are together.
             * @param {function(object, number): string} cardFn HTML for charge i ("" leaves it out)
             * @param {string} [headHtml] shown at the top of each panel, above its cards (bulk Confirm: the column headings)
             */
            function byLease(cardFn, headHtml) {
                // Leases in display order: { leaseId, ch (first charge, for the heading), cards }
                const groups = [];
                state.charges.forEach((ch, i) => {
                    const card = cardFn(ch, i);
                    if (!card) return;
                    const last = groups[groups.length - 1];
                    if (last && last.leaseId === ch.leaseId) last.cards += card;
                    else groups.push({ leaseId: ch.leaseId, ch, cards: card });
                });
                return groups
                    .map(
                        (g, n) =>
                            '<section class="lease"><h2 class="lease-h"><span class="lease-no">Lease ' + (n + 1) + " of " + groups.length + "</span>" +
                            '<span class="hfs">' + leaseFieldsHtml(g.ch) + "</span></h2>" +
                            '<div class="lease-b">' + (headHtml || "") + g.cards + "</div></section>"
                    )
                    .join("");
            }

            /**
             * Card for the charge in `state` (call inside withCharge). Header: "Recurring charge" + name (link), then
             * the labelled fields Charge ID, Frequency, Current rent, Adjustment, and the decision.
             * Below it any "can't approve" message, then the step's content.
             * @param {string} bodyHtml step content for this charge
             * @param {boolean} [editDecision] decision selector (Step 1) instead of a badge
             * @param {boolean} [flush] body without padding (tables)
             */
            function chargeCardHtml(bodyHtml, editDecision, flush) {
                const ch = state.charges[state.active],
                    rc = state.oldRc,
                    p = getPicked(),
                    freq = FREQ[rc.array_frequency],
                    d = DECISION[state.decision];
                return (
                    '<div class="card charge' + (state.decision === "skip" ? " skipped" : "") + '" data-charge="' + state.active + '">' +
                    '<div class="charge-h"><div class="charge-title">' +
                    '<span class="charge-k">Recurring charge</span>' + rcLink(rc.array_recurringchargeid, ch.chargeName) +
                    '<div class="charge-meta hfs">' +
                    chargeIdsHtml(ch) +
                    (freq ? fieldHtml("Frequency", esc(freq.label)) : "") +
                    fieldHtml("Current rent", '<span class="amt-old">' + money(rc.array_amount) + "</span>") +
                    (p ? fieldHtml("Adjustment", esc(hname(p))) : "") +
                    "</div></div>" +
                    (editDecision ? decisionHtml() : '<span class="badge ' + d.cls + '">' + esc(d.label) + "</span>") +
                    "</div>" +
                    (state.blocker ? '<div class="charge-msg">' + icon("warn") + "<div>" + esc(state.blocker) + "</div></div>" : "") +
                    '<div class="charge-b' + (flush ? " flush" : "") + '">' + bodyHtml + "</div></div>"
                );
            }

            /**
             * To approve / To reject / Skip selector for the charge in `state` (Step 1).
             * To approve needs a picked increase on a charge that can be amended; To reject needs a picked increase.
             */
            function decisionHtml() {
                if (!state.histories.some(isSelectable)) return '<span class="badge untouched">Nothing to approve</span>';
                // One <option> of the decision selector
                const opt = (v, disabled) =>
                    '<option value="' + v + '"' + (state.decision === v ? " selected" : "") + (disabled ? " disabled" : "") + ">" + esc(DECISION[v].label) + "</option>";
                return (
                    '<label class="decision">Decision <select data-f="decision">' +
                    opt("approve", !!state.blocker || !getPicked()) +
                    opt("reject", !getPicked()) +
                    opt("skip", false) +
                    "</select></label>"
                );
            }

            /** Card for a charge that failed to load (Step 1 only; it is always skipped). */
            function errorCardHtml(ch) {
                return (
                    '<div class="card charge"><div class="charge-h"><div class="charge-title">' +
                    '<span class="charge-k">Recurring charge</span>' + (ch.rcId ? rcLink(ch.rcId, ch.chargeName) : esc(ch.chargeName)) +
                    '<div class="charge-meta hfs">' + chargeIdsHtml(ch) + "</div>" +
                    '</div><span class="badge rejected">Couldn&#39;t load</span></div>' +
                    '<div class="charge-msg">' + icon("warn") + "<div>" + esc(ch.loadError) + "</div></div></div>"
                );
            }

            /** Bulk Steps 2-3: card for each charge set to Approve, or a note when there are none. */
            function approvingCards(bodyFn) {
                const html = byLease((ch, i) => (ch.loadError || ch.decision !== "approve" ? "" : withCharge(i, () => chargeCardHtml(bodyFn()))));
                return html || msgBox("info", 'No charges are set to "To approve", so there is nothing to set on this step.');
            }

            /* =====================================================================
               9. STEP 1 - SELECT INCREASE
               Only increases with Approval Status = Draft and Status = Active are listed;
               Pending, Approved, Rejected, Missed and inactive history is not shown.
               ===================================================================== */

            /**
             * Picks the history to act on and resets what depends on it: the additional amount, the CPI entry
             * (index values and effective date) and the start options (see resetStart).
             */
            function pick(id) {
                state.pickedId = id;
                state.additional = 0; // the extra amount depends on the picked row
                state.additionalRaw = "0";
                state.extraOpen = false;
                state.limitsOn = true;
                const p = getPicked();
                state.cpi = p ? initCpi(p) : null;
                resetStart();
            }

            /**
             * Start options (Step 2) for the picked history and what depends on them: the split defaults and
             * the missed-period charge (ticked, recommended amount). Rerun when the effective date changes.
             * The default start is always "Next cycle" (or the only option there is).
             */
            function resetStart() {
                state.options = computeOptions(getPicked());
                const splitOpt = getOption("split");
                state.split = splitOpt ? initSplit(splitOpt.defaultStart) : null;
                const def = state.options.find((o) => o.isDefault) || (state.options.length === 1 ? state.options[0] : null);
                state.startMode = def ? def.key : null;
                state.missedOn = true;
                state.oneTimeTouched = false;
                syncOneTime();
            }

            /**
             * Schedule line under an adjustment on Step 1: "Schedule 01 Oct 2025 - 30 Sep 2026". A missing
             * schedule or date is said in words ("start date not set", "No CPI schedule linked", ...) (HTML).
             */
            function scheduleHtml(h) {
                // A missing schedule or date, said in words
                const missing = (text) => '<span class="missing">' + esc(text) + "</span>";
                const s = scheduleOf(h);
                let body;
                if (!h._array_cpiadjustmentschedule_value) body = missing("No CPI schedule linked");
                else if (state.schedLoadFailed) body = missing("Schedule dates couldn't be loaded");
                else if (!s) body = missing("Schedule not found");
                else {
                    const start = parseDate(s[SCHEDULE_START]),
                        end = parseDate(s[SCHEDULE_END]);
                    body = "Schedule " + (start ? showDate(start) : missing("start date not set")) + TXT.RANGE + (end ? showDate(end) : missing("end date not set"));
                }
                return '<div class="hint sched" title="' + esc(fv(h, "array_cpiadjustmentschedule")) + '">' + body + "</div>";
            }

            /** Newest CPI Index row of the CPI type of a history's lease clause, or null (none loaded for that type). */
            function latestCpiIndex(h) {
                const clause = state.clauses[h._array_leaseclause_value],
                    type = clause && clause._array_cpitype_value;
                if (!type) return null;
                return state.cpiIndexes
                    .filter((r) => r._array_cpitype_value === type)
                    .reduce((best, r) => (!best || String(r.array_perioddate) > String(best.array_perioddate) ? r : best), null);
            }
