            /**
             * CPI increase cell of a CPI-pending row (HTML), in words instead of a dash: the CPI indices couldn't be
             * read ("Index not fetched"), no CPI schedule is linked ("No index published"), or the index is not
             * published yet - with the latest index of the lease clause's CPI type when one is known.
             */
            function pendingIncreaseHtml(h) {
                let main,
                    sub = "";
                if (state.cpiLoadFailed) {
                    main = "Index not fetched";
                    sub = "Enter it on the next step";
                } else if (!h._array_cpiadjustmentschedule_value) {
                    main = "No index published";
                    sub = "No CPI schedule linked";
                } else {
                    main = "Index not published yet";
                    const latest = latestCpiIndex(h);
                    if (latest) sub = "Latest: " + monthText(parseDate(latest.array_perioddate)) + " (" + numText(latest.array_indexvalue) + ")";
                }
                return '<div class="pend">' + esc(main) + (sub ? '<span class="pend-sub">' + esc(sub) + "</span>" : "") + "</div>";
            }

            /** Pick list of the increases still waiting for approval on the charge in `state` (oldest schedule first). */
            function historyTableHtml() {
                const open = state.histories.filter(isSelectable);
                if (!open.length) return '<div class="empty">' + icon("info") + "<div>No open CPI increase on this charge.</div></div>";
                const latestId = hid(open[open.length - 1]);
                const rows = open
                    .map((h) => {
                        const id = hid(h),
                            picked = id === state.pickedId,
                            // CPI-pending and no index chosen yet: the amount cells say why instead of showing a dash
                            waiting = isCpiPending(h) && increase(h) == null;
                        const tags =
                            (id === latestId ? '<span class="badge latest">Latest</span>' : "") +
                            (isCpiPending(h) ? '<span class="badge cpi" title="Created before the CPI index was published: choose the index on the next step">CPI pending</span>' : "") +
                            (state.selectedIds.indexOf(id) >= 0
                                ? '<span class="badge current">' + (state.launchIds.length > 1 ? "Selected" : "Opened record") + "</span>"
                                : "");
                        return (
                            '<tr class="selectable' + (picked ? " picked" : "") + '" data-id="' + esc(id) + '">' +
                            '<td class="c-radio"><input type="radio" name="' + fid("pick") + '" value="' + esc(id) + '"' + (picked ? " checked" : "") + ' aria-label="Select ' + esc(hname(h)) + '" /></td>' +
                            '<td><div class="strong">' + esc(hname(h)) + "</div>" + scheduleHtml(h) + (tags ? '<div class="tags">' + tags + "</div>" : "") + "</td>" +
                            "<td>" + showDate(effDate(h)) + "</td>" +
                            '<td class="num">' + (waiting ? pendingIncreaseHtml(h) : money(increase(h)) + limitTagHtml(h)) + "</td>" +
                            '<td class="num"><span class="amt-old">' + money(rcAmount()) + "</span></td>" +
                            '<td class="num">' +
                            (waiting ? '<div class="pend muted">Shown once the index is chosen</div>' : '<span class="amt-new">' + money(baseNewRent(h)) + "</span>") +
                            "</td>" +
                            "</tr>"
                        );
                    })
                    .join("");
                return (
                    '<div class="tbl-wrap"><table class="tbl hist">' +
                    "<thead><tr><th></th><th>Adjustment</th><th>Effective from</th>" +
                    '<th class="num">CPI increase</th><th class="num">Current rent</th>' +
                    '<th class="num">New rent</th></tr></thead>' +
                    "<tbody>" + rows + "</tbody></table></div>"
                );
            }

            /** Lease limit tag under a CPI increase amount (HTML): "Capped at 3%" etc., or "" (see historyLimit). */
            function limitTagHtml(h) {
                const text = historyLimitText(h);
                return text ? '<span class="lim-tag">' + esc(text) + "</span>" : "";
            }

            /** Step 1 (one charge): pick the increase to approve. */
            function renderStep1() {
                return (
                    '<p class="lead">Select the increase to approve. Only open increases (Draft, Active) are listed, oldest first.</p>' +
                    '<div class="card flush">' + historyTableHtml() + "</div>"
                );
            }

            /** Step 1 (bulk): every charge with its open increases and a To approve / To reject / Skip decision. */
            function renderBulkStep1() {
                return (
                    '<p class="lead">Select the increase on each charge and set it to <strong>To approve</strong>, <strong>To reject</strong> or <strong>Skip</strong>. ' +
                    "Nothing is saved until you confirm on the last step.</p>" +
                    issuesHtml(1) +
                    byLease((ch, i) => (ch.loadError ? errorCardHtml(ch) : withCharge(i, () => chargeCardHtml(historyTableHtml(), true, true))))
                );
            }

            /* =====================================================================
               10. STEP 2 - REVIEW & START
               The new rent (with the optional additional amount) and when it starts.
               A "schedule" describes the new and old charge dates for one start option:
               { mode, newStart, freqStart, freqEnd, freqStartDay, invoiceGenDate, upcomingGenDate,
                 oldEnd, oldFreqStart, oldBills, clearOldUpcoming, flags }
               oldFreqStart = the old charge's new Frequency Start (its Frequency End = oldEnd); null = unchanged
               ===================================================================== */

            /* ---------- Start options and schedules (logic) ---------- */

            /** Schedule "current": the new charge takes over the whole current cycle (nothing to split). */
            function currentSchedule() {
                const c = state.cycle,
                    gen = c.gen || c.upcoming;
                return {
                    mode: "current",
                    newStart: c.fs,
                    freqStart: c.fs,
                    freqEnd: c.fe,
                    freqStartDay: c.fs.getUTCDate(), // always the day of the new charge's frequency start date
                    // It takes over the cycle's pending invoice; Upcoming = the same date, as the billing flow writes both
                    invoiceGenDate: gen,
                    upcomingGenDate: gen,
                    oldEnd: addDays(c.fs, -1),
                    oldFreqStart: prevCycleStart(), // the old charge's frequency window goes back to its last billed cycle
                    oldBills: false,
                    clearOldUpcoming: true, // the old charge must not invoice a cycle it no longer covers
                    flags: null // proration copied unchanged from the old charge
                };
            }

            /** Schedule "next": the old charge keeps the current cycle; the new charge starts at the following one. */
            function nextSchedule() {
                const c = state.cycle,
                    start = addDays(c.fe, 1);
                // The old charge still fires the current cycle's invoice, so the new charge's first
                // generation is one period later
                const gen = nextGen(c.gen) || start;
                return {
                    mode: "next",
                    newStart: start,
                    freqStart: start,
                    freqEnd: addDays(addPeriod(start, c.freq), -1),
                    freqStartDay: start.getUTCDate(),
                    // Upcoming = the same date, as the billing flow writes both
                    invoiceGenDate: gen,
                    upcomingGenDate: gen,
                    oldEnd: c.fe,
                    oldFreqStart: null, // the old charge keeps its cycle
                    oldBills: true,
                    clearOldUpcoming: CLEAR_OLD_UPCOMING_ON_NEXT_CYCLE,
                    flags: null
                };
            }

            /**
             * Start options that apply to the picked adjustment. The RC's Frequency Start/End is the next
             * cycle still to be invoiced, so "Next cycle" is that one ("current") or the one after ("next"):
             *   effective date on/before the cycle start -> "current" (the cycle with the effective date is already invoiced)
             *   effective date inside the cycle          -> "split" (only while the cycle's invoice is still to come) or "next"
             *   effective date after the cycle           -> "next"
             * "Next cycle" is the default (isDefault). Its missed period (effective date to the day before the new
             * rent starts) is charged by a one-time "missed-period charge" - see missedPeriod().
             * Options that would start after the charge end date are left out.
             */
            function computeOptions(picked) {
                const c = state.cycle,
                    list = [];
                if (!c || !picked) return list;

                const eff = effDate(picked);
                const nextStart = addDays(c.fe, 1);
                // A charge can start on d only when d is not after the charge end date
                const canStart = (d) => !c.chargeEnd || d <= c.chargeEnd;
                let base = null; // the "Next cycle" option

                if (eff && eff > c.fs && eff <= c.fe) {
                    const closed = canStart(eff) ? splitClosedReason() : null;
                    if (canStart(eff) && !closed) list.push({ key: "split", defaultStart: eff });
                    if (canStart(nextStart)) base = { key: "next", sch: nextSchedule(), splitClosed: closed };
                } else if (eff && eff > c.fe) {
                    if (canStart(nextStart)) base = { key: "next", sch: nextSchedule(), effectiveLater: eff };
                } else if (canStart(c.fs)) {
                    base = { key: "current", sch: currentSchedule(), effectiveBeforeCycle: !!eff && eff < c.fs };
                }
                if (base) {
                    base.isDefault = true;
                    list.push(base);
                }
                return list;
            }

            /**
             * Why the current cycle can't be split, or null when it can. A split takes over the cycle's pending
             * invoice, and the billing flow runs on the generation date itself, so that date must still be ahead
             * (after today). No date at all is not ahead either.
             */
            function splitClosedReason() {
                const c = state.cycle,
                    gen = c.gen || c.upcoming,
                    today = todayDate();
                if (!gen) return "The current cycle can't be split: the current charge has no invoice generation date.";
                if (gen > today) return null;
                return "The current cycle can't be split: its invoice is generated on " + showDate(gen) + (gen < today ? " (already passed)." : " (today).");
            }

            /** Billing cycles touched by the period from `from` up to the day before `start` (a cycle start). */
            function cyclesBetween(from, start) {
                const c = state.cycle;
                let s = start,
                    n = 0;
                while (s > from && n < 600) {
                    s = subtractPeriod(s, c.freq);
                    n++;
                }
                return n;
            }

            /** Default proration for a split: partial pieces are prorated; otherwise keep the charge's settings. */
            function defaultSplitFlags(newStart) {
                const rc = state.oldRc,
                    partial = newStart > state.cycle.fs;
                return {
                    prorate: partial || !!rc.array_prorationenabled,
                    firstCycle: partial || !!rc.array_prorationenabledforfirstcycle,
                    lastCycle: partial || !!rc.array_prorationenabledforlastcycle
                };
            }

            /** Split defaults: old charge ends the day before the effective date; new charge starts on it. */
            function initSplit(start) {
                return Object.assign({ newStart: start, oldEnd: addDays(start, -1), oldEndTouched: false, flagsTouched: false }, defaultSplitFlags(start));
            }

            /**
             * Validates the approver's split dates.
             * @returns {{error:string|null, warnings:string[]}} messages are HTML (built from escaped parts)
             */
            function splitCheck() {
                const c = state.cycle,
                    s = state.split,
                    warnings = [];
                if (!s) return { error: "No split available.", warnings };
                if (!s.newStart) return { error: "Enter the new charge start date.", warnings };
                if (!s.oldEnd) return { error: "Enter the current charge end date.", warnings };
                if (s.newStart < c.fs || s.newStart > c.fe) {
                    return { error: "The new charge start date must be inside the current cycle (" + range(c.fs, c.fe) + "). To start later, choose Next cycle.", warnings };
                }
                if (c.chargeEnd && s.newStart > c.chargeEnd) {
                    return { error: "The new charge start date is after the charge end date (" + showDate(c.chargeEnd) + ").", warnings };
                }
                if (s.oldEnd >= s.newStart) {
                    return { error: "The current charge end date must be before the new charge start date, otherwise both charges bill " + range(s.newStart, s.oldEnd) + ".", warnings };
                }
                if (s.oldEnd < addDays(c.fs, -1)) {
                    return { error: "The current charge end date can't be earlier than " + showDate(addDays(c.fs, -1)) + " (the day before the cycle).", warnings };
                }

                const gapFrom = addDays(s.oldEnd, 1),
                    gapTo = addDays(s.newStart, -1);
                if (gapFrom <= gapTo) warnings.push("Gap: " + range(gapFrom, gapTo) + " will not be billed by either charge.");
                if (s.oldEnd >= c.fs && !s.lastCycle) {
                    warnings.push("Without last cycle proration, the current charge may bill the full cycle amount for " + range(c.fs, s.oldEnd) + ".");
                }
                if (s.newStart > c.fs && !s.firstCycle) {
                    warnings.push("Without first cycle proration, the new charge may bill the full cycle amount for " + range(s.newStart, c.fe) + ".");
                }
                return { error: null, warnings };
            }

            /** Schedule "split": built from the approver's split dates and proration (call after splitCheck passes). */
            function splitSchedule() {
                const c = state.cycle,
                    s = state.split,
                    gen = c.gen || c.upcoming;
                return {
                    mode: "split",
                    newStart: s.newStart,
                    freqStart: s.newStart,
                    freqEnd: c.fe,
                    freqStartDay: s.newStart.getUTCDate(), // a split starts mid-cycle, so this day can differ from the old charge
                    // The new charge takes over the cycle's pending invoice; Upcoming = the same date, as the billing flow writes both
                    invoiceGenDate: gen,
                    upcomingGenDate: gen,
                    oldEnd: s.oldEnd,
                    // The old charge bills the cycle up to its end date, or nothing more (back to its last billed cycle)
                    oldFreqStart: s.oldEnd >= c.fs ? c.fs : prevCycleStart(),
                    oldBills: s.oldEnd >= c.fs,
                    clearOldUpcoming: s.oldEnd < c.fs,
                    flags: { prorate: s.prorate, firstCycle: s.firstCycle, lastCycle: s.lastCycle }
                };
            }

            /** Start option by key ("current" | "split" | "next"), or null. */
            function getOption(key) {
                return state.options.find((o) => o.key === key) || null;
            }

            /** The "Next cycle" option ("current" or "next"), or null. */
            function baseOption() {
                return state.options.find((o) => o.isDefault) || null;
            }

            /**
             * Missed period of the Next cycle option: from the effective date to the day before the new rent
             * starts, billed at the old rent. A late approval makes it several cycles. null when there is none.
             * @returns {{from:Date, to:Date, cycles:number, invoiceDate:Date}|null}
             */
            function missedPeriod() {
                const o = baseOption(),
                    p = getPicked(),
                    c = state.cycle,
                    eff = p ? effDate(p) : null;
                if (!o || !eff || eff >= o.sch.newStart) return null;
                return {
                    from: eff,
                    to: addDays(o.sch.newStart, -1),
                    cycles: cyclesBetween(eff, o.sch.newStart),
                    invoiceDate: c.gen || c.upcoming || o.sch.invoiceGenDate // with the charge's next regular invoice
                };
            }

            /** True when the approval also creates the missed-period charge (Next cycle chosen and box ticked). */
            function missedChargeOn() {
                const o = baseOption();
                return !!o && state.startMode === o.key && state.missedOn && !!missedPeriod();
            }

            /**
             * Schedule of the chosen start option; null when none is chosen or the split dates are invalid.
             * Next cycle with the missed-period charge ticked adds missed: { from, to, cycles, invoiceDate, amount }.
             */
            function getSchedule() {
                const o = getOption(state.startMode);
                if (!o) return null;
                if (o.key === "split") return state.split && !splitCheck().error ? splitSchedule() : null;
                if (missedChargeOn()) return Object.assign({}, o.sch, { missed: Object.assign({ amount: state.oneTime }, missedPeriod()) });
                return o.sch;
            }

            /**
             * Applies a change in the split editor (date or proration checkbox) to state.split.
             * @param {string} field "newStart" | "oldEnd" | "prorate" | "firstCycle" | "lastCycle"
             * @returns {boolean} true when handled (the page must be redrawn)
             */
            function onSplitChange(field, el) {
                const s = state.split;
                if (!s) return false;

                if (field === "newStart") {
                    s.newStart = parseDate(el.value);
                    if (s.newStart) {
                        if (!s.oldEndTouched) s.oldEnd = addDays(s.newStart, -1); // keep the end next to the new start
                        if (!s.flagsTouched) Object.assign(s, defaultSplitFlags(s.newStart));
                    }
                } else if (field === "oldEnd") {
                    s.oldEnd = parseDate(el.value);
                    s.oldEndTouched = true;
                } else if (field === "prorate" || field === "firstCycle" || field === "lastCycle") {
                    s[field] = el.checked;
                    s.flagsTouched = true;
                    if (field === "firstCycle" && s.firstCycle) s.prorate = true; // first cycle proration needs proration on
                    if (field === "prorate" && !s.prorate) s.firstCycle = false;
                } else {
                    return false;
                }
                return true;
            }

            /* ---------- Additional amount (logic) ---------- */

            /** Parses the additional amount input: "" -> 0, negative or not a number -> NaN. */
            function parseAdditional(raw) {
                const s = String(raw).trim();
                if (s === "") return 0;
                const n = Number(s);
                return isFinite(n) && n >= 0 ? round2(n) : NaN;
            }

            /** Handles typing in the additional amount box (charge in `state`): the error, then refreshAmounts(). */
            function onAdditionalInput(raw) {
                state.additionalRaw = raw;
                state.additional = parseAdditional(raw);
                $(fid("addlErr")).hidden = !isNaN(state.additional);
                refreshAmounts();
            }

            /**
             * After typing the extra amount on Step 2 (charge in `state`): updates its warning, the missed-period
             * box, the summary card and the details - not a full render, so the input keeps focus.
             */
            function refreshAmounts() {
                const showWarn = !isNaN(state.additional) && state.additional > 0;
                const warn = $(fid("addlWarn"));
                warn.innerHTML = showWarn ? recurringWarningHtml() : "";
                warn.hidden = !showWarn;
                syncOneTime(); // the recommended missed-period amount follows the new rent
                const missedBox = $(fid("missedBox"));
                if (missedBox) missedBox.outerHTML = missedBoxHtml();
                $(fid("side")).innerHTML = summaryCardHtml();
                $(fid("rvMoreBody")).innerHTML = reviewDetailsHtml();
                renderFooter();
            }

            /* ---------- CPI index values and effective date of the picked increase (logic) ---------- */

            /**
             * CPI entry for the picked history, shown on Step 2: chosen there for a CPI-pending one, and starting
             * from the saved values (changeable) for any other. Each index is set in the index editor popup:
             * picked from the CPI Index rows (linked to that row) or entered manually (not linked):
             *   pending                 CPI-pending (see isCpiPending): nothing saved yet, everything is chosen here
             *   typeId / typeName       CPI type of the lease clause (which CPI Index rows are offered)
             *   prevIndexId             CPI Index row the old (current) index was picked from; null = entered / from the history
             *   prevRaw / prev          old index value (NaN while not set): the history's Previous Index Value,
             *                           else (CPI-pending only) the clause's current index, until changed
             *   prevStored              that stored old index (null when there is none)
             *   indexIdStored           CPI Index row the history is linked to (null when none / CPI-pending)
             *   indexId                 CPI Index row the new index was picked from (starts as indexIdStored); null = entered manually
             *   valueRaw / value        new index value (NaN while not set): the history's New Index Value until changed
             *   valueStored             that stored new index (null when there is none / CPI-pending)
             *   effStored               the history's Adjustment Effective From (null when CPI-pending)
             *   eff                     effective date: effStored, or for a CPI-pending one the day the CPI run
             *                           created the history, until changed
             *   effOpen                 the effective date box is open (Step 2 shows the date as text until "Change")
             * A saved history's clause already holds its NEW index, so the clause is not used as its old index.
             */
            function initCpi(h) {
                const pending = isCpiPending(h),
                    clause = state.clauses[h._array_leaseclause_value] || null,
                    stored = h.array_previousindexvalue != null ? h.array_previousindexvalue : pending && clause ? clause.array_currentindex : null,
                    prevRaw = stored != null ? String(stored) : "",
                    valueStored = !pending && h.array_newindexvalue != null ? Number(h.array_newindexvalue) : null,
                    valueRaw = valueStored != null ? String(valueStored) : "",
                    indexIdStored = (!pending && h._array_cpiindex_value) || null,
                    effStored = pending ? null : parseDate(h.array_adjustmenteffectivefrom);
                return {
                    pending,
                    typeId: (clause && clause._array_cpitype_value) || null,
                    typeName: fv(clause, "array_cpitype"),
                    prevIndexId: null,
                    prevRaw,
                    prev: parseIndex(prevRaw),
                    prevStored: stored != null ? Number(stored) : null,
                    indexIdStored,
                    indexId: indexIdStored,
                    valueRaw,
                    value: parseIndex(valueRaw),
                    valueStored,
                    effStored,
                    eff: pending ? parseDate(h.createdon) : effStored,
                    effOpen: false
                };
            }

            /** CPI Index rows offered for the CPI entry in `state`: the lease clause's CPI type, newest first. */
            function cpiRows() {
                const t = state.cpi.typeId;
                return t ? state.cpiIndexes.filter((r) => r._array_cpitype_value === t) : [];
            }

            /** CPI Index row by id (state.cpi.indexId / prevIndexId), or null. */
            function cpiRow(id) {
                return id ? state.cpiIndexes.find((r) => r.array_cpiindexid === id) || null : null;
            }

            // The two index values ("cpiPrev" = old index, "cpiValue" = new index): the state.cpi keys of their
            // linked CPI Index row, raw text and value, and their name in the popup
            const CPI_BOX = {
                cpiPrev: { id: "prevIndexId", raw: "prevRaw", value: "prev", label: "Old CPI index" },
                cpiValue: { id: "indexId", raw: "valueRaw", value: "value", label: "New CPI index" }
            };

            /** Parses an index value ("104.25" or "104,25"): must be a number greater than 0 (NaN otherwise). */
            function parseIndex(raw) {
                const s = String(raw).trim().replace(",", "."),
                    n = Number(s);
                return s !== "" && isFinite(n) && n > 0 ? n : NaN;
            }

            /** Rent the increase is calculated on: the history's Previous Rent, else the current amount. */
            function cpiBase() {
                const p = getPicked();
                return p && p.array_previousrent != null ? p.array_previousrent : rcAmount();
            }

            /** Index change % = (new - previous) / previous x 100, 4 decimals; null until both are known. */
            function cpiChange() {
                const c = state.cpi;
                if (!c || !(c.prev > 0) || !(c.value > 0)) return null;
                return Math.round(((c.value - c.prev) / c.prev) * 1000000) / 10000;
            }

            /** Plain CPI add-on = rent x new / previous index - rent (as the CPI run calculates it), before the lease limits; null until known. */
            function cpiRawAddOn() {
                const c = state.cpi,
                    base = cpiBase();
                if (!c || !(c.prev > 0) || !(c.value > 0) || base == null) return null;
                return round2((base * c.value) / c.prev - base);
            }

            /** Lease floor / cap of the CPI entry in `state` (see leaseLimits), or null. */
            function cpiLimits() {
                const p = getPicked();
                return p ? leaseLimits(p, cpiBase()) : null;
            }

            /** The plain CPI add-on after the lease floor / cap: { amount, applied } (see applyLimits). */
            function cpiLimitResult() {
                return applyLimits(cpiRawAddOn(), cpiLimits());
            }

            /**
             * Add-on amount used for the new rent and saved on the history: the plain CPI add-on after the lease
             * floor / cap, or without them when the approver unticked "Apply the lease limit"; null until known.
             */
            function cpiAddOn() {
                return state.limitsOn ? cpiLimitResult().amount : cpiRawAddOn();
            }

            /* ---------- Lease floor / cap (logic) ---------- */

            /**
             * Floor and cap of a history's lease clause, worked out as the CPI run's child flow does:
             *   Percentage   Minimum / Maximum Increase % of the rent (`base`)
             *   Flat         Minimum Increase Flat Amount (floor) and Flat Amount (cap)
             * Blank or 0 = no limit; no Increase Type = no limits.
             * @returns {{type: string, min: number, max: number, minPct: number, maxPct: number}|null}
             *          type "pct" | "flat", min / max as amounts (0 = not set); null when there is no limit
             */
            function leaseLimits(h, base) {
                const clause = state.clauses[h._array_leaseclause_value],
                    type = clause && clause.array_increasetypecpirentprocess;
                // A limit value: a positive number, else 0 (not set)
                const num = (v) => (Number(v) > 0 ? Number(v) : 0);
                let lim = null;
                if (type === INCREASE_TYPE.PERCENTAGE) {
                    const minPct = num(clause.array_minimumincreasepercentagecpi),
                        maxPct = num(clause.array_maximumincreasepercentagecpi);
                    // A % of the rent as an amount (0 when the % or the rent is not known)
                    const share = (p) => (p > 0 && base != null ? round2((base * p) / 100) : 0);
                    lim = { type: "pct", minPct, maxPct, min: share(minPct), max: share(maxPct) };
                } else if (type === INCREASE_TYPE.FLAT) {
                    lim = { type: "flat", minPct: 0, maxPct: 0, min: num(clause.array_minimumincreaseflatamountcpi), max: num(clause.array_flatamountcpi) };
                }
                return lim && (lim.min > 0 || lim.max > 0) ? lim : null;
            }

            /**
             * A CPI add-on after the lease floor / cap, with the CPI run's rule: at or below the floor = the floor,
             * else at or above the cap = the cap, else unchanged (so a falling index with a floor still goes up).
             * @returns {{amount: number|null, applied: string|null}} applied = "min" | "max" when a limit changed the amount
             */
            function applyLimits(raw, lim) {
                if (raw == null || !lim) return { amount: raw, applied: null };
                let applied = null;
                if (lim.min > 0 && raw <= lim.min) applied = "min";
                else if (lim.max > 0 && raw >= lim.max) applied = "max";
                const amount = applied ? lim[applied] : raw;
                // Exactly on the limit: nothing was changed
                return { amount, applied: amount === raw ? null : applied };
            }

            /** A limit in words: "3% of the rent (300.00)" for a percentage, "250.00" for a flat amount. */
            function limitValueText(which, lim) {
                return lim.type === "pct" ? numText(lim[which + "Pct"]) + "% of the rent (" + moneyText(lim[which]) + ")" : moneyText(lim[which]);
            }

            /** The limit that changed an amount, in words: "Capped at 3%", "Minimum 2% applied", "Capped at 250.00". */
            function limitTagText(applied, lim) {
                const v = lim.type === "pct" ? numText(lim[applied + "Pct"]) + "%" : moneyText(lim[applied]);
                return applied === "max" ? "Capped at " + v : "Minimum " + v + " applied";
            }

            /**
             * Lease limit the CPI run applied to a saved history: { lim, res } when its saved amount is the floor /
             * cap that its plain CPI amount (from its saved index values) comes to, else null.
             */
            function savedLimit(h) {
                const base = h.array_previousrent != null ? h.array_previousrent : rcAmount(),
                    prev = Number(h.array_previousindexvalue),
                    next = Number(h.array_newindexvalue),
                    stored = storedIncrease(h);
                if (!(prev > 0) || !(next > 0) || base == null || stored == null) return null;
                const lim = leaseLimits(h, base),
                    res = applyLimits(round2((base * next) / prev - base), lim);
                return res.applied && round2(stored) === res.amount ? { lim, res } : null;
            }

            /**
             * Lease limit of a history for its tags (Step 1 table, summary card, Step 3): { lim, res, off }, or null
             * when no limit changed its amount. The picked one being calculated follows Step 2; a saved one counts
             * when the CPI run applied the limit (see savedLimit). off = the approver unticked the limit.
             */
            function historyLimit(h) {
                if (isCpiEntry(h) && cpiIndexEdited()) {
                    const res = cpiLimitResult();
                    return res.applied ? { lim: cpiLimits(), res, off: !state.limitsOn } : null;
                }
                const l = savedLimit(h);
                return l ? { lim: l.lim, res: l.res, off: isCpiEntry(h) && !state.limitsOn } : null;
            }

            /** Lease limit tag of a history in words ("Capped at 3%", "Lease limit off"), or "" (see historyLimit). */
            function historyLimitText(h) {
                const l = historyLimit(h);
                if (!l) return "";
                return l.off ? "Lease limit off" : limitTagText(l.res.applied, l.lim);
            }

            /** Same index value: both missing (NaN / null / 0) or equal. */
            function sameIndex(a, b) {
                return (a > 0 ? Number(a) : null) === (b > 0 ? Number(b) : null);
            }

            /**
             * The CPI increase is calculated from the Step 2 index values: always for a CPI-pending increase,
             * and for a saved one once its old or new index differs from the saved value. False without a CPI entry.
             */
            function cpiIndexEdited() {
                const c = state.cpi;
                return !!c && (c.pending || !sameIndex(c.prev, c.prevStored) || !sameIndex(c.value, c.valueStored));
            }

            /**
             * The CPI increase of the picked one is worked out on Step 2 (else its saved amount is used): CPI-pending,
             * a changed index, or a saved one whose lease limit (applied by the CPI run) the approver unticked.
             */
            function cpiRecalculated() {
                const p = getPicked();
                return cpiIndexEdited() || (!state.limitsOn && !!p && !!savedLimit(p));
            }

            /** The effective date of a saved increase was changed on Step 2. */
            function cpiEffEdited() {
                const c = state.cpi;
                return !!c && !c.pending && isoOrEmpty(c.eff) !== isoOrEmpty(c.effStored);
            }

            /** The approval saves CPI values on the history: CPI-pending, or a saved increase whose index, date or CPI Index link was changed. */
            function cpiWillSave() {
                const c = state.cpi;
                return cpiIndexEdited() || cpiEffEdited() || (!!c && !!c.indexId && c.indexId !== c.indexIdStored);
            }

            /**
             * The approval also sets the lease clause's current index (the next CPI run compares against it):
             * for a CPI-pending increase, and for a saved one whose index was changed. Needs a linked lease clause.
             */
            function cpiUpdatesClause() {
                const p = getPicked();
                return cpiIndexEdited() && !!p && !!p._array_leaseclause_value;
            }

            /** What was changed on a saved increase, in words, e.g. "new index 118.4 to 122.1" ([] for a CPI-pending one). */
            function cpiChangeList() {
                const c = state.cpi,
                    list = [];
                if (!c || c.pending) return list;
                // An index value in words ("not set" when missing)
                const idx = (v) => (v > 0 ? numText(v) : "not set");
                if (!sameIndex(c.prev, c.prevStored)) list.push("old index " + idx(c.prevStored) + " to " + idx(c.prev));
                if (!sameIndex(c.value, c.valueStored)) list.push("new index " + idx(c.valueStored) + " to " + idx(c.value));
                if (cpiEffEdited()) list.push("effective date " + dateText(c.effStored) + " to " + dateText(c.eff));
                return list;
            }

            /**
             * What the CPI entry still needs, in plain words ([] = complete). Both index values are needed once the
             * increase is calculated from them (CPI-pending or a changed index); a saved, unchanged one keeps its amount.
             */
            function cpiTodo() {
                const c = state.cpi,
                    list = [];
                if (!c) return list;
                if (cpiIndexEdited()) {
                    if (!(c.prev > 0)) list.push("Choose the old CPI index.");
                    if (!(c.value > 0)) list.push("Choose the new CPI index.");
                }
                if (!c.eff) list.push("Enter the date the increase is effective from.");
                return list;
            }

            /** Why the CPI entry can't be used yet (the first of cpiTodo), or null. */
            function cpiError() {
                return cpiTodo()[0] || null;
            }

            /**
             * "Undo changes" on a saved increase: puts back the saved index values and effective date. The start
             * options are rebuilt only when the date changes back (they depend on it); otherwise only the recommended
             * missed-period amount follows the rent.
             */
            function undoCpiChanges() {
                const effChanged = cpiEffEdited();
                state.cpi = initCpi(getPicked());
                if (effChanged) resetStart();
                else syncOneTime();
            }

            /**
             * Why the popup has no CPI list for the CPI entry in `state` ("" when it has one): the CPI indices
             * could not be loaded, the lease clause has no CPI type, or no recent index exists.
             */
            function cpiNoListReason() {
                const c = state.cpi;
                if (state.cpiLoadFailed) return "The CPI indices couldn't be loaded, so enter the value manually.";
                if (!c.typeId) return "The lease clause has no CPI type, so there is no list to pick from. Enter the value manually.";
                if (!cpiRows().length) return "No " + (c.typeName || "CPI") + " index from the last " + CPI_INDEX_MONTHS + " months was found. Enter the value manually.";
                return "";
            }

            /** Effective date changed: the start options depend on it (the page must be redrawn). */
            function onCpiEffChange(value) {
                state.cpi.eff = parseDate(value);
                resetStart();
            }

            /* ---------- Missed-period charge: one-time charge for the period billed at the old rent (logic) ---------- */

            /**
             * Recommended missed-period amount: (revised - current rent) x billing cycles touched by the missed
             * period. Whole cycles, no day proration. 0 when there is no missed period.
             */
            function recommendedMissed() {
                const m = missedPeriod(),
                    diff = newAmount() != null && rcAmount() != null ? newAmount() - rcAmount() : 0;
                if (!m || diff <= 0) return 0;
                return round2(m.cycles * diff);
            }

            /** Keeps the missed-period amount on the recommended value until the approver types their own. */
            function syncOneTime() {
                if (state.oneTimeTouched) return;
                const rec = recommendedMissed();
                state.oneTime = rec;
                state.oneTimeRaw = rec ? String(rec) : "";
            }

            /** Parses the missed-period amount: must be a number greater than 0 (NaN otherwise). */
            function parseOneTime(raw) {
                const s = String(raw).trim(),
                    n = Number(s);
                return s !== "" && isFinite(n) && n > 0 ? round2(n) : NaN;
            }

            /** Why the missed-period amount can't be used, or null (also null when no missed-period charge is made). */
            function oneTimeError() {
                return missedChargeOn() && !(state.oneTime > 0) ? "Enter a missed-period amount greater than 0, or untick Charge the missed period." : null;
            }

            /**
             * Handles typing in the missed-period amount box: updates the error, the summary card, the details
             * and the footer (not a full render, so the input keeps focus).
             */
            function onOneTimeInput(raw) {
                state.oneTimeRaw = raw;
                state.oneTime = parseOneTime(raw);
                state.oneTimeTouched = true;
                $(fid("oneTimeErr")).hidden = !oneTimeError();
                $(fid("side")).innerHTML = summaryCardHtml();
                $(fid("rvMoreBody")).innerHTML = reviewDetailsHtml();
                renderFooter();
            }

            /** Bulk: sets each approving charge's extra amount to its nearest never-applied increase. */
            function useAllOutstanding() {
                state.charges.forEach((ch, i) => {
                    if (ch.loadError || ch.decision !== "approve") return;
                    withCharge(i, () => {
                        const prev = nearestOlder();
                        if (prev && increase(prev) != null) {
                            state.additionalRaw = String(increase(prev));
                            state.additional = parseAdditional(state.additionalRaw);
                            state.extraOpen = true;
                            syncOneTime();
                        }
                    });
                });
            }

            /* ---------- Step 2 rendering ----------
               Questions on the left - only the ones that apply, numbered, in plain words - and a live summary
               card on the right ("What changes"). Nothing turns red before the approver has typed something:
               what is still missing is listed in the summary card instead. */

            // Rent wording per billing frequency (FREQ label): "Monthly rent", "per month"
            const FREQ_WORDS = {
                Monthly: { rent: "Monthly rent", per: "per month" },
                Quarterly: { rent: "Quarterly rent", per: "per quarter" },
                Annual: { rent: "Annual rent", per: "per year" },
                Weekly: { rent: "Weekly rent", per: "per week" },
                Daily: { rent: "Daily rent", per: "per day" }
            };

            /** Rent wording for the charge in `state`: { rent, per }; generic words when the cycle is unknown. */
            function freqWords() {
                const label = state.cycle ? state.cycle.freq.label : "";
                return FREQ_WORDS[label] || { rent: "Rent", per: "per billing cycle" };
            }

            /** Amount with its sign (HTML): "+EUR 33.33" for an increase; a decrease keeps its minus sign. */
            function signedMoney(v) {
                return (v > 0 ? "+" : "") + money(v);
            }

            /** Old vs new charge side by side (under "Show details" on Review and Confirm). */
            function compareHtml(sch) {
                const c = state.cycle,
                    rc = state.oldRc,
                    f = sch.flags;
                // Definition list of [label, valueHtml] rows (null rows are left out)
                const dl = (rows) =>
                    '<dl class="cmp-dl">' + rows.filter(Boolean).map((r) => "<dt>" + esc(r[0]) + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>";

                const oldCol = dl([
                    ["Bills until", sch.oldBills ? "<strong>" + showDate(sch.oldEnd) + "</strong>" : "nothing more in this cycle"],
                    ["End date", "<strong>" + showDate(sch.oldEnd) + "</strong>"],
                    sch.oldFreqStart ? ["Last cycle", range(sch.oldFreqStart, sch.oldEnd)] : null,
                    ["Next invoice", sch.clearOldUpcoming ? '<span class="hint">cleared, the new charge takes it over</span>' : showDate(c.upcoming || c.gen)],
                    f ? ["Last cycle proration", f.lastCycle ? "On" : "Off"] : null,
                    ["Status", "Stays Active"]
                ]);

                const newCol = dl([
                    ["Starts", "<strong>" + showDate(sch.newStart) + "</strong>"],
                    ["First cycle", range(sch.freqStart, sch.freqEnd)],
                    ["Next invoice", showDate(sch.invoiceGenDate)],
                    // Same date as Next invoice: the billing flow keeps both fields equal and rolls them on from Upcoming
                    ["Upcoming invoice", showDate(sch.upcomingGenDate)],
                    f ? ["Proration", f.prorate ? "On" : "Off"] : null,
                    f ? ["First cycle proration", f.firstCycle ? "On" : "Off"] : null,
                    ["Then", esc(c.freq.label.toLowerCase()) + " from " + showDate(addDays(sch.freqEnd, 1))]
                ]);

                return (
                    '<div class="cmp">' +
                    '<div class="cmp-col old"><div class="cmp-h">Current charge<span class="dot"></span>' + esc(rc.array_chargename || "") + "</div>" +
                    '<div class="cmp-amt amt-old">' + money(rcAmount()) + "</div>" + oldCol + "</div>" +
                    '<div class="cmp-arrow">' + icon("arrowRight") + "</div>" +
                    '<div class="cmp-col new"><div class="cmp-h">New charge</div>' +
                    '<div class="cmp-amt amt-new">' + money(newAmount()) + "</div>" + newCol + "</div>" +
                    "</div>"
                );
            }

            /** Bar over the split cycle: old rent | not billed | new rent (split editor and Confirm). */
            function timelineHtml(sch) {
                const c = state.cycle,
                    segs = [];
                const oldTo = sch.oldBills ? sch.oldEnd : null;
                if (oldTo) segs.push({ cls: "old", from: c.fs, to: oldTo, label: "Old rent " + moneyText(rcAmount()) });
                const gapFrom = oldTo ? addDays(oldTo, 1) : c.fs,
                    gapTo = addDays(sch.newStart, -1);
                if (gapFrom <= gapTo) segs.push({ cls: "gap", from: gapFrom, to: gapTo, label: "Not billed" });
                segs.push({ cls: "new", from: sch.newStart, to: c.fe, label: "New rent " + moneyText(newAmount()) });
                // Days in a piece; a piece shows its label in the bar only when it is wide enough to fit it
                const days = (s) => daysBetween(s.from, s.to) + 1,
                    total = daysBetween(c.fs, c.fe) + 1,
                    fits = (s) => days(s) / total >= 0.3;
                return (
                    '<div class="timeline">' +
                    segs
                        .map(
                            (s) =>
                                '<div class="seg ' + s.cls + '" style="flex:' + days(s) + '" title="' +
                                esc(s.label + ": " + dateText(s.from) + TXT.RANGE + dateText(s.to)) + '">' + (fits(s) ? esc(s.label) : "") + "</div>"
                        )
                        .join("") +
                    "</div>" +
                    '<div class="timeline-scale"><span>' + showDate(c.fs) + "</span><span>Billing cycle being split</span><span>" + showDate(c.fe) + "</span></div>" +
                    // Key: every piece in full, however short
                    '<ul class="timeline-legend">' +
                    segs
                        .map((s) => '<li><span class="seg ' + s.cls + '"></span><strong>' + esc(s.label) + "</strong> " + range(s.from, s.to) + " (" + plural(days(s), "day") + ")</li>")
                        .join("") +
                    "</ul>"
                );
            }

            /* ---------- Question: when does the new rent start? (option cards + missed-period box) ---------- */

            /** Start options in display order: the recommended one ("Next billing cycle") first. */
            function orderedOptions() {
                return state.options.slice().sort((a, b) => (b.isDefault ? 1 : 0) - (a.isDefault ? 1 : 0));
            }

            /** Start date of option o (the split start follows the split editor). */
            function optionStart(o) {
                return o.key === "split" ? (state.split && state.split.newStart) || o.defaultStart : o.sch.newStart;
            }

            /** Description (HTML) of option o: what happens to the current cycle, and its missed period. */
            function startText(o) {
                const c = state.cycle;
                if (o.key === "split") {
                    const s = state.split || {},
                        start = optionStart(o);
                    return "Old rent until " + showDate(s.oldEnd || addDays(start, -1)) + ", new rent from " + showDate(start) + ". This splits the current billing cycle.";
                }
                const m = o.isDefault ? missedPeriod() : null,
                    missedText = m ? " Missed period: " + range(m.from, m.to) + " (" + plural(m.cycles, "cycle") + ")." : "";
                if (o.key === "current") {
                    return (
                        (o.effectiveBeforeCycle ? "The cycle with the effective date is already invoiced. " : "") +
                        "New rent from the next cycle still to be invoiced (" + range(c.fs, c.fe) + ")." + missedText
                    );
                }
                return (
                    (o.splitClosed ? o.splitClosed + " " : "") +
                    (o.effectiveLater ? "The effective date " + showDate(o.effectiveLater) + " is after the current cycle. " : "") +
                    "The current cycle " + range(c.fs, c.fe) + " stays at the old rent." + missedText
                );
            }

            /**
             * One start option card: name, start date, description. The chosen split shows the split editor;
             * the chosen "Next billing cycle" shows its missed-period box.
             * @param {boolean} only true when it is the only option (shown selected, not clickable)
             */
            function optionHtml(o, only) {
                const sel = state.startMode === o.key;
                return (
                    '<div class="opt' + (sel ? " sel" : "") + (only ? " only" : "") + '" data-mode="' + o.key + '" role="radio" aria-checked="' + sel + '">' +
                    '<div class="opt-head"><input type="radio" name="' + fid("startMode") + '" tabindex="-1"' + (sel ? " checked" : "") + " />" +
                    '<div><div class="opt-title">' + esc(MODE_LABEL[o.key]) + ' <span class="opt-date">from ' + showDate(optionStart(o)) + "</span>" +
                    (o.isDefault ? ' <span class="badge latest">Recommended</span>' : "") + "</div>" +
                    '<div class="opt-desc">' + startText(o) + "</div></div></div>" +
                    (sel && o.key === "split" ? renderSplitEditor() : "") +
                    (sel && o.isDefault ? missedBoxHtml() : "") +
                    "</div>"
                );
            }

            /** Body of "When does the new rent start?" (HTML): the option cards, or why the increase can't be applied. */
            function startQuestionBody() {
                const c = state.cycle,
                    opts = orderedOptions();
                if (!c) return '<p class="q-text">This charge can&#39;t be approved, so there is no start date to choose. You can still reject the increase.</p>';
                if (!opts.length) {
                    return msgBox("info", "The charge ends on " + showDate(c.chargeEnd) + ", so there is no time left to apply this increase. You can reject it instead.");
                }
                return opts.map((o) => optionHtml(o, opts.length === 1)).join("");
            }

            /** Checkbox with label and optional hint (HTML) for the split editor. */
            function checkHtml(id, label, checked, hint) {
                return (
                    '<label class="check"><input type="checkbox" id="' + id + '"' + (checked ? " checked" : "") + " />" +
                    "<span>" + esc(label) + (hint ? '<br /><span class="hint">' + hint + "</span>" : "") + "</span></label>"
                );
            }

            /**
             * Split editor: the timeline and any problems with the dates; the dates and proration themselves sit
             * behind "Change dates and proration" (the suggested values are usually right).
             */
            function renderSplitEditor() {
                const c = state.cycle,
                    s = state.split,
                    chk = splitCheck();
                const sch = chk.error ? null : splitSchedule();
                const oldBills = !!s.oldEnd && s.oldEnd >= c.fs;
                const newMax = c.chargeEnd && c.chargeEnd < c.fe ? c.chargeEnd : c.fe;
                const editor =
                    '<div class="split-grid">' +
                    '<div class="split-col"><h4>Old rent <span class="amt-old">' + money(rcAmount()) + "</span></h4>" +
                    '<div class="field-sm"><label class="lbl" for="' + fid("oldEnd") + '">Last day at the old rent</label>' +
                    '<input type="date" class="input-date" id="' + fid("oldEnd") + '" value="' + isoOrEmpty(s.oldEnd) + '" min="' + isoDate(addDays(c.fs, -1)) + '" max="' + isoDate(c.fe) + '" /></div>' +
                    checkHtml(fid("lastCycle"), "Last cycle proration", s.lastCycle, oldBills ? "Also turns on Proration for the current charge." : "Not used: the current charge bills nothing in this cycle.") +
                    "</div>" +
                    '<div class="split-col"><h4>New rent <span class="amt-new">' + money(newAmount()) + "</span></h4>" +
                    '<div class="field-sm"><label class="lbl" for="' + fid("newStart") + '">First day at the new rent</label>' +
                    '<input type="date" class="input-date" id="' + fid("newStart") + '" value="' + isoOrEmpty(s.newStart) + '" min="' + isoDate(c.fs) + '" max="' + isoDate(newMax) + '" /></div>' +
                    checkHtml(fid("prorate"), "Proration enabled", s.prorate) +
                    checkHtml(fid("firstCycle"), "First cycle proration", s.firstCycle) +
                    "</div>" +
                    "</div>" +
                    '<div class="split-foot"><button type="button" class="link-btn" data-act="splitReset">Reset to the suggested dates</button></div>';
                return (
                    '<div class="split-box">' +
                    (sch ? timelineHtml(sch) : "") +
                    (chk.error ? '<div class="field-err">' + chk.error + "</div>" : "") +
                    chk.warnings.map((w) => msgBox("warn", w)).join("") +
                    detailsHtml(fid("splitMore"), "Change dates and proration", editor) +
                    "</div>"
                );
            }

            /** True when the chosen start is "Next billing cycle" and it leaves a missed period (days billed at the old rent). */
            function missedApplies() {
                const o = baseOption();
                return !!o && state.startMode === o.key && !!missedPeriod();
            }

            /**
             * Missed-period box inside the chosen "Next billing cycle" card (HTML; redrawn when the rent changes):
             * the tick box (ticked by default) to charge the missed period once, then the amount with the
             * recommended value - or, unticked, how much rent is not collected.
             */
            function missedBoxHtml() {
                const m = missedPeriod(),
                    id = ' id="' + fid("missedBox") + '"';
                if (!m) return '<div class="ot-box"' + id + '><span class="hint">No missed period: the new rent starts on the effective date.</span></div>';
                const known = newAmount() != null && rcAmount() != null,
                    diff = known ? round2(newAmount() - rcAmount()) : null,
                    rec = recommendedMissed();
                let body;
                if (!state.missedOn) {
                    body = '<div class="hint ot-note">Not charged: about ' + money(diff != null ? round2(m.cycles * diff) : null) + " of rent is not collected.</div>";
                } else if (!known) {
                    body = '<div class="hint ot-note">The amount shows once the new index is chosen.</div>';
                } else {
                    body =
                        '<div class="ot-amt"><label for="' + fid("oneTime") + '">Missed-period amount' + (state.symbol ? " (" + esc(state.symbol) + ")" : "") + "</label>" +
                        '<div class="ot-row"><input class="input-num" id="' + fid("oneTime") + '" type="number" min="0" step="0.01" value="' + esc(state.oneTimeRaw) + '" />' +
                        (rec ? '<button type="button" class="link-btn" data-act="useRec" data-amount="' + rec + '">Use recommended ' + money(rec) + "</button>" : "") +
                        "</div>" +
                        '<div class="field-err" id="' + fid("oneTimeErr") + '"' + (oneTimeError() ? "" : " hidden") + ">Enter an amount greater than 0, or untick the box.</div>" +
                        '<div class="hint ot-note">' +
                        (rec
                            ? "Recommended = " + plural(m.cycles, "cycle") + " " + TXT.TIMES + " " + money(diff) + " (new rent - old rent). Invoiced on " + showDate(m.invoiceDate) + " with the next regular invoice."
                            : "The new rent is not higher than the old rent, so there is nothing to recommend.") +
                        "</div></div>";
                }
                return (
                    '<div class="ot-box"' + id + ">" +
                    '<label class="check first"><input type="checkbox" id="' + fid("missedOn") + '"' + (state.missedOn ? " checked" : "") + " />" +
                    "<span><strong>Charge the missed period</strong> " + range(m.from, m.to) + " (" + plural(m.cycles, "cycle") + " billed at the old rent) as a one-time charge</span></label>" +
                    body +
                    "</div>"
                );
            }

            /* ---------- Optional: extra amount ---------- */

            /** Warning shown while an extra amount is entered: it is billed every cycle, not once (icon + text). */
            function recurringWarningHtml() {
                return (
                    icon("warn") +
                    "<div><strong>Added to every bill, not just once.</strong> The new rent will be <strong>" + money(newAmount()) + "</strong> " + esc(freqWords().per) + ".</div>"
                );
            }

            /**
             * Optional extra amount (HTML): a note about an older increase that was never applied (with a link that
             * adds its amount), then a link that opens the amount box - or the box with its warning when open.
             */
            function extraHtml() {
                const prev = nearestOlder(),
                    older = olderSelectable(),
                    open = state.extraOpen || effectiveAdditional() > 0 || isNaN(state.additional),
                    showWarn = !isNaN(state.additional) && state.additional > 0;
                const note = prev
                    ? '<div class="note">' + icon("info") + "<div><strong>" + esc(hname(prev)) + "</strong>, an older increase" +
                    (increase(prev) != null ? " of " + money(increase(prev)) : " whose CPI index was never chosen") +
                    ", was never applied. It will be closed as Missed" + (older.length > 1 ? ", together with " + plural(older.length - 1, "older increase") : "") + ". " +
                    (increase(prev) != null
                        ? '<button type="button" class="link-btn" data-act="usePrev" data-amount="' + esc(increase(prev)) + '">Add its ' + money(increase(prev)) + " to the new rent</button>"
                        : "") +
                    "</div></div>"
                    : "";
                const box = open
                    ? '<div class="field-sm extra-box"><label class="lbl" for="' + fid("addl") + '">Extra amount ' + esc(freqWords().per) + (state.symbol ? " (" + esc(state.symbol) + ")" : "") + "</label>" +
                    '<input class="input-num" id="' + fid("addl") + '" type="number" min="0" step="0.01" value="' + esc(state.additionalRaw) + '" /></div>' +
                    '<div class="field-err" id="' + fid("addlErr") + '"' + (isNaN(state.additional) ? "" : " hidden") + ">Enter an amount of 0 or more.</div>" +
                    '<div class="warn-box" id="' + fid("addlWarn") + '"' + (showWarn ? "" : " hidden") + ">" + (showWarn ? recurringWarningHtml() : "") + "</div>"
                    : '<button type="button" class="link-btn" data-act="extraOpen">Add an extra amount to the rent</button>';
                return questionHtml(
                    null,
                    'Add anything extra?<span class="q-opt">Optional</span>',
                    '<p class="q-desc">Only needed to add an amount on top of the CPI increase.</p>' + note + box
                );
            }

            /* ---------- Question: the CPI index and effective date (chosen when CPI-pending, else checked / changed) ---------- */

            /**
             * Calculation of the CPI increase (HTML, under "Show details"): old to new index and the formula, the
             * lease floor / cap when one changed it, plus a note when the old index differs from the one saved with
             * this increase.
             */
            function cpiCalcHtml() {
                const c = state.cpi,
                    base = cpiBase(),
                    res = cpiLimitResult();
                if (!(c.prev > 0) || !(c.value > 0)) return "";
                let html =
                    "Index " + esc(numText(c.prev)) + " " + icon("arrowRight", "sm") + " " + esc(numText(c.value)) + " (" + pct(cpiChange()) + "). " +
                    "CPI increase = " + money(base) + " " + TXT.TIMES + " " + esc(numText(c.value)) + " / " + esc(numText(c.prev)) + " - " + money(base) +
                    " = <strong>" + money(cpiRawAddOn()) + "</strong>";
                if (res.applied) {
                    html +=
                        "; " + esc(limitTagText(res.applied, cpiLimits()).toLowerCase()) + " = <strong>" + money(res.amount) + "</strong>" +
                        (state.limitsOn ? "" : " (not applied)");
                }
                if (c.prevStored != null && c.prev !== c.prevStored) {
                    html += "<br />The old index was changed from " + esc(numText(c.prevStored)) + " (the value saved with this increase).";
                }
                return html;
            }

            /** Where an index value came from, in words: "CPI index Sep 2026" (linked row), "saved with this increase", "entered manually", or "" when not set. */
            function cpiSourceText(field) {
                const c = state.cpi,
                    k = CPI_BOX[field],
                    row = cpiRow(c[k.id]);
                if (row) return "CPI index " + monthText(parseDate(row.array_perioddate));
                if (!(c[k.value] > 0)) return "";
                return sameIndex(c[k.value], field === "cpiPrev" ? c.prevStored : c.valueStored) ? "saved with this increase" : "entered manually";
            }

            /** Where an index value came from (HTML): cpiSourceText (with a check when linked to a CPI Index row), or a prompt when not set. */
            function cpiSourceHtml(field) {
                const text = cpiSourceText(field);
                if (cpiRow(state.cpi[CPI_BOX[field].id])) return '<span class="linked">' + icon("check", "sm") + esc(text) + "</span>";
                if (!text) return field === "cpiPrev" ? "Not set" : "Pick it from the list or type it";
                return esc(text.charAt(0).toUpperCase() + text.slice(1));
            }

            /** The new index button (HTML): the value and where it came from, or "Choose new index"; opens the index editor popup. */
            function newIndexButtonHtml() {
                const c = state.cpi,
                    has = c.value > 0;
                return (
                    '<button type="button" class="idx-tile' + (has ? "" : " unset") + '" id="' + fid("cpiValue") + '" data-act="idxEdit" data-field="cpiValue" aria-haspopup="dialog">' +
                    '<span class="idx-main"><span class="idx-value">' + (has ? esc(numText(c.value)) : "Choose new index") + "</span>" +
                    '<span class="idx-src">' + cpiSourceHtml("cpiValue") + "</span></span>" +
                    '<span class="idx-edit">' + icon("edit") + "</span></button>"
                );
            }

            /**
             * Note under the CPI question of a saved increase whose values were changed (HTML; "" otherwise): what was
             * changed, the recalculated CPI increase, and an "Undo changes" link.
             */
            function cpiChangedNoteHtml() {
                const p = getPicked(),
                    changes = cpiChangeList();
                if (!changes.length) return "";
                const recalc = cpiIndexEdited()
                    ? " The CPI increase is recalculated: " + money(storedIncrease(p)) + " " + icon("arrowRight", "sm") + " <strong>" + money(cpiAddOn()) + "</strong>."
                    : "";
                return (
                    '<div class="note">' + icon("info") + "<div>Changed from the saved values: " + esc(changes.join("; ")) + "." + recalc + " " +
                    '<button type="button" class="link-btn" data-act="cpiUndo">Undo changes</button></div></div>'
                );
            }

            /**
             * Body of the CPI question (HTML): the old index as text (with a Change link), the new index button,
             * the effective date (text with a Change link, or the date box), what the change means, and for a saved
             * increase whose values were changed the note with "Undo changes".
             */
            function cpiQuestionBody() {
                const c = state.cpi,
                    change = indexChange(getPicked());
                const eff =
                    c.effOpen || !c.eff
                        ? '<div class="q-meta eff-edit"><label class="lbl" for="' + fid("cpiEff") + '">Effective from</label>' +
                        '<input type="date" class="input-date" id="' + fid("cpiEff") + '" value="' + isoOrEmpty(c.eff) + '" />' +
                        (c.eff ? '<button type="button" class="link-btn" data-act="effDone">Done</button>' : "") + "</div>"
                        : '<div class="q-meta">Effective from <strong>' + showDate(c.eff) + '</strong> <button type="button" class="link-btn" data-act="effEdit">Change</button></div>';
                let result = "";
                if (change != null) {
                    const p = getPicked(),
                        inc = increase(p),
                        lim = historyLimit(p);
                    // Index down or unchanged, but the lease minimum gives an increase - or a saved increase with no limit to explain it
                    const floor = change <= 0 && inc > 0 && !!lim && !lim.off && lim.res.applied === "min",
                        mismatch = change <= 0 && inc > 0 && !floor;
                    let why = "so the rent " + (change < 0 ? "goes down" : "does not change");
                    if (floor) why = "but the lease minimum applies, so the rent still goes up";
                    else if (mismatch) why = "but the saved CPI increase is " + signedMoney(inc) + ". Check the amount before approving";
                    result =
                        change > 0
                            ? '<div class="q-result ok">' + icon("check") + "<span>The index goes up by <strong>" + pct(change) + "</strong>.</span></div>"
                            : '<div class="q-result warn">' + icon("warn") + "<span>The new index is " + (change < 0 ? "lower than" : "the same as") + " the old one, " + why + ".</span></div>";
                }
                const type = c.typeName ? " (" + esc(c.typeName) + ")" : "";
                return (
                    (c.pending
                        ? '<p class="q-desc">This increase was created before the CPI index was published, so choose it here' + type + ".</p>"
                        : '<p class="q-desc">Saved with this increase' + type + ". Change the index or date only if they are wrong; the CPI increase is then recalculated.</p>") +
                    '<div class="idx-line">' +
                    '<div class="idx-old"><span class="lbl-sm">Old index</span><span class="idx-num">' + (c.prev > 0 ? esc(numText(c.prev)) : TXT.EMPTY) + "</span>" +
                    '<span class="idx-src">' + cpiSourceHtml("cpiPrev") +
                    ' <button type="button" class="link-btn" id="' + fid("cpiPrev") + '" data-act="idxEdit" data-field="cpiPrev" aria-haspopup="dialog">Change</button></span></div>' +
                    '<span class="idx-arrow">' + icon("arrowRight") + "</span>" +
                    '<div class="idx-new"><span class="lbl-sm">New index</span>' + newIndexButtonHtml() + "</div>" +
                    "</div>" +
                    eff +
                    result +
                    limitsHtml() +
                    cpiChangedNoteHtml()
                );
            }

            /**
             * Lease floor / cap under the CPI question (HTML; "" when the lease clause has none): the limits and,
             * when one changes the CPI increase, the "Apply the lease minimum / maximum" tick box (ticked by
             * default): for an increase calculated here (CPI-pending or a changed index), or a saved one the CPI run
             * limited (ticked keeps the saved amount; unticked uses the plain CPI amount).
             */
            function limitsHtml() {
                const lim = cpiLimits();
                if (!lim) return "";
                const parts = [];
                if (lim.min > 0) parts.push("minimum " + limitValueText("min", lim));
                if (lim.max > 0) parts.push("maximum " + limitValueText("max", lim));
                let body = "<strong>Lease limits on the CPI increase:</strong> " + esc(parts.join(", ")) + ".";
                if (lim.min > 0 && lim.max > 0 && lim.min > lim.max) body += ' <span class="lim-warn">The minimum is higher than the maximum. Check the lease clause.</span>';
                // The limit that changes the amount: calculated here (CPI-pending / changed index), or applied by the CPI run (saved)
                const saved = cpiIndexEdited() ? null : savedLimit(getPicked()),
                    res = saved ? saved.res : cpiIndexEdited() ? cpiLimitResult() : null;
                if (res && res.applied) {
                    const name = res.applied === "max" ? "maximum" : "minimum",
                        raw = cpiRawAddOn(),
                        // The plain CPI amount in words: "an increase of 312.50" / "a fall of 118.24"
                        rawText = raw < 0 ? "a fall of " + money(-raw) : "an increase of " + money(raw);
                    body +=
                        '<label class="check"><input type="checkbox" id="' + fid("limitsOn") + '"' + (state.limitsOn ? " checked" : "") + " />" +
                        "<span><strong>Apply the lease " + name + "</strong><br />" +
                        '<span class="hint">' + (saved ? "The CPI run applied it: the" : "The") + " CPI index gives " + rawText + "; the lease " + name +
                        " makes it an increase of " + money(res.amount) + (saved ? " (the saved amount)" : "") + ". " +
                        (state.limitsOn ? "Untick to use the CPI amount instead." : "Unticked: the CPI amount is used.") +
                        "</span></span></label>";
                }
                return '<div class="lim">' + icon("info") + "<div>" + body + "</div></div>";
            }

            /* ---------- Layout: questions + live summary card ---------- */

            /**
             * One Step 2 question (HTML): a number bubble ("+" for an optional one), the title and the body.
             * @param {number|null} no question number; null = optional
             */
            function questionHtml(no, titleHtml, bodyHtml) {
                return (
                    '<section class="q"><span class="q-no' + (no ? "" : " opt") + '" aria-hidden="true">' + (no || "+") + "</span>" +
                    '<div class="q-main"><h4 class="q-title">' + titleHtml + "</h4>" + bodyHtml + "</div></section>"
                );
            }

            /** What still has to be done on Step 2 for the charge in `state`, in plain words (empty = ready to continue). */
            function stepTwoTodo() {
                if (state.blocker) return ["This charge can't be approved (see the message above). You can still reject the increase."];
                const list = cpiTodo();
                if (!state.options.length) list.push("There is no time left on this charge to apply the increase. Reject it instead.");
                else if (!getSchedule()) list.push(state.startMode === "split" ? "Check the split dates." : "Choose when the new rent starts.");
                if (isNaN(state.additional)) list.push("Enter an extra amount of 0 or more.");
                if (oneTimeError() && newAmount() != null) list.push("Enter the missed-period amount, or untick Charge the missed period."); // recommended once the rent is known
                return list;
            }

            /**
             * Live summary card on the right of Step 2 (HTML; redrawn when an amount changes): the new rent in large
             * type with the old rent and the change, when it starts, what it is made of, the missed-period charge,
             * older increases that will be closed, and what is still missing.
             */
            function summaryCardHtml() {
                const p = getPicked(),
                    sch = getSchedule(),
                    w = freqWords(),
                    eff = p ? effDate(p) : null,
                    oldRent = rcAmount(),
                    newRent = newAmount(),
                    additional = effectiveAdditional(),
                    older = olderSelectable(),
                    todo = stepTwoTodo();
                // One label / value row of the card
                const row = (label, valueHtml) => "<dt>" + esc(label) + "</dt><dd>" + valueHtml + "</dd>";

                let head;
                if (newRent == null) {
                    head =
                        '<div class="sc-k">' + esc(w.rent) + " now</div>" +
                        '<div class="sc-amt">' + money(oldRent) + "</div>" +
                        '<div class="sc-sub">The new rent shows once the new index is chosen.</div>';
                } else {
                    const diff = round2(newRent - oldRent),
                        share = oldRent ? round2((diff / oldRent) * 100) : null;
                    head =
                        '<div class="sc-k">New ' + esc(w.rent.toLowerCase()) + "</div>" +
                        '<div class="sc-amt amt-new">' + money(newRent) + "</div>" +
                        '<div class="sc-sub">was ' + money(oldRent) + '<span class="dot"></span>' + signedMoney(diff) +
                        (share != null ? " (" + (diff > 0 ? "+" : "") + esc(numText(share)) + "%)" : "") + "</div>";
                }

                let rows = row(
                    "Starts on",
                    sch ? showDate(sch.newStart) + (sch.newStart < todayDate() ? ' <span class="sc-warn">(in the past)</span>' : "") : '<span class="sc-none">not chosen yet</span>'
                );
                // The parts of the new rent and the missed-period charge only exist once the new rent is known
                if (newRent != null) {
                    rows += row("CPI increase", signedMoney(increase(p)) + limitTagHtml(p));
                    if (additional > 0) rows += row("Extra amount", signedMoney(additional));
                    if (sch && sch.missed) rows += row("Missed-period charge", money(sch.missed.amount));
                    else if (missedApplies() && !state.missedOn) rows += row("Missed-period charge", '<span class="sc-none">not charged</span>');
                }

                let notes = "";
                if (sch && eff && sch.newStart < eff) {
                    notes += '<div class="sc-note warn">' + icon("warn") + "<span>The new rent starts " + plural(daysBetween(sch.newStart, eff), "day") + " before the effective date.</span></div>";
                }
                if (older.length) {
                    notes +=
                        '<div class="sc-note">' + icon("info") + "<span>" + esc(older.map(hname).join(", ")) + (older.length === 1 ? " was" : " were") +
                        " never applied and will be closed as Missed.</span></div>";
                }

                const status = todo.length
                    ? '<div class="sc-todo"><strong>To continue:</strong><ul>' + todo.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul></div>"
                    : '<div class="sc-ready">' + icon("check") + "<span>" + (isBulk() ? "Ready" : "Ready. Click Next to check and approve.") + "</span></div>";

                return '<div class="sc"><div class="sc-h">What changes</div>' + head + '<dl class="sc-rows">' + rows + "</dl>" + notes + status + "</div>";
            }

            /**
             * Summary points for the charge in `state` (Step 3 and the bulk Confirm rows): the effective date, when
             * the new rent starts, and what happens to the days in between. Each line has an icon: a dot
             * (information), a warning (rent not collected, date in the past) or a check (nothing lost).
             */
            function impactHtml() {
                const p = getPicked(),
                    ch = state.charges[state.active],
                    sch = getSchedule(),
                    eff = effDate(p),
                    change = indexChange(p),
                    diff = newAmount() != null && rcAmount() != null ? round2(newAmount() - rcAmount()) : null;
                // One summary point with its icon (cls: "" | "warn" | "ok")
                const li = (html, cls) =>
