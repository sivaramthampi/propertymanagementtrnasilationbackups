<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPI Rent Increase Approval</title>
    <!--
      CPI Rent Increase Approval - HTML web resource (array_CPIApprovalUI)
      Opened as a dialog by the CPI Approval button script (array_CPIApprovalButton.js),
      from the view buttons or the form button.

      This file holds everything:
        styles : 1 theme & base, 2 page frame, 3 shared blocks, 4 bulk approval, 5 Step 1,
                 6 Step 2, 7 index editor popup, 8 Step 3, 9 result, 10 compact (laptop-size dialogs)
        body   : the static page frame (header, banners, content, footer buttons, popup, loading overlay)
        script : the logic - see the overview at the top of the script

      ENCODING - keep this file plain ASCII.
        Icons are inline SVG (see ICONS in the script) and special characters are built from their
        codes (TXT in the script) or written as entities ("&hellip;" in HTML). The page then looks the
        same however the web resource is uploaded or served. Never paste symbols such as check marks, arrows, bullets or
        long dashes straight into this file: they turn into garbled text or emoji in Dataverse.
    -->
    <style>
        /* =====================================================================
         1. THEME & BASE
         ===================================================================== */
        :root {
            --primary: #0f6cbd;
            --primary-hover: #115ea3;
            --primary-press: #0c3b5e;
            --danger: #c50f1f;
            --danger-hover: #a80000;
            --text: #242424;
            --subtle: #5c5c5c;
            --border: #e0e0e0;
            --input-border: #c8c8c8;
            --surface: #ffffff;
            --canvas: #f7f7f8;
            --selected: #eef5fc;
            --hover: #f5f9fd;
            --warn-bg: #fff4ce;
            --warn-border: #f2c661;
            --warn-text: #6b4a00;
            --warn-icon: #c38500;
            --ok-bg: #f1faf1;
            --ok-text: #0e700e;
            --err-bg: #fdf3f4;
            --err-border: #eeacb2;
            --err-text: #b10e1c;
            --info-bg: #eef5fc;
            --info-border: #b4d6fa;
            --amt-old: #b10e1c;
            --amt-new: #0e700e;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 0 1px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--canvas);
            color: var(--text);
            font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system,
                BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
            font-size: 15px;
            line-height: 1.5;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Visible keyboard focus on every clickable control */
        button:focus-visible,
        a:focus-visible,
        summary:focus-visible,
        select:focus-visible,
        input[type="checkbox"]:focus-visible,
        input[type="radio"]:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* =====================================================================
         2. PAGE FRAME - header + stage tracker, banners, content, footer
         ===================================================================== */

        /* ---------- Header ---------- */
        .hdr {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px 12px;
        }

        /* One row of labelled fields: lease name, tenant, charge ID, frequency (bulk: the counts) */
        .hdr-main {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 24px;
            font-size: 14px;
            color: var(--subtle);
        }

        /* Labelled fields in a row (header, lease headings, charge cards): grey field name, dark value, dot between */
        .hfs {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            row-gap: 2px;
        }

        .hf {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            min-width: 0;
        }

        .hf+.hf::before {
            content: "";
            flex: none;
            align-self: center;
            width: 4px;
            height: 4px;
            margin: 0 4px 0 9px;
            border-radius: 50%;
            background: var(--input-border);
        }

        .hf-k {
            color: var(--subtle);
            font-weight: 400;
            white-space: nowrap;
        }

        .hf-v {
            color: var(--text);
            font-weight: 600;
        }

        .hdr-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
        }

        /* Separator dot between header / meta items (drawn with CSS, so it never depends on the file encoding) */
        .dot::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 4px;
            margin: 0 8px;
            border-radius: 50%;
            background: var(--input-border);
            vertical-align: middle;
        }

        /* ---------- Stage tracker (Steps 1-3) ---------- */
        .steps {
            display: flex;
            gap: 12px;
            list-style: none;
            margin: 14px 0 0;
            padding: 0;
        }

        .steps li {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            padding-top: 8px;
            border-top: 3px solid var(--border);
            color: var(--subtle);
            font-size: 13px;
        }

        .steps li.active {
            border-top-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .steps li.done {
            border-top-color: #8ab6e3;
            color: var(--text);
        }

        .step-no {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ededed;
            color: var(--subtle);
            font-size: 12px;
            font-weight: 600;
        }

        .steps li.active .step-no {
            background: var(--primary);
            color: #fff;
        }

        .steps li.done .step-no {
            background: #cfe4f7;
            color: var(--primary-press);
        }

        .step-no .ico {
            width: 13px;
            height: 13px;
        }

        /* ---------- Banners (errors / warnings above the content) ---------- */
        .banners {
            padding: 14px 24px 0;
        }

        .banners:empty {
            display: none;
        }

        .banner {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border: 1px solid;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .banner .ico {
            margin-top: 2px;
        }

        .banner.error {
            background: var(--err-bg);
            border-color: var(--err-border);
            color: var(--err-text);
        }

        .banner.warn {
            background: var(--warn-bg);
            border-color: var(--warn-border);
            color: var(--warn-text);
        }

        .banner.warn .ico {
            color: var(--warn-icon);
        }

        /* ---------- Content area ---------- */
        .content {
            flex: 1;
            overflow: auto;
            padding: 18px 24px 22px;
        }

        .lead {
            margin: 0 0 14px;
            font-size: 15px;
        }

        /* ---------- Footer (Cancel / Reject / Back / Next) ---------- */
        .ftr {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .spacer {
            flex: 1;
        }

        /* =====================================================================
         3. SHARED BUILDING BLOCKS - used by several stages
         ===================================================================== */

        /* ---------- Icons (inline SVG, see ICONS in the script) ---------- */
        .ico {
            flex: none;
            width: 16px;
            height: 16px;
            vertical-align: -3px;
        }

        .ico.sm {
            width: 13px;
            height: 13px;
            vertical-align: -2px;
        }

        /* Square button that holds only an icon (popup close) */
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            color: var(--subtle);
            background: transparent;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .icon-btn:hover {
            color: var(--text);
            background: #f0f0f0;
        }

        /* ---------- Cards and text ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 14px;
        }

        .card.flush {
            padding: 0;
            overflow: hidden;
        }

        .card h3 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            margin: 0 0 14px;
            font-size: 16px;
            font-weight: 600;
        }

        .card h3::before {
            content: "";
            flex: none;
            width: 4px;
            height: 17px;
            border-radius: 2px;
            background: var(--primary);
        }

        .card h3 .hint {
            font-weight: 400;
        }

        .hint {
            color: var(--subtle);
            font-size: 13px;
        }

        /* Label / value grid */
        .kv {
            display: grid;
            grid-template-columns: minmax(170px, 250px) 1fr;
            gap: 9px 18px;
            margin-top: 14px;
            font-size: 14px;
        }

        .kv .k {
            color: var(--subtle);
        }

        .big {
            font-size: 20px;
            font-weight: 600;
        }

        .strong {
            font-weight: 600;
        }

        /* Nothing to show (e.g. no open increase on a charge) */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 34px 16px;
            text-align: center;
            color: var(--subtle);
        }

        .empty .ico {
            width: 24px;
            height: 24px;
        }

        .rc-link {
            color: var(--primary);
            text-decoration: none;
        }

        .rc-link:hover {
            text-decoration: underline;
        }

        /* ---------- Amounts: old (red) to revised (green) ---------- */
        .amt-old {
            color: var(--amt-old);
            font-weight: 600;
        }

        .amt-new {
            color: var(--amt-new);
            font-weight: 600;
        }

        .amt-arrow {
            margin: 0 4px;
            color: var(--subtle);
        }

        /* ---------- Badges (statuses and tags) ---------- */
        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 11px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid transparent;
            margin-right: 5px;
        }

        .badge.pending {
            background: var(--info-bg);
            color: var(--primary);
        }

        .badge.approved {
            background: var(--ok-bg);
            color: var(--ok-text);
        }

        .badge.rejected {
            background: var(--err-bg);
            color: var(--err-text);
        }

        .badge.missed {
            background: var(--warn-bg);
            color: #835b00;
        }

        .badge.latest {
            background: var(--surface);
            color: var(--primary);
            border-color: var(--primary);
        }

        .badge.current {
            background: #f5f5f5;
            color: var(--subtle);
            border-color: var(--input-border);
        }

        .badge.untouched {
            background: #f5f5f5;
            color: var(--subtle);
        }

        /* Planned rejection (not saved yet): outlined, so it doesn't read as already Rejected */
        .badge.to-reject {
            background: var(--surface);
            color: var(--err-text);
            border-color: var(--err-border);
        }

        /* Created before the CPI index was published: the index is set on Step 2 */
        .badge.cpi {
            background: var(--warn-bg);
            color: #835b00;
        }

        /* ---------- Tables (Step 1, bulk result) ---------- */
        .tbl-wrap {
            overflow-x: auto;
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tbl th {
            text-align: left;
            font-weight: 600;
            color: var(--subtle);
            font-size: 12px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
            /* Headings wrap onto two lines so the table fits without a horizontal scrollbar */
            white-space: normal;
            line-height: 1.3;
        }

        .tbl th.num {
            max-width: 110px;
        }

        .tbl td {
            padding: 11px 10px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .tbl tr:last-child td {
            border-bottom: 0;
        }

        .tbl .num {
            text-align: right;
        }

        .tbl td.num {
            white-space: nowrap;
        }

        /* Row states: clickable, picked */
        .tbl tr.selectable {
            cursor: pointer;
        }

        .tbl tr.selectable:hover td {
            background: var(--hover);
        }

        .tbl tr.picked td {
            background: var(--selected);
        }

        /* ---------- Message boxes (icon + text) and inline errors ---------- */
        .warn-box,
        .info-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border: 1px solid;
            border-radius: 6px;
            font-size: 14px;
        }

        .warn-box>.ico,
        .info-box>.ico {
            margin-top: 2px;
        }

        .warn-box {
            margin-top: 12px;
            background: var(--warn-bg);
            border-color: var(--warn-border);
            border-left: 4px solid var(--warn-icon);
            color: var(--warn-text);
        }

        .warn-box>.ico {
            color: var(--warn-icon);
        }

        .info-box {
            background: var(--info-bg);
            border-color: var(--info-border);
        }

        .info-box>.ico {
            color: var(--primary);
        }

        .field-err {
            color: var(--err-text);
            font-size: 13px;
            margin-top: 5px;
        }

        /* ---------- "Show details" - secondary information, collapsed by default ---------- */
        .more {
            margin-top: 16px;
        }

        .more>summary {
            width: max-content;
            cursor: pointer;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
        }

        .more>summary:hover {
            text-decoration: underline;
        }

        .more-b {
            margin-top: 10px;
        }

        /* ---------- Amount flow: charge amount + add-on (+ additional) = revised (Steps 2-3) ---------- */
        .flow {
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 2px;
            padding: 14px 16px;
            background: linear-gradient(180deg, #fcfdfe 0%, #f4f8fc 100%);
            border: 1px solid var(--info-border);
            border-radius: 8px;
        }

        .flow-item {
            flex: 1 1 130px;
            min-width: 112px;
        }

        .flow-k {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        .flow-v {
            margin-top: 3px;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .flow-item.total .flow-v {
            font-size: 23px;
        }

        /* Line under a flow value: "per month" under the new rent, when the one-time charge is invoiced */
        .flow-sub {
            margin-top: 2px;
            font-size: 12px;
            color: var(--subtle);
        }

        /* The one-time (missed-period) charge after the new rent: set apart, as it is billed once, not every cycle */
        .flow-item.once {
            margin-left: 14px;
            padding-left: 18px;
            border-left: 1px dashed var(--info-border);
        }

        .flow-op {
            flex: none;
            align-self: center;
            padding: 0 12px;
            font-size: 19px;
            font-weight: 600;
            color: var(--subtle);
        }

        /* ---------- Inputs ---------- */
        .input-num,
        .input-date {
            height: 38px;
            padding: 0 12px;
            font: inherit;
            border: 1px solid var(--input-border);
            border-bottom-color: var(--subtle);
            border-radius: 5px;
            background: var(--surface);
        }

        .input-num {
            width: 220px;
            font-size: 16px;
        }

        .input-num:focus,
        .input-date:focus {
            outline: none;
            border-bottom: 2px solid var(--primary);
        }

        /* Small field: label above an input or index tile */
        .field-sm .lbl {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--subtle);
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-width: 112px;
            height: 38px;
            padding: 0 18px;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--input-border);
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover:not(:disabled) {
            background: #f3f3f3;
        }

        .btn-primary {
            color: #fff;
            background: var(--primary);
            border-color: transparent;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-primary:active:not(:disabled) {
            background: var(--primary-press);
        }

        .btn-danger {
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger:hover:not(:disabled) {
            color: #fff;
            background: var(--danger-hover);
        }

        .btn:disabled {
            color: #bdbdbd;
            background: #f0f0f0;
            border-color: #e0e0e0;
            cursor: default;
        }

        .link-btn {
            background: none;
            border: 0;
            padding: 0;
            color: var(--primary);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .link-btn:hover {
            text-decoration: underline;
        }

        /* ---------- Loading overlay ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.82);
            z-index: 20;
            font-weight: 600;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #c7e0f4;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================================
         4. BULK APPROVAL - one panel per lease agreement, one card per charge
         ===================================================================== */
        /* Lease panel: a header band, then its charge cards on a grey body, so each lease reads as its own
           block. No overflow: hidden, so the sticky summary card on Step 2 keeps working. */
        .lease {
            margin-bottom: 24px;
            background: #f0f3f7;
            border: 1px solid #d5dde7;
            border-radius: 10px;
        }

        /* Panel header band: "Lease 1 of 2", then the labelled fields (Lease name, Tenant) */
        .lease-h {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 14px;
            margin: 0;
            padding: 10px 16px;
            background: var(--info-bg);
            border-bottom: 1px solid var(--info-border);
            border-radius: 9px 9px 0 0;
            box-shadow: inset 4px 0 0 var(--primary);
            font-size: 15px;
            font-weight: 400;
            color: var(--subtle);
        }

        /* "Lease 1 of 2" */
        .lease-no {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            white-space: nowrap;
            color: var(--primary);
        }

        .lease-b {
            padding: 14px;
        }

        .lease-b>.card:last-child,
        .lease-b>.sum-row:last-child {
            margin-bottom: 0;
        }

        /* Charge card: header (name, amount, decision) + body (the step's content) */
        .card.charge {
            padding: 0;
            overflow: hidden;
        }

        .charge-h {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 11px 16px;
            background: #fafafa;
            border-bottom: 1px solid var(--border);
        }

        /* "Recurring charge" + RC name (link), then the labelled fields Charge ID, Frequency, Current rent, Adjustment */
        .charge-title {
            min-width: 0;
            font-weight: 600;
        }

        .charge-k {
            margin-right: 6px;
            font-size: 13px;
            font-weight: 400;
            color: var(--subtle);
        }

        .charge-meta {
            margin-top: 2px;
            font-size: 13px;
            font-weight: 400;
            color: var(--subtle);
        }

        /* Why a charge can't be approved / couldn't load */
        .charge-msg {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 16px;
            background: var(--warn-bg);
            border-bottom: 1px solid var(--warn-border);
            color: var(--warn-text);
            font-size: 13px;
        }

        .charge-msg .ico {
            margin-top: 2px;
            color: var(--warn-icon);
        }

        .charge-b {
            padding: 16px;
        }

        .charge-b.flush {
            padding: 0;
        }

        .charge.skipped .charge-b {
            opacity: 0.55;
        }

        /* To approve / To reject / Skip selector (Step 1) */
        .decision {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--subtle);
        }

        .decision select {
            height: 32px;
            padding: 0 8px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--input-border);
            border-radius: 5px;
        }

        /* "Before you continue" list (must stay after .warn-box) */
        .issues {
            margin: 0 0 14px;
        }

        .issues ul {
            margin: 6px 0 0;
            padding-left: 20px;
        }

        /* Lease agreement heading row in the result table */
        .tbl tr.grp td {
            padding: 8px 10px;
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            color: var(--subtle);
            font-size: 13px;
        }

        .tbl tr.grp td strong {
            color: var(--text);
        }

        /* =====================================================================
         5. STEP 1 - SELECT INCREASE (open increases only)
         ===================================================================== */
        .tbl .c-radio {
            width: 38px;
            text-align: center;
        }

        /* Increase table: the four value columns (Effective from, CPI increase, Current rent, New rent) get the
           same width and are all right-aligned, so they are evenly spaced; the last one keeps some room from the card edge */
        .hist th:nth-child(n+3),
        .hist td:nth-child(n+3) {
            width: 15%;
            text-align: right;
        }

        .hist th:last-child,
        .hist td:last-child {
            padding-right: 24px;
        }

        /* CPI-pending row: why there is no CPI increase / new rent yet, in words instead of a dash */
        .pend {
            white-space: normal;
            font-size: 13px;
            line-height: 1.35;
            color: var(--warn-text);
        }

        .pend.muted {
            color: var(--subtle);
        }

        .pend-sub {
            display: block;
            font-size: 12px;
            color: var(--subtle);
        }

        /* "Latest" / "Selected" / "CPI pending" tags under the adjustment name */
        .tags {
            margin-top: 3px;
            white-space: nowrap;
        }

        /* Schedule dates under the adjustment name */
        .sched {
            margin-top: 2px;
            white-space: nowrap;
        }

        /* A missing schedule or date is called out, not left blank */
        .sched .missing {
            color: var(--warn-text);
            font-style: italic;
        }

        /* =====================================================================
         6. STEP 2 - REVIEW & START
         Questions on the left (numbered, in plain words, only the ones that apply) and a live
         summary card on the right. The comparison, timeline, split editor and summary points
         are also used on Step 3.
         ===================================================================== */
        .rv-intro {
            margin: -6px 0 22px;
            font-size: 14px;
            color: var(--subtle);
        }

        .rv {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 28px;
            align-items: start;
        }

        /* The summary card stays in view while the questions scroll */
        .rv-side {
            position: sticky;
            top: 0;
        }

        @media (max-width: 860px) {
            .rv {
                grid-template-columns: 1fr;
            }

            .rv-side {
                position: static;
            }
        }

        /* Small section heading (Step 3 and bulk rows): "Summary", "What will change" */
        .rv-h {
            margin: 20px 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        /* ---------- Questions: number bubble + title + body ---------- */
        .q {
            display: flex;
            gap: 14px;
            margin-bottom: 28px;
        }

        .q-no {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
        }

        /* Optional question: grey "+" bubble */
        .q-no.opt {
            background: #ededed;
            color: var(--subtle);
            font-size: 16px;
        }

        .q-main {
            flex: 1;
            min-width: 0;
        }

        .q-title {
            margin: 1px 0 4px;
            font-size: 16px;
            font-weight: 600;
        }

        .q-opt {
            margin-left: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        .q-desc {
            margin: 0 0 12px;
            font-size: 14px;
            color: var(--subtle);
        }

        .q-text {
            margin: 0;
        }

        .q-meta {
            margin-top: 14px;
            font-size: 14px;
        }

        /* Effective date being changed: label, date box, Done */
        .eff-edit {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .eff-edit .lbl {
            margin: 0;
            font-size: 14px;
            color: var(--text);
        }

        /* What the new index means: up (green) or down / unchanged (warning) */
        .q-result {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            font-size: 14px;
        }

        .q-result .ico {
            margin-top: 3px;
        }

        .q-result.ok {
            color: var(--ok-text);
        }

        .q-result.warn {
            color: var(--warn-text);
        }

        .q-result.warn .ico {
            color: var(--warn-icon);
        }

        /* Lease floor / cap under the CPI question, with the "Apply the lease minimum / maximum" tick box */
        .lim {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 12px;
            background: var(--info-bg);
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            font-size: 14px;
        }

        .lim>.ico {
            margin-top: 3px;
            color: var(--primary);
        }

        .lim .check {
            margin-top: 8px;
        }

        .lim-warn {
            font-weight: 600;
            color: var(--warn-text);
        }

        /* "Capped at 3%" / "Minimum 2% applied" under a CPI increase amount (Step 1 table, summary card) */
        .lim-tag {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--subtle);
            white-space: nowrap;
        }

        /* In the narrow summary card the tag may wrap, so the labels keep their width */
        .sc .lim-tag {
            white-space: normal;
        }

        /* ---------- CPI index: old index (text) -> new index (button) ---------- */
        .idx-line {
            display: flex;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }

        .idx-old {
            display: flex;
            flex-direction: column;
        }

        .lbl-sm {
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        .idx-num {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            font-variant-numeric: tabular-nums;
        }

        .idx-arrow {
            margin-top: 30px;
            color: var(--subtle);
        }

        .idx-arrow .ico {
            width: 20px;
            height: 20px;
        }

        .idx-new {
            display: flex;
            flex-direction: column;
            flex: 0 1 300px;
            min-width: 220px;
        }

        /* New index button: value + where it came from + pencil. Opens the index editor popup. */
        .idx-tile {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 56px;
            padding: 8px 10px 8px 12px;
            font: inherit;
            text-align: left;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            cursor: pointer;
        }

        .idx-tile:hover {
            border-color: var(--primary);
            background: var(--hover);
        }

        /* No value yet: dashed outline, "Choose new index" in the primary colour */
        .idx-tile.unset {
            border-style: dashed;
            border-color: var(--primary);
            background: var(--selected);
        }

        .idx-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .idx-value {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            font-variant-numeric: tabular-nums;
        }

        .idx-tile.unset .idx-value {
            font-size: 15px;
            color: var(--primary);
        }

        .idx-src {
            font-size: 12px;
            color: var(--subtle);
        }

        .idx-src .linked {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--ok-text);
            font-weight: 600;
        }

        .idx-edit {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            color: var(--primary);
            background: var(--selected);
        }

        .idx-tile:hover .idx-edit,
        .idx-tile.unset .idx-edit {
            color: #fff;
            background: var(--primary);
        }

        /* ---------- Missed-period box (inside the chosen "Next billing cycle" card): tick box + amount ---------- */
        .ot-box {
            margin-top: 12px;
            padding: 12px 14px;
            background: #f8fbfe;
            border: 1px solid var(--info-border);
            border-radius: 8px;
            cursor: default;
        }

        .ot-box label:not(.check) {
            display: block;
            margin-bottom: 3px;
            font-size: 13px;
            color: var(--subtle);
        }

        /* Amount block under the "Charge the missed period" tick box */
        .ot-amt {
            margin: 10px 0 0 25px;
        }

        .ot-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        /* Recommended amount / not-charged note */
        .ot-note {
            margin-top: 6px;
        }

        .ot-box>.ot-note {
            margin-left: 25px;
        }

        /* ---------- Optional extra amount ---------- */
        .extra-box .input-num {
            width: 200px;
        }

        /* "CPI-002, an older increase of 20.00, was never applied - Add its 20.00 to the new rent" */
        .note {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 0 0 12px;
            padding: 10px 12px;
            background: #fffbea;
            border-left: 3px solid var(--warn-icon);
            border-radius: 4px;
            font-size: 14px;
        }

        .note>.ico {
            margin-top: 3px;
            color: var(--warn-icon);
        }

        /* ---------- Live summary card ("What changes") ---------- */
        .sc {
            padding: 16px 18px;
            background: linear-gradient(180deg, #fcfdfe 0%, #f2f7fc 100%);
            border: 1px solid var(--info-border);
            border-radius: 10px;
        }

        .sc-h {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        .sc-k {
            font-size: 14px;
            color: var(--subtle);
        }

        .sc-amt {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.25;
            white-space: nowrap;
        }

        .sc-sub {
            margin-top: 2px;
            font-size: 13px;
            color: var(--subtle);
        }

        .sc-rows {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 12px;
            margin: 14px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--info-border);
            font-size: 14px;
        }

        .sc-rows dt {
            color: var(--subtle);
        }

        .sc-rows dd {
            margin: 0;
            text-align: right;
            font-weight: 600;
        }

        .sc-none {
            font-weight: 400;
            color: var(--subtle);
        }

        .sc-warn {
            font-weight: 600;
            color: var(--warn-text);
        }

        .sc-note {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--subtle);
        }

        .sc-note .ico {
            margin-top: 2px;
        }

        .sc-note.warn {
            color: var(--warn-text);
        }

        .sc-note.warn .ico {
            color: var(--warn-icon);
        }

        /* What is still missing (instead of red errors): light yellow, like the other notes */
        .sc-todo {
            margin-top: 14px;
            padding: 10px 12px;
            background: #fffbea;
            border: 1px solid var(--warn-border);
            border-radius: 8px;
            font-size: 14px;
        }

        .sc-todo strong {
            color: var(--warn-text);
        }

        .sc-todo ul {
            margin: 4px 0 0;
            padding-left: 18px;
        }

        .sc-ready {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ok-text);
        }

        /* ---------- Summary points (Step 3 and bulk rows): one icon per line ---------- */
        .points {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 14px;
        }

        .points li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 4px 0;
        }

        .points li>.ico {
            margin-top: 3px;
            color: var(--subtle);
        }

        /* Rent not collected / start in the past */
        .points li.warn {
            padding: 7px 10px;
            background: var(--warn-bg);
            border-left: 3px solid var(--warn-icon);
            border-radius: 4px;
            color: var(--warn-text);
        }

        .points li.warn>.ico {
            color: var(--warn-icon);
        }

        /* Nothing lost / covered by the missed-period charge */
        .points li.ok,
        .points li.ok>.ico {
            color: var(--ok-text);
        }

        /* ---------- Old vs new charge comparison ---------- */
        .cmp {
            display: flex;
            align-items: stretch;
            gap: 14px;
            margin-top: 14px;
        }

        .cmp-col {
            flex: 1 1 0;
            min-width: 0;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .cmp-col.old {
            border-left: 4px solid var(--amt-old);
        }

        .cmp-col.new {
            border-left: 4px solid var(--amt-new);
        }

        .cmp-h {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        .cmp-amt {
            margin: 3px 0 10px;
            font-size: 24px;
            font-weight: 600;
        }

        .cmp-dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 14px;
            margin: 0;
            font-size: 14px;
        }

        .cmp-dl dt {
            color: var(--subtle);
            white-space: nowrap;
        }

        .cmp-dl dd {
            margin: 0;
        }

        .cmp-arrow {
            flex: none;
            align-self: center;
            color: var(--subtle);
        }

        .cmp-arrow .ico {
            width: 22px;
            height: 22px;
        }

        @media (max-width: 680px) {
            .cmp {
                flex-direction: column;
            }

            .cmp-arrow {
                display: none;
            }
        }

        /* ---------- Start options: one card per option (the chosen one holds the missed-period box or split editor) ---------- */
        .opt {
            padding: 12px 16px;
            margin-bottom: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .opt:last-child {
            margin-bottom: 0;
        }

        .opt:hover {
            border-color: var(--info-border);
        }

        .opt.sel {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
            background: var(--selected);
        }

        /* The only option: shown selected, nothing to click */
        .opt.only {
            cursor: default;
        }

        .opt-head {
            display: flex;
            gap: 11px;
            align-items: flex-start;
        }

        .opt-head input {
            margin: 4px 0 0;
            flex: none;
            width: 16px;
            height: 16px;
        }

        .opt-title {
            font-size: 15px;
            font-weight: 600;
        }

        .opt-date {
            font-weight: 400;
            color: var(--subtle);
        }

        .opt-desc {
            color: var(--subtle);
            font-size: 14px;
            margin-top: 2px;
        }

        /* ---------- Split editor (timeline, then dates and proration behind "Change dates and proration") ---------- */
        .check {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .check.first {
            margin-top: 0;
        }

        .check input {
            margin: 4px 0 0;
            flex: none;
            width: 16px;
            height: 16px;
        }

        .split-box {
            margin-top: 14px;
            padding: 12px 16px 14px;
            border: 1px solid var(--info-border);
            border-radius: 8px;
            background: #f8fbfe;
        }

        .split-box .more {
            margin-top: 10px;
        }

        .split-foot {
            margin-top: 12px;
            font-size: 14px;
        }

        .timeline {
            display: flex;
            height: 32px;
            margin: 4px 0 5px;
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
            font-size: 12px;
            font-weight: 600;
        }

        .seg {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 0 5px;
            overflow: hidden;
            white-space: nowrap;
        }

        .seg.old {
            background: #f3d4d7;
            color: #7a0b14;
        }

        .seg.gap {
            background: repeating-linear-gradient(45deg, #fff4ce, #fff4ce 5px, #f2c661 5px, #f2c661 10px);
            color: var(--warn-text);
        }

        .seg.new {
            background: #cdebcd;
            color: #0b5a0b;
        }

        .timeline-scale {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--subtle);
        }

        /* Key under the split bar: color, amount, dates and days of each piece */
        .timeline-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
            font-size: 12px;
        }

        .timeline-legend li {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-legend .seg {
            flex: none;
            width: 10px;
            height: 10px;
            padding: 0;
            border-radius: 2px;
        }

        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .split-col {
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .split-col h4 {
            margin: 0 0 10px;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 620px) {
            .split-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =====================================================================
         7. INDEX EDITOR POPUP - choose the old / new CPI index (Step 2)
         Tabs at the top: "Pick from CPI list" | "Enter manually"; Cancel / Apply below.
         ===================================================================== */
        .modal-wrap {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.32);
        }

        .modal {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 460px;
            max-height: 100%;
            background: var(--surface);
            border-radius: 10px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
        }

        .modal-h {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 14px 4px 20px;
        }

        .modal-h h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
        }

        .modal-sub {
            padding: 0 20px;
            font-size: 13px;
            color: var(--subtle);
        }

        .modal-b {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 14px 20px 18px;
        }

        .modal-f {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 20px 16px;
            border-top: 1px solid var(--border);
        }

        /* Tabs: segmented control */
        .tabs {
            display: flex;
            gap: 2px;
            padding: 3px;
            margin-bottom: 14px;
            background: #f0f0f0;
            border-radius: 7px;
        }

        .tab {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 34px;
            padding: 0 10px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--subtle);
            background: transparent;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab:hover:not(:disabled):not(.sel) {
            color: var(--text);
        }

        .tab.sel {
            color: var(--primary);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .tab:disabled {
            color: #bdbdbd;
            cursor: default;
        }

        /* Pick list: one row per CPI index (month, value) */
        .pick-h {
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--subtle);
        }

        .pick-list {
            max-height: 260px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .pick-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            cursor: pointer;
        }

        .pick-row:last-child {
            border-bottom: 0;
        }

        .pick-row:hover {
            background: var(--hover);
        }

        .pick-row.sel {
            background: var(--selected);
        }

        .pick-row input {
            flex: none;
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .pick-month {
            flex: 1;
        }

        .pick-v {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* Manual entry */
        .modal .input-num {
            width: 100%;
        }

        .modal .hint {
            margin-top: 6px;
        }

        /* =====================================================================
         8. STEP 3 - CONFIRM
         ===================================================================== */

        /* "What will change" list */
        .changes {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .changes li {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 9px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .changes li:last-child {
            border-bottom: 0;
        }

        .changes .badge {
            min-width: 118px;
            text-align: center;
        }

        /* Bulk "Ready to save" card: counts, then the one-transaction note */
        .ready {
            margin: 0;
        }

        .ready-note {
            margin: 6px 0 0;
        }

        /* ---------- Bulk: one compact row per charge, click to expand ---------- */
        .sum-head,
        .sum-row>summary {
            display: grid;
            grid-template-columns: minmax(200px, 2fr) minmax(90px, 1fr) minmax(110px, 1fr) minmax(190px, 1.3fr) 64px 110px 16px;
            gap: 12px;
            align-items: center;
            padding: 10px 14px;
        }

        .sum-head {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--subtle);
        }

        .sum-row {
            margin-bottom: 8px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .sum-row>summary {
            cursor: pointer;
            list-style: none;
            font-size: 14px;
        }

        .sum-row>summary::-webkit-details-marker {
            display: none;
        }

        .sum-row>summary:hover {
            background: var(--hover);
        }

        .sum-row[open]>summary {
            border-bottom: 1px solid var(--border);
        }

        .sum-head .num,
        .sum-row>summary .num {
            text-align: right;
            white-space: nowrap;
        }

        /* Second line in a cell: start option, "+ missed period ...", missed-period charge link */
        .sum-sub {
            display: block;
            font-size: 12px;
            color: var(--subtle);
        }

        .sum-charge {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .sum-chev {
            display: inline-flex;
            color: var(--subtle);
            transition: transform 0.15s;
        }

        .sum-row[open] .sum-chev {
            transform: rotate(90deg);
        }

        .sum-row-b {
            padding: 4px 16px 16px;
        }

        /* Notify column: "Send notification email" tick box per approved charge (a label, so a click
           on it ticks the box instead of opening the row) */
        .sum-notify {
            text-align: center;
        }

        .sum-notify label {
            display: inline-flex;
            padding: 4px 8px;
            cursor: pointer;
        }

        .sum-notify input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        @media (max-width: 760px) {
            .sum-head {
                display: none;
            }

            .sum-row>summary {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* =====================================================================
         9. RESULT - approved / rejected / load error
         ===================================================================== */
        .result {
            border-left: 4px solid;
        }

        .result.ok {
            border-left-color: #107c10;
        }

        .result.err {
            border-left-color: var(--danger);
        }

        .result-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-title .ico {
            width: 22px;
            height: 22px;
        }

        .result.ok .result-title {
            color: var(--ok-text);
        }

        .result.err .result-title {
            color: var(--err-text);
        }

        /* =====================================================================
         10. COMPACT - laptop-size dialogs (narrow or short): tighter spacing so more fits
         and the page stays readable. The launcher opens the dialog at least ~1100px wide.
         ===================================================================== */
        @media (max-width: 1240px),
        (max-height: 760px) {

            html,
            body {
                font-size: 14px;
            }

            .hdr {
                padding: 10px 18px 8px;
            }

            .hdr-main {
                font-size: 13px;
            }

            .hdr-name {
                font-size: 15px;
            }

            .steps {
                margin-top: 8px;
            }

            .steps li {
                padding-top: 6px;
            }

            .banners {
                padding: 10px 18px 0;
            }

            .content {
                padding: 12px 18px 16px;
            }

            .ftr {
                padding: 10px 18px;
            }

            .btn {
                height: 34px;
                min-width: 96px;
                font-size: 14px;
            }

            .lead {
                margin-bottom: 10px;
                font-size: 14px;
            }

            .card {
                padding: 14px 16px;
                margin-bottom: 12px;
            }

            .lease-b {
                padding: 10px;
            }

            .card h3 {
                margin-bottom: 10px;
                font-size: 15px;
            }

            .tbl th,
            .tbl td {
                padding: 8px 10px;
            }

            .rv-intro {
                margin-bottom: 14px;
            }

            .q {
                margin-bottom: 20px;
            }

            .opt {
                padding: 10px 14px;
            }

            .sc {
                padding: 14px;
            }

            .sc-amt {
                font-size: 24px;
            }

            .idx-num {
                font-size: 20px;
            }

            .flow-v {
                font-size: 16px;
            }

            .flow-item.total .flow-v {
                font-size: 20px;
            }
        }

        /* Laptop width (above the one-column layout): narrower summary column */
        @media (min-width: 861px) and (max-width: 1240px) {
            .rv {
                grid-template-columns: minmax(0, 1fr) 260px;
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Header: charge name (one charge) or bulk summary + stage tracker (Steps 1-3) -->
        <header class="hdr">
            <div class="hdr-main" id="hdrSub"></div>
            <ol class="steps" id="steps"></ol>
        </header>
        <!-- Errors and warnings -->
        <div class="banners" id="banners"></div>
        <!-- Current stage is rendered here by render() -->
        <main class="content" id="content"></main>
        <!-- Footer buttons; visibility and labels are set by renderFooter() -->
        <footer class="ftr">
            <button type="button" class="btn" id="btnCancel">Cancel</button>
            <span class="spacer"></span>
            <button type="button" class="btn btn-danger" id="btnReject" hidden>Reject</button>
            <button type="button" class="btn" id="btnBack" hidden>Back</button>
            <button type="button" class="btn btn-primary" id="btnNext" disabled>Next</button>
        </footer>
    </div>

    <!-- Index editor popup (Step 2); content is set by renderIndexEditor() -->
    <div class="modal-wrap" id="modal" hidden></div>

    <!-- Loading / saving overlay -->
    <div class="overlay" id="overlay" hidden>
        <div class="spinner"></div>
        <div id="overlayText">Loading&hellip;</div>
    </div>

    <script>
        /* =====================================================================
           CPI RENT INCREASE APPROVAL
           ---------------------------------------------------------------------
           Opened as a dialog by the CPI Approval button script with one or more
           CPI Adjustment History ids.

           STAGES
             LOAD    Read the selected histories, group them by recurring charge, load each charge.
             STEP 1  Select increase     - which active Draft history to act on
                                           (bulk: plus To approve / To reject / Skip per charge).
             STEP 2  Review & start      - short numbered questions on the left, a live "What changes" card on
                                           the right: the CPI index and effective date (chosen for a CPI-pending
                                           increase, editable on a saved one; each index set in a popup: picked
                                           from the CPI Index rows or entered manually), when the new rent
                                           starts (option cards: whole current cycle, split, or next cycle; the
                                           next cycle card holds "Charge the missed period" with its amount), and
                                           an optional extra amount.
             STEP 3  Confirm & approve   - "Send notification email" tick box (unticked by default; bulk: per
                                           charge + tick all), then one atomic $batch per approval: create the
                                           new RC, end the old RC, approve the history, mark older open histories Missed
                                           (CPI-pending or index changed: also the lease clause's current index and
                                           the CPI trigger), and set the CPI schedules of the approved and Missed
                                           histories Inactive / Completed.
             RESULT  What was saved.
             Secondary information (comparison, billing dates, lease clause) sits under "Show details".

           ONE CHARGE vs BULK
             One charge  The steps show that charge; Reject is a footer button.
             Bulk        The selection spans several charges. Every step shows ALL charges, in one
                         section per lease agreement and one card per recurring charge.
                         "Approve all" saves every approval and rejection in ONE changeset:
                         all or nothing.
             The step functions work on "the charge in `state`". Bulk runs them for each charge
             through withCharge().

           CODE SECTIONS (in this order)
              1. Configuration        9. Step 1 - Select increase
              2. State               10. Step 2 - Review & start
              3. Utilities & icons   11. Index editor popup (Step 2)
              4. Dataverse access    12. Step 3 - Confirm & approve
              5. Business rules      13. Reject & close
              6. Page frame          14. Result
              7. Load                15. Events & start-up
              8. Bulk frame

           ENCODING: keep this script plain ASCII. Use ICONS / icon() for symbols and TXT
           (String.fromCharCode) for typographic characters such as dashes.
           ===================================================================== */
        (function () {
            "use strict";

            /* =====================================================================
               1. CONFIGURATION
               Environment-specific values. Items marked UNCONFIRMED must be checked
               against the solution before go-live.
               ===================================================================== */

            // array_approvalstatus (global choice) - CONFIRMED
            const STATUS = { DRAFT: 1, PENDING: 2, APPROVED: 3, REJECTED: 4, MISSED: 5 };

            // Only histories with Approval Status = Draft AND Status = Active can be approved, rejected or
            // marked Missed; everything else is hidden from the page.
            const HISTORY_ACTIVE_STATECODE = 0;
            const STATUS_INFO = {
                1: { label: "Draft", cls: "untouched" },
                2: { label: "Pending", cls: "pending" },
                3: { label: "Approved", cls: "approved" },
                4: { label: "Rejected", cls: "rejected" },
                5: { label: "Missed", cls: "missed" }
            };

            // array_frequency (global choice "Frequency") values and the period each adds - CONFIRMED.
            // One Time Charge (126330002) has no cycle, so it is not here (see ONE_TIME_FREQUENCY).
            const FREQ = {
                126330000: { label: "Monthly", add: { unit: "month", n: 1 } },
                126330005: { label: "Quarterly", add: { unit: "month", n: 3 } },
                126330001: { label: "Annual", add: { unit: "month", n: 12 } },
                126330004: { label: "Weekly", add: { unit: "day", n: 7 } },
                126330003: { label: "Daily", add: { unit: "day", n: 1 } }
            };

            // Frequency "One Time Charge". Used for the missed-period charge; a CPI increase can't be applied to such a charge.
            const ONE_TIME_FREQUENCY = 126330002;

            // Recurring charge Active state/status. New RC is created Active; old RC is left ACTIVE (not deactivated).
            const RC_ACTIVE_STATECODE = 0,
                RC_ACTIVE_STATUSCODE = 1;

            // On approval, point the history's array_RecurringCharge at the new RC
            // (array_OldRecurringCharge keeps the charge it replaced).
            const LINK_HISTORY_TO_NEW_RC = true;

            // "Next full cycle": the old RC still has to invoice the current cycle, so its upcoming generation
            // date is kept and its End Date stops it afterwards. Set true only if billing ignores End Date.
            const CLEAR_OLD_UPCOMING_ON_NEXT_CYCLE = false;

            // CPI Adjustment History Yes/No column "Send Notification". Approval: Yes when the Step 3 tick box
            // is ticked, else No. Rejected and Missed histories: always No.
            const SEND_NOTIFICATION = "array_sendnotification";

            // Recurring Charge Yes/No column "CPI Split Flag", set on the current (old) charge at approval:
            // Yes when the split option is chosen (its last cycle is shorter), else No.
            const CPI_SPLIT_FLAG = "array_cpisplitflag";

            // Dataverse Web API version used for the approval $batch
            const API_VERSION = "v9.2";

            // Dataverse limit: one $batch (so one all-or-nothing bulk save) holds at most 1000 requests
            const MAX_CHANGESET_OPS = 1000;

            // Plain columns copied from the current RC to the new RC (same set as the CPI "new rc" batch)
            const RC_COPY_COLUMNS = [
                "array_chargename",
                "array_frequency",
                "array_prefrequencyoffset",
                "array_prorationenabled",
                "array_prorationenabledforfirstcycle",
                "array_prorationenabledforlastcycle",
                "array_dueindays",
                "array_invoicegenerationday",
                "array_useasinvoicecurrency",
                "array_invoiceseparately",
                "array_taxincluded",
                "array_billablearea",
                "array_exchangerateday",
                "array_duedaterule"
            ];

            // Lookups copied via @odata.bind. historyFallback = history column used when the RC has no value.
            const RC_COPY_LOOKUPS = [
                { attr: "array_raterule", nav: "array_RateRule", set: "array_exchangerateselectionruleses" },
                { attr: "array_chargetype", nav: "array_ChargeType", set: "array_chargetypes" },
                { attr: "array_leaseagreement", nav: "array_LeaseAgreement", set: "array_leaseagreements", historyFallback: "_array_leaseagreement_value" },
                { attr: "array_unit", nav: "array_Unit", set: "array_units" },
                { attr: "transactioncurrencyid", nav: "transactioncurrencyid", set: "transactioncurrencies" },
                { attr: "array_invoicetype", nav: "array_InvoiceType", set: "array_invoicetypes" },
                { attr: "array_invoiceprefix", nav: "array_InvoicePrefix", set: "array_invoiceprefixes" },
                { attr: "array_vat", nav: "array_VAT", set: "array_vats" },
                { attr: "array_bankaccountnumber", nav: "array_BankAccountNumber", set: "array_bankaccounts" },
                { attr: "array_property", nav: "array_Property", set: "array_properties" },
                { attr: "array_leaseclause", nav: "array_LeaseClause", set: "array_leaseclauses", historyFallback: "_array_leaseclause_value" }
            ];

            // Polymorphic tenant (customer) lookup: navigation property is array_Tenant_<entity>
            const RC_TENANT = { attr: "array_tenant", navPrefix: "array_Tenant_", sets: { account: "accounts", contact: "contacts" } };

            // Date columns read from the RC (billing cycle and generation dates)
            const RC_DATE_COLUMNS = [
                "array_startdate",
                "array_enddate",
                "array_frequencystartdate",
                "array_frequencyenddate",
                "array_invoicegenerationdate",
                "array_upcominginvoicegenerationday"
            ];

            // $select for the recurring charge: ids/status + copied columns + dates + lookups + tenant.
            // array_chargeid = Charge ID shown on each bulk card (read only, not copied: the new RC gets its own).
            const RC_SELECT = ["array_recurringchargeid", "array_chargeid", "array_amount", "array_frequencystartday", "statecode", "statuscode"]
                .concat(RC_COPY_COLUMNS, RC_DATE_COLUMNS)
                .concat(RC_COPY_LOOKUPS.map((l) => "_" + l.attr + "_value"))
                .concat(["_" + RC_TENANT.attr + "_value"])
                .join(",");

            // $select for the lease agreement: name, number, tenant and brand (shown on each lease section)
            const LEASE_SELECT = "array_leaseagreementid,array_leasename,array_leasenumber,_array_tenant_value,_array_brand_value";

            // $select for CPI Adjustment History
            const HISTORY_SELECT = [
                "array_cpiadjustmenthistoryid",
                "array_adjustmentid",
                "array_adjustmenteffectivefrom",
                "array_approvalstatus",
                "statecode",
                "array_previousrent",
                "array_increasedamount",
                "array_newrent",
                "array_additionalchargeamount",
                "array_indexchangepercentage",
                "array_previousindexvalue",
                "array_newindexvalue",
                "createdon",
                "_array_recurringcharge_value",
                "_array_oldrecurringcharge_value",
                "_array_leaseclause_value",
                "_array_leaseagreement_value",
                "_array_triggerid_value",
                "_array_cpiindex_value",
                "_array_cpiadjustmentschedule_value",
                "_transactioncurrencyid_value"
            ].join(",");

            // CPI Adjustment Schedule of each history (lookup array_CPIAdjustmentSchedule): Step 1 shows its dates
            // and its end date orders the histories (see sortHistories). End date CONFIRMED (the CPI run reads
            // array_enddate); start date column UNCONFIRMED - check the name in the solution.
            const SCHEDULE_START = "array_startdate",
                SCHEDULE_END = "array_enddate";

            // Approval closes the CPI schedules of the approved and Missed histories, and a rejection the schedule
            // of the rejected history: Status Inactive, Status Reason Completed (the same values the CPI run uses).
            const SCHEDULE_INACTIVE = 1,
                SCHEDULE_COMPLETED = 126330002;

            // Open increases: the lease clause gives the CPI type and current index, and the Step 2 index popup
            // offers the CPI Index rows of that CPI type from the last CPI_INDEX_MONTHS months. It also gives the
            // lease floor / cap of the CPI increase (Increase Type and its minimum / maximum, see leaseLimits).
            const CLAUSE_SELECT = [
                "array_leaseclauseid",
                "_array_cpitype_value",
                "array_currentindex",
                "array_increasetypecpirentprocess",
                "array_minimumincreasepercentagecpi",
                "array_maximumincreasepercentagecpi",
                "array_minimumincreaseflatamountcpi",
                "array_flatamountcpi"
            ].join(",");

            // Lease clause Increase Type (CPI) choices, as the CPI run's child flow reads them:
            // Percentage = Minimum / Maximum Increase % of the rent; Flat = Minimum Increase Flat Amount (floor)
            // and Flat Amount (cap)
            const INCREASE_TYPE = { FLAT: 126330000, PERCENTAGE: 126330001 };
            const CPI_INDEX_SELECT = "array_cpiindexid,array_indexvalue,array_perioddate,_array_cpitype_value";
            const CPI_INDEX_MONTHS = 24;

            // Lookup (navigation property) on CPI Adjustment History for the CURRENT CPI index picked on Step 2.
            // UNCONFIRMED: the history has no such column yet (only array_CPIIndex, the new index); once one is
            // added, set its navigation property here, e.g. "array_PreviousCPIIndex". null = only the value is saved.
            const PREVIOUS_CPI_INDEX_NAV = null;

            // History lookups that point at the charge being amended (see groupSelection)
            const OLD_RC = "_array_oldrecurringcharge_value",
                CUR_RC = "_array_recurringcharge_value";

            // Stage tracker labels shown in the header, in wizard order
            const STEP_NAMES = ["Select increase", "Review & start", "Confirm"];

            // Names of the start options (Step 2 choices and the Step 3 headline).
            // "current" and "next" never appear together: both are the next cycle that can still carry the new rent.
            const MODE_LABEL = { current: "Next billing cycle", next: "Next billing cycle", split: "Split the current cycle" };

            // Bulk: what "Approve all" will do with each charge. Worded and coloured as pending,
            // so a planned decision never looks like one that is already saved.
            const DECISION = {
                approve: { label: "To approve", cls: "pending" },
                reject: { label: "To reject", cls: "to-reject" },
                skip: { label: "Skip", cls: "untouched" }
            };

            // Matches every GUID in a string (global flag: used with String.match)
            const GUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;

            // Web API annotation suffix for formatted (display) values
            const FV = "@OData.Community.Display.V1.FormattedValue";

            // Large selections arrive through sessionStorage under this key (must match the launcher's SELECTION_KEY)
            const SELECTION_KEY = "array_cpiapproval_selection";

            // Ids per $filter when loading records by id (keeps each request URL short)
            const ID_CHUNK = 15;

            /* =====================================================================
               2. STATE
               ===================================================================== */

            /**
             * Fresh per-charge fields.
             * Steps 1-3 read these straight from `state`. Each charge keeps its own copy in
             * state.charges[i]; useCharge() / withCharge() swap a charge into `state`.
             * @returns {object}
             */
            function blankCharge() {
                return {
                    selectedIds: [], // histories on this charge that were selected in the view
                    histories: [],
                    oldRc: null,
                    cycle: null, // old RC's billing cycle (see readCycle)
                    symbol: "",
                    options: [], // start options for the picked history: [{ key, sch }]
                    startMode: null, // "current" | "split" | "next"
                    split: null, // editable split: { newStart, oldEnd, prorate, firstCycle, lastCycle, ... }
                    cpi: null, // picked increase: its CPI index values and effective date, set / changed on Step 2 (see initCpi)
                    pickedId: null,
                    additional: 0, // extra amount added to the new rent (Step 2, optional)
                    additionalRaw: "0",
                    extraOpen: false, // Step 2: the extra amount box is open
                    missedOn: true, // Next cycle: also create the missed-period charge (ticked by default)
                    limitsOn: true, // Step 2: apply the lease floor / cap to a calculated CPI increase (ticked by default)
                    oneTime: 0, // amount of the missed-period (one-time) charge (NaN while invalid)
                    oneTimeRaw: "",
                    oneTimeTouched: false, // false = follow the recommended amount
                    notify: false, // Step 3: "Send notification email" tick box (unticked by default)
                    step: 1,
                    decision: "skip", // bulk only: "approve" | "reject" | "skip"
                    blocker: null, // approval is not possible (reject still allowed)
                    error: null, // last action failure
                    done: null // { kind: "approved" | "rejected", ... }
                };
            }

            // Names of the per-charge fields that useCharge() swaps in and out of `state`
            const CHARGE_FIELDS = Object.keys(blankCharge());

            // Page state: global fields below + the fields of the charge currently in `state` (blankCharge)
            const state = Object.assign(
                {
                    xrm: null,
                    clientUrl: "",
                    launchIds: [], // every history id passed to the page
                    charges: [], // one per recurring charge in the selection: blankCharge() fields + rcId, leaseName, ...
                    active: -1, // index of the charge whose fields are in `state`; -1 = none
                    view: "charge", // "charge" = one charge | "bulk" = several charges, all shown on every step
                    bulkStep: 1, // bulk: current step (1-3)
                    bulkError: null, // bulk: last "Approve all" failure
                    bulkDone: null, // bulk: { approve, reject, skip } counts after a successful save
                    notice: null, // load warning, e.g. some selected records were not found
                    clauses: {}, // lease clauses of the open increases, by id (CPI type, current index)
                    cpiIndexes: [], // CPI Index rows offered in the index popup (newest first)
                    cpiLoadFailed: false, // the lease clauses / CPI Index rows could not be loaded
                    schedules: {}, // CPI Adjustment Schedules of the open histories, by id (start / end date)
                    schedLoadFailed: false, // the schedules could not be loaded
                    indexEditor: null, // open index editor popup (see openIndexEditor), or null
                    focusAfter: null, // id of the element to focus after the next render (e.g. the index tile after the popup)
                    openKeys: new Set(), // "Show details" / bulk rows the approver has opened (kept across re-renders)
                    busy: false,
                    fatal: null // load failure: nothing else can be shown
                },
                blankCharge()
            );

            /** Shorthand for document.getElementById. */
            const $ = (id) => document.getElementById(id);

            /** True when several charges are being approved together. */
            const isBulk = () => state.view === "bulk";
